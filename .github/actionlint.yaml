# actionlint configuration
# Docs: https://github.com/rhysd/actionlint/blob/main/docs/config.md
#
# The "paths" section maps glob patterns (relative to the repo root, always
# using "/" separators) to per-path settings. "ignore" is a list of regular
# expressions matched against error messages; matches are suppressed.

self-hosted-runner:
  labels: []

config-variables: null

paths:
  # Generated by gh-aw ("DO NOT EDIT", also marked linguist-generated in
  # .gitattributes). They use gh-aw extensions actionlint doesn't understand
  # (e.g. the "queue" concurrency key) and are recompiled via `gh aw compile`,
  # so linting them here is pure noise.
  .github/workflows/*.lock.yml:
    ignore:
      - ".*"
  .github/workflows/agentics-maintenance.yml:
    ignore:
      - ".*"

  # These workflows build their matrix dynamically via
  # `strategy: ${{ fromJson(...) }}`. actionlint cannot infer the shape of a
  # computed matrix, so it reports the strategy node and every `matrix.*`
  # reference as undefined. Those are false positives for this pattern.
  "{.github/workflows/acceptance.yml,.github/workflows/integration.yml,.github/workflows/integration-major.yml}":
    ignore:
      - '"strategy" section is scalar node but mapping node is expected'
      - 'property "[^"]+" is not defined in object type \{\}'

  # actionlint coerces the literal `true`/`"true"` to a bool and rejects it even
  # against a string-typed input (`"yes"`/`"1"` pass, `"true"` does not). The
  # downstream workflow reads `nightly` as a plain string, so `"true"` is the
  # correct value; this is an actionlint false positive.
  .github/workflows/nightly.yml:
    ignore:
      - 'input "nightly" is typed as string by reusable workflow .* bool value cannot be assigned'
