name: "JS coverage upload"
description: "Upload a Jest or Vitest cobertura report to Codecov and fail the job when the upload fails. Only runs in shopware/shopware: Codecov has no project for the shopware-private mirror."
author: "shopware AG"

inputs:
  file:
    required: true
    description: "Cobertura report, relative to the repository root"
  flag:
    required: true
    description: "Codecov flag (e.g. jest-admin)"
  codecov-token:
    default: ""
    description: "Codecov token. Empty on fork and Dependabot PRs (secrets unavailable), which skip the upload."

runs:
  using: composite
  steps:
    - name: Upload coverage to Codecov
      if: ${{ inputs.codecov-token != '' && github.repository == 'shopware/shopware' }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      env:
        CODECOV_TOKEN: ${{ inputs.codecov-token }}
      with:
        files: ${{ inputs.file }}
        flags: ${{ inputs.flag }}
        disable_search: true
        fail_ci_if_error: true
