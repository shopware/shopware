name: Markdown-only changes
description: Detect whether the current pull request only changes markdown files

outputs:
  docs_only:
    description: Whether the current pull request only changes markdown files
    value: ${{ steps.check.outputs.docs_only }}

runs:
  using: composite
  steps:
    # The changed files come from the pulls.listFiles API, so no full-history
    # checkout is needed; the calling job's checkout (required to resolve this
    # local action) already provides the module below. The calling job needs
    # `pull-requests: read`.
    - name: Detect markdown-only pull requests
      id: check
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        script: |
          const { detectDocsOnly } = await import(`${process.env.GITHUB_WORKSPACE}/.github/bin/js/markdown-only-changes.mjs`);
          await detectDocsOnly({ github, core, context });
