name: "PHPUnit prepare"
description: "Set up Shopware for a PHPUnit run: PHP + composer install, optional service waits, webserver, and the test-database installation"
author: "shopware AG"

inputs:
  php-version:
    default: "8.2"
    description: PHP version to set up
  mysql-version:
    default: "skip"
    description: "setup-shopware mysql-version. 'skip' when the caller provides a database service; set a version to let setup-shopware provision MySQL."
  keep-composer-tools:
    default: "false"
    description: Pass through to setup-shopware's keep-composer-tools
  needs-opensearch:
    default: "false"
    description: "Wait for OpenSearch/Elasticsearch to be healthy before running (set for the Elasticsearch shard)"
  migration-coverage:
    default: "false"
    description: "Rewrite phpunit.xml.dist to scope coverage to the */Migration directories (migration suite)"
  force-phpunit-12:
    default: "false"
    description: "Force PHPUnit 12 via `composer update phpunit/phpunit:^12.4` after the test install (12.4 ships --fail-on-phpunit-notice/-warning). Used by the phpunit-12 gate job."

# Note: the caller controls feature flags via job-level env (e.g. FEATURE_ALL: major); the steps below
# inherit it, so this action stays flag-agnostic. The caller must run actions/checkout before using this
# local action, and provide a database (service container, or via mysql-version).
runs:
  using: composite
  steps:
    - name: Export the canonical PHPUnit environment
      # every PHPUnit job runs against the same test app and service endpoints; exporting them here
      # keeps the values out of each job's env block (FEATURE_ALL stays with the caller: it is
      # matrix- and workflow-specific). APP_SECRET is a fixed test value, not a real secret.
      shell: bash
      run: |
        {
          echo "APP_ENV=test"
          echo "DATABASE_URL=mysql://root@127.0.0.1:3306/root"
          echo "APP_URL=http://localhost:8000"
          echo "APP_SECRET=def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48"
          echo "OPENSEARCH_URL=127.0.0.1:9200"
          echo "ADMIN_OPENSEARCH_URL=127.0.0.1:9200"
          echo "BLUE_GREEN_DEPLOYMENT=1"
          echo "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true"
        } >> "$GITHUB_ENV"

    - name: Setup Shopware
      uses: shopware/setup-shopware@main
      with:
        php-version: ${{ inputs.php-version }}
        mysql-version: ${{ inputs.mysql-version }}
        keep-composer-tools: ${{ inputs.keep-composer-tools }}
        shopware-version: ${{ github.ref }}
        shopware-repository: ${{ github.repository }}

    - name: Wait for OpenSearch/Elasticsearch
      if: ${{ inputs.needs-opensearch == 'true' }}
      shell: bash
      run: |
        # Wait for OpenSearch/Elasticsearch to be alive
        max_tries=30
        tries=0
        until curl -s http://localhost:9200/_cluster/health | grep -q '"status":"green"\|"status":"yellow"'; do
            if [ $tries -ge $max_tries ]; then
                echo "Max tries waiting for OpenSearch/Elasticsearch to be ready exceeded."
                exit 1
            fi

            echo "Waiting for OpenSearch/Elasticsearch to be ready..."
            sleep 2
            tries=$((tries + 1))
        done

    - name: Start Webserver
      shell: bash
      run: symfony server:start -d

    - name: Scope coverage to migration directories
      if: ${{ inputs.migration-coverage == 'true' }}
      shell: bash
      run: |
        sed -i -e 's|<directory suffix=".php">src</directory>|<directory suffix=".php">src/Administration/Migration</directory><directory suffix=".php">src/Core/Migration</directory><directory suffix=".php">src/ElasticSearch/Migration</directory><directory suffix=".php">src/Storefront/Migration</directory>|' phpunit.xml.dist

    - name: Install Shopware
      shell: bash
      run: php src/Core/TestBootstrap.php

    - name: Force PHPUnit 12
      if: ${{ inputs.force-phpunit-12 == 'true' }}
      shell: bash
      # composer require rewrites the root constraint for this run only, so every other job
      # keeps resolving PHPUnit 11 (a shared ||-constraint made composer pick 12 everywhere)
      run: composer require --dev --update-with-all-dependencies phpunit/phpunit:^12.4
