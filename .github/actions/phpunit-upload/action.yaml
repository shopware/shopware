name: "PHPUnit upload"
description: "Upload PHPUnit artifacts to Codecov: cobertura coverage and junit test results. Requires ./.github/actions/phpunit-run to have run first. Call with `if: !cancelled()` so test results upload even when tests fail."
author: "shopware AG"

inputs:
  coverage:
    default: "false"
    description: "Upload the cobertura coverage report produced by the run"
  coverage-flags:
    default: ""
    description: "Codecov coverage flags (e.g. phpunit-unit)"
  codecov-token:
    default: ""
    description: "Codecov token. Empty on fork PRs (secrets unavailable) or for callers that opt out of Codecov uploads."

runs:
  using: composite
  steps:
    # The Codecov CLI is invoked directly instead of codecov/codecov-action:
    # the runner downloads nested `uses:` actions from codeload.github.com
    # while the caller step is prepared and does not retry a 404, so a
    # transient codeload 404 failed jobs whose PHPUnit run was green. A `run:`
    # step needs no action download; the script pins and verifies the CLI
    # binary and retries both its download and the upload.
    - name: Upload coverage to Codecov
      if: ${{ inputs.coverage == 'true' && inputs.codecov-token != '' }}
      shell: bash
      env:
        CODECOV_TOKEN: ${{ inputs.codecov-token }}
        COVERAGE_FLAGS: ${{ inputs.coverage-flags }}
      run: node .github/bin/js/codecov-upload.ts coverage coverage.xml "$COVERAGE_FLAGS"

    - name: Upload test results to Codecov
      # skip when no token: fork PRs (secrets unavailable) and callers that opt out of Test Analytics.
      if: ${{ !cancelled() && inputs.codecov-token != '' }}
      shell: bash
      env:
        CODECOV_TOKEN: ${{ inputs.codecov-token }}
      run: node .github/bin/js/codecov-upload.ts test-results junit.xml
