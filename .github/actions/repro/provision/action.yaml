name: "Reproduce — provision"
description: >
  Boot a Shopware instance at a specific version, building only the surface the
  bug lives on (build_profile). Outputs APP_URL and a store-api access key.
  Reuses shopware/setup-shopware; mirrors the server-start flow of .github/actions/ats.

inputs:
  version:
    description: "Shopware ref: 'trunk' for the checked-out branch, or a tag like 'v6.6.10.0' for the reported version"
    required: true
  repository:
    description: "Shopware repository"
    required: false
    default: "shopware/shopware"
  php-version:
    required: false
    default: "8.4"
  path:
    description: "Subdir to install the shop into (keeps the workspace root tooling/analysis intact)"
    required: false
    default: "shop"
  storefront-build:
    description: "Build storefront assets (only needed for storefront-ui layer)"
    required: false
    default: "false"
  admin-build:
    description: "Build admin assets (only needed for admin-ui layer)"
    required: false
    default: "false"

outputs:
  app_url:
    description: "Base URL of the running shop"
    value: ${{ steps.serve.outputs.app_url }}
  access_key:
    description: "store-api sales-channel access key"
    value: ${{ steps.access-key.outputs.key }}
  sc_id:
    description: "id (hex) of the sales channel the access key belongs to — seed visibility into THIS SC"
    value: ${{ steps.access-key.outputs.sc_id }}

runs:
  using: "composite"
  steps:
    # Safe speedup: cache only Composer's DOWNLOAD cache, keyed per version. This can
    # never change the built shop (Composer content-addresses + verifies every package),
    # so a stale or missing cache only costs re-downloads, never correctness. The heavier
    # wins (vendor/, built assets, a pre-seed DB dump) are deliberately NOT cached here —
    # they need staleness handling and are a separate, riskier change. `~/.cache/composer`
    # is Composer's default dir; if setup-shopware overrides COMPOSER_CACHE_DIR this step
    # is a harmless no-op. Per-version key + prefix restore-keys = one cache per ref.
    - name: Cache Composer downloads
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v4
      with:
        path: ~/.cache/composer
        key: ${{ runner.os }}-repro-composer-${{ inputs.version }}-${{ inputs.php-version }}
        restore-keys: |
          ${{ runner.os }}-repro-composer-${{ inputs.version }}-
          ${{ runner.os }}-repro-composer-

    # Install only what the surface needs. http/direct → no JS build at all.
    - name: Setup Shopware
      uses: shopware/setup-shopware@e12701e21d8a6003103426969ba544cdc91bf41c # v2.0.12
      with:
        shopware-version: ${{ inputs.version }}
        shopware-repository: ${{ inputs.repository }}
        path: ${{ inputs.path }}
        php-version: ${{ inputs.php-version }}
        mysql-version: "builtin"
        install: "true"
        install-admin: ${{ inputs.admin-build }}
        install-storefront: ${{ inputs.storefront-build }}
        skip-js-build: ${{ (inputs.admin-build == 'false' && inputs.storefront-build == 'false') && 'true' || 'false' }}
        allow-insecure-versions: "true" # reported version may be an old release
        env: "prod"

    - name: Define minimal environment
      shell: bash
      run: |
        echo "SHOPWARE_HTTP_CACHE_ENABLED=0" >> "$GITHUB_ENV"
        echo "SHOPWARE_DISABLE_UPDATE_CHECK=true" >> "$GITHUB_ENV"
        echo "BLUE_GREEN_DEPLOYMENT=1" >> "$GITHUB_ENV"

    - name: Start webserver and wait until READY
      id: serve
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        SYMFONY_DAEMON: "1"
        SYMFONY_NO_TLS: "1"
        SYMFONY_ALLOW_HTTP: "1"
        SYMFONY_PORT: "8000"
        SYMFONY_ALLOW_ALL_IP: "1"
      run: |
        set -euo pipefail
        symfony server:start
        APP_URL="http://localhost:8000"
        # one-shot start, then poll until READY (never yield mid-build).
        # READY = the web server responds at all; ANY HTTP status counts (the
        # executor probes the real endpoint). Do not require 2xx here.
        ready=0
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$APP_URL/admin" || echo 000)
          if [ "$code" != "000" ]; then echo "server responding (HTTP $code) after ${i}s"; ready=1; break; fi
          sleep 1
        done
        [ "$ready" = 1 ] || { echo "::error::shop not READY after 60s"; exit 1; }
        echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"

    - name: Resolve store-api access key
      id: access-key
      shell: bash
      run: |
        set -euo pipefail
        # DATABASE_URL is exported by setup-shopware. Read the default sales channel key.
        eval "$(php -r '$u=parse_url(getenv("DATABASE_URL")); printf("DBH=%s DBP=%s DBU=%s DBPW=%s DBN=%s",
          $u["host"]??"127.0.0.1", $u["port"]??3306, $u["user"]??"root", $u["pass"]??"", ltrim($u["path"]??"/","/"));')"
        # Emit BOTH the access key AND its sales-channel id (hex). The seed must make the
        # product visible in EXACTLY the SC the BROWSER resolves: playwright hits the storefront
        # at APP_URL, which selects its sales channel by request DOMAIN. "Earliest active SC" is
        # NOT guaranteed to be that one — a default install has BOTH a Storefront and an
        # API/Headless channel, and product VISIBILITY is per-channel (unlike nav categories,
        # which are shared). Seeding visibility for the wrong (Headless) SC => the product 404s on
        # the storefront (PRECONDITION_NOT_FOUND). So pick, in order: the SC whose domain matches
        # APP_URL, else the Storefront-type channel, else earliest-active (http/direct-only installs).
        ROW=$(mysql -h"$DBH" -P"$DBP" -u"$DBU" ${DBPW:+-p"$DBPW"} "$DBN" -N -e \
          "SELECT LOWER(HEX(sc.id)), sc.access_key
             FROM sales_channel sc
             LEFT JOIN sales_channel_domain d
               ON d.sales_channel_id = sc.id AND d.url LIKE 'http://localhost:8000%'
            WHERE sc.active = 1
            ORDER BY (d.id IS NOT NULL) DESC,
                     (sc.type_id = UNHEX('8a243080f92e4c719546314b577cf82b')) DESC,
                     sc.created_at ASC
            LIMIT 1;")
        SC_ID=$(printf '%s' "$ROW" | cut -f1)
        KEY=$(printf '%s' "$ROW" | cut -f2)
        echo "::add-mask::$KEY"
        echo "key=$KEY" >> "$GITHUB_OUTPUT"
        echo "sc_id=$SC_ID" >> "$GITHUB_OUTPUT"
