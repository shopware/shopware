updates:
- commit-message:
    prefix: "ci(deps): "
  directory: /
  groups:
    all:
      patterns:
      - "*"
  ignore:
  - dependency-name: "github/gh-aw-actions/**"
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - domain/product-ops
  package-ecosystem: github-actions
  schedule:
    interval: weekly
  target-branch: trunk
- commit-message:
    prefix: "ci(deps): "
  directory: /
  groups:
    all:
      patterns:
      - "*"
  ignore:
  - dependency-name: "github/gh-aw-actions/**"
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - domain/product-ops
  package-ecosystem: github-actions
  schedule:
    interval: weekly
  target-branch: 6.6.x
- allow:
  - dependency-name: "@shopware-ag/acceptance-test-suite"
    dependency-type: direct
  commit-message:
    prefix: "ci(deps): "
  directory: /tests/acceptance
  labels:
  - domain/quality-ops
  - backport-6.6.x
  package-ecosystem: npm
  schedule:
    interval: daily
  target-branch: trunk
version: 2
