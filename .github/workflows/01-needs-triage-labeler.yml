name: Add or remove needs-triage label
# Rule and reasoning: .github/bin/js/needs-triage.ts

on:
  pull_request_target:
    types: [opened, ready_for_review, labeled]
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  needs-triage:
    # Decided here so other labels, drafts and test plans start no runner; the script repeats the checks for its tests.
    if: |
      (github.event.action == 'labeled' &&
        (startsWith(github.event.label.name, 'domain/') || startsWith(github.event.label.name, 'service/'))) ||
      (github.event.action != 'labeled' &&
        !github.event.pull_request.draft &&
        !startsWith(github.event.issue.title, '[Test Plan]'))
    runs-on: ubuntu-24.04
    steps:
      # Give the labeler time to apply a domain label; a label it adds with the workflow token
      # fires no `labeled` event. A domain label assigned by hand needs no wait.
      - name: Wait 5 minutes
        if: github.event.action != 'labeled'
        run: sleep 5m
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/bin/js
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { manageNeedsTriage } = await import('${{ github.workspace }}/.github/bin/js/needs-triage.ts')
            await manageNeedsTriage({ github, core, context })
