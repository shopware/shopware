name: Acceptance tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      profile:
        description: "Run profile: '' (PR), 'nightly' or 'release' (patch release gate)"
        default: ""
      major:
        description: "Filter major variants: '' (all), 'exclude' (non-major only), 'only' (major only)"
        default: ""
      currents:
        description: 'Report to currents?'
        type: boolean
        default: false
  workflow_call:
    inputs:
      profile:
        type: string
        default: ""
      major:
        type: string
        default: ""
      currents:
        description: 'Report to currents?'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  markdown-only-changes:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        uses: ./.github/actions/markdown-only-changes

  generate-acceptance-matrix:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: generate-matrix
        run: |
          # PR major runs enter through acceptance-major.yml with major: only. Keep this
          # ordinary PR/merge-queue matrix independent of labels to avoid duplicate major runs.
          MATRIX=$(php .github/bin/generate-acceptance-matrix.php "${{ inputs.profile }}" "false" "${{ inputs.major }}")
          jq . <<<"$MATRIX"
          {
            echo "matrix<<EOF"
            echo "$MATRIX"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  acceptance:
    runs-on: ${{ github.repository == 'shopware/shopware-private' && format('runs-on={0}/runner=sw-amd64/cpu=4', github.run_id) || 'ubuntu-24.04' }}
    env:
      V6_8_0_0: ${{ matrix.major && '1' || '' }}
    permissions:
      contents: read
      id-token: write
    # Shards finish in under 20 minutes; without a cap a single hung step holds the job for GitHub's 6-hour default.
    timeout-minutes: 40
    needs: generate-acceptance-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-acceptance-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ats
        with:
          project: ${{ matrix.name }}
          php-version: ${{ matrix.php-version }}
          shard: ${{ matrix.shard }}
          shard-count: ${{ matrix.shard-count }}
          workers: 4
          major: ${{ matrix.major }}
          install: ${{ matrix.name != 'Install' && 'true' || 'false' }}
          extra-options: ${{ matrix.name == 'Install' && '--trace=on' || '' }}
          use-currents: ${{ inputs.currents && matrix.no-currents != 'true' && 'true' || '' }}
          currents-project-id: ${{ secrets.CURRENTS_PROJECT_ID }}
          currents-record-key: ${{ secrets.CURRENTS_RECORD_KEY }}
          playwright-role-arn: ${{ secrets.PLAYWRIGHT_TRACES_UPLOAD_ROLE_ARN }}
          playwright-traces-domain: ${{ vars.PLAYWRIGHT_TRACES_DOMAIN }}
          s3-bucket: shopware-ci-playwright-traces
          report-prefix: playwright-reports

  acceptance-status-check:
    runs-on: ubuntu-24.04
    needs: acceptance
    if: ${{ !cancelled() && inputs.profile == 'nightly' }}
    permissions:
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report acceptance status to Slack
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SLACK_ATS_WORKFLOW_URL: ${{ secrets.SLACK_ATS_WORKFLOW_URL }}
          RUN_LABEL: ${{ inputs.major == 'only' && 'Major' || '' }}
        run: .github/bin/acceptance-slack-status.bash

  acceptance-code-style:
    name: Acceptance code style
    if: ${{ inputs.major != 'only' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/acceptance/package-lock.json

      - name: Install npm
        run: npm install -g npm@11.8.0

      - name: Install dependencies
        uses: shopware/github-actions/npm-ci-retry@main
        with:
          working-directory: tests/acceptance

      - name: Lint
        working-directory: tests/acceptance
        run: npm run lint

      - name: Format
        working-directory: tests/acceptance
        run: npm run format

  acceptance-tests-changed:
    permissions:
      contents: read
      id-token: write
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' && inputs.major != 'only' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full history in order to see what's changed

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            tests/acceptance/tests/**/*.spec.ts

      - name: Execute acceptance tests
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        uses: ./.github/actions/ats
        #env:
        #  ATS_SKIP_CLEANUP: true
        with:
          project: "Platform"
          install: true
          extra-options: >-
            --repeat-each="10" -x ${{ format(' {0}', steps.changed-files.outputs.all_changed_files) }}
          artifact-prefix: "ats-changed"

  tested-update-versions:
    name: tested-versions
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      first-version: ${{ steps.versions.outputs.first-version }}
      latest-version: ${{ steps.versions.outputs.latest-version }}
      lts-first-version: ${{ steps.versions.outputs.lts-first-version }}
      lts-latest-version: ${{ steps.versions.outputs.lts-latest-version }}
      matrix: ${{ steps.update-matrix.outputs.matrix }}
    steps:
      - name: Generate versions
        id: versions
        uses: shopware/github-actions/versions@main
        with:
          github-token: ${{ github.token }}

      # The major run updates the 6.7 sources only and enables the upcoming major flag afterwards,
      # because a 6.6 shop cannot be updated to the next major. Remove the major variant once
      # trunk is the next major (see https://github.com/shopware/shopware/issues/22865).
      - name: Generate update matrix
        id: update-matrix
        env:
          LTS_LATEST: ${{ steps.versions.outputs.lts-latest-version }}
          FIRST: ${{ steps.versions.outputs.first-version }}
          LATEST: ${{ steps.versions.outputs.latest-version }}
          MAJOR: ${{ inputs.major == 'only' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          MATRIX=$(jq -cn --argjson major "$MAJOR" '{update: (
            (if $major then [] else [{version: env.LTS_LATEST, type: "lts-latest"}] end)
            + [{version: env.FIRST, type: "first"}, {version: env.LATEST, type: "latest"}]
            | map(. + {major: $major}))}')
          jq . <<<"$MATRIX"
          # a missing source version must fail here instead of updating from an unknown version
          jq -e '.update | length > 0 and all(.version != "")' <<<"$MATRIX" >/dev/null
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  acceptance-update:
    permissions:
      contents: read
      id-token: write
    needs: tested-update-versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.tested-update-versions.outputs.matrix) }}
    env:
      SHOPWARE_HTTP_CACHE_ENABLED: 0
      BLUE_GREEN_DEPLOYMENT: 1
      SHOPWARE_DISABLE_UPDATE_CHECK: "0"
      SHOPWARE_UPDATE_FROM: ${{ matrix.update.version }}
      SW_RECOVERY_NEXT_VERSION: "6.7.9999999.9999999"
      SW_RECOVERY_NEXT_BRANCH: "6.7.9999999.9999999"
      SW_RECOVERY_REPOSITORY: '{"type": "path", "url": "${{ github.workspace }}/new-shopware/src/*", "options": { "symlink": true } }'
      S3_BUCKET: "shopware-ci-playwright-traces"
      REPORT_PREFIX: "playwright-reports"
      DO_NOT_TRACK: 1
    steps:
      - name: Create shopware dirs
        run: mkdir -p old-shopware new-shopware
      - name: Setup new Shopware
        uses: shopware/setup-shopware@main
        env:
          COMPOSER_ROOT_VERSION: 6.7.9999999-dev
        with:
          npm-version: 11.8.0
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}
          install-admin: true
          env: dev
          path: new-shopware

      - name: Cache Storefront npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # ~/.npm is npm's tarball cache; `npm ci` wipes node_modules but reuses this
          # offline (see prefer-offline below), which keeps the install off the network.
          path: |
            new-shopware/src/Storefront/Resources/app/storefront/node_modules
            ~/.npm
          key: ${{ runner.os }}-storefront-${{ hashFiles('new-shopware/src/Storefront/Resources/app/storefront/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-storefront-

      - name: Install storefront dependencies
        uses: shopware/github-actions/npm-ci-retry@main
        with:
          working-directory: new-shopware
          command: composer run npm:storefront ci

      - name: Build new shopware
        working-directory: new-shopware
        run: |
          composer run npm:storefront run production
          (cd src/Storefront/Resources/app/storefront && node copy-to-vendor.js)

          composer -d src/Core config version "${SW_RECOVERY_NEXT_VERSION}"
          composer -d src/Administration config version "${SW_RECOVERY_NEXT_VERSION}"
          composer -d src/Storefront config version "${SW_RECOVERY_NEXT_VERSION}"
          composer -d src/Elasticsearch config version "${SW_RECOVERY_NEXT_VERSION}"

      - name: Checkout template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shopware/production
          path: old-shopware

      - name: Configure project root
        run: |
          echo "PROJECT_ROOT=${{ github.workspace }}/old-shopware" >> "$GITHUB_ENV"

      - name: Require shopware
        working-directory: old-shopware
        run: |
          # Note: We expect to see vulnerabilities in the older versions we're using here.
          jq '.config.audit = { "block-insecure": false }' composer.json > composer.json.new
          mv composer.json.new composer.json

          composer require shopware/core:${{ matrix.update.version }}

      - name: Install
        working-directory: old-shopware
        run: |
          sed -i -e "s/shopware.store.frw: '1'/shopware.store.frw: '0'"/ config/services.yaml
          bin/console system:install --basic-setup --skip-first-run-wizard --drop-database --create-database

      - name: Download latest WebInstaller
        run: |
          curl -L https://github.com/shopware/web-installer/releases/latest/download/shopware-installer.phar.php -o old-shopware/public/shopware-installer.phar.php

      - name: Start web server
        working-directory: old-shopware
        run: symfony server:start -d

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install npm
        run: npm install -g npm@11.8.0

      # ~/.npm is cached earlier in this job, so prefer-offline reuses tarballs.
      - name: Install dependencies
        uses: shopware/github-actions/npm-ci-retry@main
        with:
          working-directory: new-shopware/tests/acceptance

      - name: Install Playwright Browsers
        uses: ./new-shopware/.github/actions/playwright-install
        with:
          working-directory: new-shopware/tests/acceptance
      - name: Run update tests with reporting
        if: ${{ inputs.currents && 'true' || '' }}
        working-directory: new-shopware/tests/acceptance
        run: npx pwc --project-id ${{ secrets.CURRENTS_PROJECT_ID }} --key ${{ secrets.CURRENTS_RECORD_KEY }} -- --project=Update --trace=on
      - name: Run update tests
        if: ${{ !inputs.currents && 'true' || '' }}
        working-directory: new-shopware/tests/acceptance
        run: npx playwright test --project=Update --trace=on

      # Until trunk is the next major, the real 6.7 -> 6.8 update is not possible: approximate it by
      # enabling the major flag on the updated shop and running the next major's migrations.
      - name: Enable the major flag and run the next major migrations
        if: ${{ matrix.update.major }}
        working-directory: old-shopware
        run: |
          set -euo pipefail
          echo "V6_8_0_0=1" >> .env.local
          bin/console cache:clear
          bin/console database:migrate --all core.V6_8 | tee "${RUNNER_TEMP}/migrate-v6-8.log"

      # database:migrate exits 0 when it finds no collection for the identifier
      - name: Assert the next major migrations ran with the flag enabled
        if: ${{ matrix.update.major }}
        working-directory: old-shopware
        run: |
          set -euo pipefail
          grep -F 'all migrations for identifier: "core.V6_8" executed' "${RUNNER_TEMP}/migrate-v6-8.log"
          bin/console feature:list | tee "${RUNNER_TEMP}/features.log"
          grep -E 'V6_8_0_0.*Enabled' "${RUNNER_TEMP}/features.log"

      # separate output and report directories, so this run does not wipe the update test results
      - name: Run post-update tests
        working-directory: new-shopware/tests/acceptance
        env:
          SHOPWARE_UPDATE_MAJOR: ${{ matrix.update.major && '1' || '' }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: post-update-results/playwright-report
        run: npx playwright test --project=PostUpdate --trace=on --output=post-update-results/test-results

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-update-${{ matrix.update.type }}-${{ matrix.update.version }}${{ matrix.update.major && '-major' || '' }}
          path: |
            new-shopware/tests/acceptance/test-results/
            new-shopware/tests/acceptance/post-update-results/
          retention-days: 3

      - name: Check if this run should attempt AWS operations
        id: check-aws-allowed
        if: ${{ github.repository_owner == 'shopware' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        run: |
          if [ -z "${{ secrets.PLAYWRIGHT_TRACES_UPLOAD_ROLE_ARN }}" ]; then
            echo "has_role_arn=false" >> "$GITHUB_OUTPUT"
            echo "Secret PLAYWRIGHT_TRACES_UPLOAD_ROLE_ARN is empty or unavailable (likely a fork)." >&2
          else
            echo "has_role_arn=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.check-aws-allowed.outputs.has_role_arn == 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-central-1
          role-session-name: gha-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          role-to-assume: ${{ secrets.PLAYWRIGHT_TRACES_UPLOAD_ROLE_ARN }}

      - name: Upload Playwright HTML report to S3
        working-directory: new-shopware/tests/acceptance
        if: ${{ steps.check-aws-allowed.outputs.has_role_arn == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          RANDOM_STR=$(openssl rand -hex 6)

          # build the destination prefix and export it for subsequent steps
          REPORT_DEST="${REPORT_PREFIX}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM_STR}"

          if [ ! -f "playwright-report/index.html" ]; then
          echo "No Playwright report found, skipping upload."
          exit 0
          fi

          aws s3 cp "playwright-report" "s3://${S3_BUCKET}/${REPORT_DEST}/" --recursive
          echo "REPORT_DEST=${REPORT_DEST}" >> "$GITHUB_ENV"
          echo "Uploaded to s3://${S3_BUCKET}/${REPORT_DEST}/"

      - name: Publish S3 Static Website URL
        if: ${{ steps.check-aws-allowed.outputs.has_role_arn == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${REPORT_DEST:-}" ]; then
          echo "REPORT_DEST not set (upload skipped or failed); skipping publish." >&2
          exit 0
          fi

          if ! aws s3 ls "s3://${S3_BUCKET}/${REPORT_DEST}/index.html" >/dev/null 2>&1; then
          echo "Index file not found ... skipping publish." >&2
          exit 0
          fi

          DOMAIN="${{ vars.PLAYWRIGHT_TRACES_DOMAIN }}"
          URL="https://${DOMAIN}/${REPORT_DEST}/index.html"
          echo "${URL}"

          {
            echo "### Playwright HTML Report"
            echo ""
            echo "- ${URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  # this allows us to specify just one required job/check
  # this is not practical with matrix jobs directly, because you've to specify all permutations
  acceptance-check:
    name: ${{ inputs.major == 'only' && github.event_name == 'pull_request' && 'acceptance-major-check' || 'acceptance-check' }}
    if: always()
    needs:
      - acceptance-code-style
      - markdown-only-changes
      - acceptance
      - acceptance-update

    runs-on: Ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          # allow markdown-only PRs to skip the expensive jobs, and the major-only nightly to skip
          # the jobs that are irrelevant to it, but fail on unexpected skips otherwise
          allowed-skips: >-
            ${{ inputs.major == 'only' && (needs.markdown-only-changes.outputs.docs_only == 'true'
                && 'acceptance-code-style, acceptance-update, acceptance' || 'acceptance-code-style')
              || (needs.markdown-only-changes.outputs.docs_only == 'true' && 'acceptance, acceptance-update' || '') }}
          jobs: ${{ toJSON(needs) }}
