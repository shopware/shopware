name: Admin Performance

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

env:
  COMPOSER_ROOT_VERSION: 6.7.9999999-dev

jobs:
  lighthouse:
    name: "Lighthouse CI"
    runs-on: ubuntu-24.04
    env:
      APP_ENV: prod
      APP_URL: http://localhost:8000
      APP_SECRET: def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48
      BLUE_GREEN_DEPLOYMENT: 1

    steps:
      - name: Start redis
        shell: bash
        run: docker run --name redis -p 6379:6379 -d redis:alpine
      - name: Start mailpit
        shell: bash
        run: docker run --name mailpit -p 1025:1025 -p 8025:8025 -d axllent/mailpit

      - name: Define environment
        shell: bash
        run: |
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
          echo "MAILER_DSN=smtp://localhost:1025" >> $GITHUB_ENV
          echo "MAILPIT_BASE_URL=http://localhost:8025" >> $GITHUB_ENV
          echo "SHOPWARE_HTTP_CACHE_ENABLED=0" >> $GITHUB_ENV
          echo "SHOPWARE_DISABLE_UPDATE_CHECK=true" >> $GITHUB_ENV
          echo "BLUE_GREEN_DEPLOYMENT=1" >> $GITHUB_ENV
          echo "ENABLE_SERVICES=0" >> $GITHUB_ENV

      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          install: true
          install-admin: true
          env: prod
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Stop Symfony server
        run: |
          # Stop the Symfony server started by setup-shopware
          symfony server:stop || true

      - name: Install Caddy and PHP-FPM
        run: |
          PHP_VERSION=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
          
          # Install PHP-FPM (not included in shivammathur/setup-php)
          sudo apt-get update
          sudo apt-get install -y php${PHP_VERSION}-fpm
          
          # Install Caddy
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
          sudo apt-get update
          sudo apt-get install caddy

      - name: Configure and start PHP-FPM
        run: |
          PHP_VERSION=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
          
          # Find the PHP-FPM socket path
          PHP_FPM_SOCKET="/run/php/php${PHP_VERSION}-fpm.sock"
          echo "PHP_FPM_SOCKET=${PHP_FPM_SOCKET}" >> $GITHUB_ENV
          
          # Ensure the socket directory exists and has correct permissions
          sudo mkdir -p /run/php
          sudo chown www-data:www-data /run/php
          
          # Configure PHP-FPM - ensure socket has correct permissions for Caddy
          sudo sed -i 's|listen.owner = .*|listen.owner = www-data|g' /etc/php/${PHP_VERSION}/fpm/pool.d/www.conf
          sudo sed -i 's|listen.group = .*|listen.group = www-data|g' /etc/php/${PHP_VERSION}/fpm/pool.d/www.conf
          sudo sed -i 's|listen.mode = .*|listen.mode = 0666|g' /etc/php/${PHP_VERSION}/fpm/pool.d/www.conf
          
          # Start PHP-FPM
          sudo systemctl start php${PHP_VERSION}-fpm
          
          # Verify PHP-FPM is running and socket exists
          sleep 2
          sudo systemctl status php${PHP_VERSION}-fpm
          ls -la /run/php/
          
          # Test PHP-FPM is working
          echo "Testing PHP-FPM socket..."
          if [ -S "${PHP_FPM_SOCKET}" ]; then
            echo "PHP-FPM socket exists at ${PHP_FPM_SOCKET}"
          else
            echo "ERROR: PHP-FPM socket not found!"
            exit 1
          fi

      - name: Start Caddy
        env:
          DOCUMENT_ROOT: ${{ github.workspace }}/public
        run: |
          echo "Starting Caddy with:"
          echo "  DOCUMENT_ROOT=${DOCUMENT_ROOT}"
          echo "  PHP_FPM_SOCKET=${PHP_FPM_SOCKET}"
          
          # Start Caddy with environment variables
          DOCUMENT_ROOT="${DOCUMENT_ROOT}" PHP_FPM_SOCKET="${PHP_FPM_SOCKET}" caddy start --config .github/ci/lighthouse/Caddyfile
          
          # Show Caddy status
          sleep 2
          caddy status || true

      - name: Wait for server
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/admin | grep -q "200\|301\|302"; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i: Server not ready yet, waiting..."
            sleep 1
          done
          echo "Server failed to start. Checking logs..."
          curl -v http://localhost:8000/admin || true
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './src/Administration/Resources/app/administration/lighthouserc.js'
          uploadArtifacts: true
          temporaryPublicStorage: true

  admin-performance-check:
    if: always()
    needs:
      - lighthouse

    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}

