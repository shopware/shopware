name: Bugfixer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bugfixer workflow to run
        required: true
        default: fix-bug
        type: choice
        options:
          - fix-bug
          - improve-pr
      issue_url:
        description: GitHub issue URL to fix
        required: false
        type: string
      pr_url:
        description: GitHub pull request URL to improve
        required: false
        type: string
      instruction:
        description: Optional instruction for improve-pr
        required: false
        type: string
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: bugfixer-${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_url || inputs.pr_url || github.run_id }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'fix-bug') ||
      (github.event_name == 'issues' &&
      github.event.label.name == 'qi:fix' &&
      !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUGFIXER_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUGFIXER_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write

      - name: Checkout trunk
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: trunk
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/bugfixer/package-lock.json

      - name: Install bugfixer dependencies
        working-directory: tools/bugfixer
        run: npm ci

      - name: Configure app git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Run bugfixer
        working-directory: tools/bugfixer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUGFIXER_AGENT_TIMEOUT_MINUTES: ${{ vars.BUGFIXER_AGENT_TIMEOUT_MINUTES }}
          BUGFIXER_BASE_BRANCH: trunk
          BUGFIXER_ISSUE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_url || github.event.issue.html_url }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_AUTH_JSON_BASE64: ${{ secrets.CODEX_AUTH_JSON_BASE64 }}
          FLUE_MODEL: ${{ vars.BUGFIXER_FLUE_MODEL || 'openai-codex/gpt-5.5' }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_REPO: ${{ github.workspace }}
        run: |
          if [ -z "$BUGFIXER_ISSUE_URL" ]; then
            echo "::error::issue_url is required when mode is fix-bug"
            exit 1
          fi

          payload="$(jq -cn --arg issueUrl "$BUGFIXER_ISSUE_URL" '{issueUrl: $issueUrl}')"
          npm run fix-bug -- --payload "$payload"

  improve:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'improve-pr') ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/bugfixer improve') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
      startsWith(github.event.review.body || '', '/bugfixer improve') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
      startsWith(github.event.comment.body, '/bugfixer improve') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUGFIXER_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUGFIXER_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout trunk
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: trunk
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/bugfixer/package-lock.json

      - name: Install bugfixer dependencies
        working-directory: tools/bugfixer
        run: npm ci

      - name: Configure app git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Build improve-pr payload
        id: payload
        env:
          INPUT_INSTRUCTION: ${{ inputs.instruction }}
          INPUT_PR_URL: ${{ inputs.pr_url }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              pr_url="$INPUT_PR_URL"
              instruction="$INPUT_INSTRUCTION"
              ;;
            issue_comment)
              pr_number="$(jq -r .issue.number "$GITHUB_EVENT_PATH")"
              pr_url="https://github.com/${GITHUB_REPOSITORY}/pull/${pr_number}"
              instruction="$(jq -r .comment.body "$GITHUB_EVENT_PATH" | sed -E '1s#^/bugfixer[[:space:]]+improve[[:space:]]*##')"
              ;;
            pull_request_review)
              pr_url="$(jq -r .pull_request.html_url "$GITHUB_EVENT_PATH")"
              instruction="$(jq -r '.review.body // ""' "$GITHUB_EVENT_PATH" | sed -E '1s#^/bugfixer[[:space:]]+improve[[:space:]]*##')"
              ;;
            pull_request_review_comment)
              pr_url="$(jq -r .pull_request.html_url "$GITHUB_EVENT_PATH")"
              instruction="$(jq -r .comment.body "$GITHUB_EVENT_PATH" | sed -E '1s#^/bugfixer[[:space:]]+improve[[:space:]]*##')"
              ;;
            *)
              echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          if [ -z "$pr_url" ]; then
            echo "::error::pr_url is required when mode is improve-pr"
            exit 1
          fi

          payload="$(jq -cn --arg prUrl "$pr_url" --arg instruction "$instruction" '{prUrl: $prUrl, instruction: $instruction}')"
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"

      - name: Run bugfixer improvement
        working-directory: tools/bugfixer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUGFIXER_AGENT_TIMEOUT_MINUTES: ${{ vars.BUGFIXER_AGENT_TIMEOUT_MINUTES }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_AUTH_JSON_BASE64: ${{ secrets.CODEX_AUTH_JSON_BASE64 }}
          FLUE_MODEL: ${{ vars.BUGFIXER_FLUE_MODEL || 'openai-codex/gpt-5.5' }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_REPO: ${{ github.workspace }}
          BUGFIXER_PAYLOAD: ${{ steps.payload.outputs.payload }}
        run: npm run improve-pr -- --payload "$BUGFIXER_PAYLOAD"
