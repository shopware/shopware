name: Downstream

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      nightly:
        default: ""
  workflow_call:
    inputs:
      nightly:
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  pull-requests: read
  checks: read
  statuses: read

jobs:
  rufus:
    name: Rufus
    runs-on: ubuntu-24.04
    steps:
      - id: sts
        continue-on-error: true
        uses: shopware/octo-sts-action@main
        with:
          scope: shopware
          identity: ShopwareDownstream
      - name: Rufus
        uses: shopware/github-actions/downstream@main
        if: steps.sts.outputs.token
        env:
            NEW_LOGIC: 1
        with:
          repo: shopware/rufus
          workflow: .github/workflows/downstream.yml
          ref: .auto
          timeout: 30m
          token: ${{ steps.sts.outputs.token }}
          env:
            NIGHTLY=${{ inputs.nightly }}

  commercial:
    name: Commercial
    runs-on: ubuntu-24.04
    steps:
      - id: sts
        continue-on-error: true
        uses: shopware/octo-sts-action@main
        with:
          scope: shopware
          identity: ShopwareDownstream
      - name: Commercial
        uses: shopware/github-actions/downstream@main
        if: steps.sts.outputs.token
        env:
            NEW_LOGIC: 1
        with:
          repo: shopware/SwagCommercial
          workflow: Downstream
          ref: .auto
          timeout: 60m
          poll_interval: 1m
          token: ${{ steps.sts.outputs.token }}
          env:
            NIGHTLY=${{ inputs.nightly }}

  mergeability-check:
    name: Downstream Mergeability Check
    runs-on: ubuntu-latest
    steps:
      - id: sts
        uses: shopware/octo-sts-action@main
        with:
          scope: shopware
          identity: ShopwareDownstream

      - name: Check downstream mergeability
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.sts.outputs.token }}
          script: |
            const branch = process.env.GITHUB_HEAD_REF && process.env.GITHUB_HEAD_REF.length ? process.env.GITHUB_HEAD_REF : (process.env.GITHUB_REF || '').replace('refs/heads/','');
            if (!branch) {
              core.setFailed('Could not determine branch name from environment');
              return;
            }

            const repos = [
              { owner: 'shopware', repo: 'rufus' },
              { owner: 'shopware', repo: 'SwagCommercial' }
            ];

            const failures = [];
            const wait = ms => new Promise(r => setTimeout(r, ms));

            // Polling configuration for check-runs
            const pollIntervalMs = 30000; // 30s
            const maxAttempts = 30; // ~15 minutes
            const allowedConclusions = new Set(['success', 'skipped', 'neutral']);

            for (const r of repos) {
              core.info(`Checking ${r.owner}/${r.repo} for branch ${branch}`);

              // Look for an open PR from owner:branch
              const pulls = await github.rest.pulls.list({ owner: r.owner, repo: r.repo, head: `${r.owner}:${branch}`, state: 'open' });

              if (!pulls || !pulls.data || pulls.data.length === 0) {
                core.info(`No open PR found for ${r.owner}/${r.repo} with branch ${branch} — considered OK`);
                continue;
              }

              const pr = pulls.data[0];

              // Ensure mergeable flag is computed (may be null initially)
              let prDetail = await github.rest.pulls.get({ owner: r.owner, repo: r.repo, pull_number: pr.number });
              let tries = 0;
              while (prDetail.data.mergeable === null && tries < 6) {
                core.info(`mergeable=null for ${r.repo}#${pr.number}, waiting...`);
                await wait(2000);
                prDetail = await github.rest.pulls.get({ owner: r.owner, repo: r.repo, pull_number: pr.number });
                tries++;
              }

              if (prDetail.data.mergeable === false) {
                failures.push(`${r.repo} PR #${pr.number} is not mergeable - https://github.com/${r.owner}/${r.repo}/pull/${pr.number}`);
                continue;
              }

              // Use Actions API to check workflow runs for the head SHA
              let runsResp = await github.rest.actions.listWorkflowRunsForRepo({ owner: r.owner, repo: r.repo, branch: branch, per_page: 100 });
              let runs = (runsResp && runsResp.data && runsResp.data.workflow_runs) || [];

              // Poll workflow runs until all are completed or we hit timeout
              let attempts = 0;
              while (attempts < maxAttempts) {
                const incomplete = runs.filter(w => w.status !== 'completed');
                if (incomplete.length === 0) break;

                core.info(`${r.repo} PR #${pr.number} waiting for ${incomplete.length} workflow runs to complete (attempt ${attempts + 1}/${maxAttempts})`);
                await wait(pollIntervalMs);
                attempts++;
                runsResp = await github.rest.actions.listWorkflowRunsForRepo({ owner: r.owner, repo: r.repo, branch: branch, per_page: 100 });
                runs = (runsResp && runsResp.data && runsResp.data.workflow_runs) || [];
              }

              // After polling, evaluate workflow run conclusions
              const stillPending = runs.some(w => w.status !== 'completed');
              if (stillPending) {
                failures.push(`${r.repo} PR #${pr.number} timeout waiting for workflow runs to complete (head: ${headSha}) - https://github.com/${r.owner}/${r.repo}/pull/${pr.number}`);
                continue;
              }

              // Only consider the latest run per workflow (avoid older runs for the same ref)
              const latestByWorkflow = {};
              for (const w of runs) {
                const key = String(w.workflow_id || w.name || w.id || 'unknown');
                const curDate = new Date(w.updated_at || w.run_started_at || w.created_at || 0);
                if (!latestByWorkflow[key]) latestByWorkflow[key] = w;
                else {
                  const prev = latestByWorkflow[key];
                  const prevDate = new Date(prev.updated_at || prev.run_started_at || prev.created_at || 0);
                  if (curDate > prevDate) latestByWorkflow[key] = w;
                }
              }

              const latestRuns = Object.values(latestByWorkflow);
              const failingLatest = latestRuns.filter(w => !allowedConclusions.has((w.conclusion || '').toLowerCase()));
              if (failingLatest.length > 0) {
                const details = failingLatest.map(w => `${w.name || w.workflow_id} (${w.conclusion})`).join(', ');
                const urls = failingLatest.map(w => w.html_url).filter(Boolean).join(', ');
                failures.push(`${r.repo} PR #${pr.number} failing workflows (latest per workflow): ${details} - ${urls} - https://github.com/${r.owner}/${r.repo}/pull/${pr.number}`);
                continue;
              }

              // Check for at least one approval
              const reviews = await github.rest.pulls.listReviews({ owner: r.owner, repo: r.repo, pull_number: pr.number });
              const hasChangeRequests = reviews.data && reviews.data.some(rv => (rv.state || '').toUpperCase() === 'CHANGES_REQUESTED' || (rv.state || '').toUpperCase() === 'REQUEST_CHANGES');
              if (hasChangeRequests) {
                failures.push(`${r.repo} PR #${pr.number} has one or more change requests - https://github.com/${r.owner}/${r.repo}/pull/${pr.number}`);
                continue;
              }

              const approved = reviews.data && reviews.data.some(rv => (rv.state || '').toUpperCase() === 'APPROVED');
              if (!approved) {
                failures.push(`${r.repo} PR #${pr.number} has no approval - https://github.com/${r.owner}/${r.repo}/pull/${pr.number}`);
                continue;
              }

              core.info(`${r.repo} PR #${pr.number} looks mergeable (checks OK)`);
            }

            if (failures.length > 0) {
              throw new Error('Mergeability check failed:\n' + failures.join('\n'));
            } else {
              core.info('All downstream mergeability checks passed');
            }

  downstream-check:
    if: always()
    needs:
    - rufus
    - commercial
    - mergeability-check

    runs-on: Ubuntu-latest
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
      with:
        allowed-skips: rufus, commercial
        jobs: ${{ toJSON(needs) }}
