name: Downstream

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      nightly:
        default: ""
  workflow_call:
    inputs:
      nightly:
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  pull-requests: read
  checks: read
  statuses: read

jobs:
  rufus:
    name: Rufus
    runs-on: ubuntu-24.04
    steps:
      - id: sts
        continue-on-error: true
        uses: shopware/octo-sts-action@main
        with:
          scope: shopware
          identity: ShopwareDownstream
      - name: Rufus
        uses: shopware/github-actions/downstream@main
        if: steps.sts.outputs.token
        env:
            NEW_LOGIC: 1
        with:
          repo: shopware/rufus
          workflow: .github/workflows/downstream.yml
          ref: .auto
          timeout: 30m
          token: ${{ steps.sts.outputs.token }}
          env:
            NIGHTLY=${{ inputs.nightly }}

  commercial:
    name: Commercial
    runs-on: ubuntu-24.04
    steps:
      - id: sts
        continue-on-error: true
        uses: shopware/octo-sts-action@main
        with:
          scope: shopware
          identity: ShopwareDownstream
      - name: Commercial
        uses: shopware/github-actions/downstream@main
        if: steps.sts.outputs.token
        env:
            NEW_LOGIC: 1
        with:
          repo: shopware/SwagCommercial
          workflow: Downstream
          ref: .auto
          timeout: 60m
          poll_interval: 1m
          token: ${{ steps.sts.outputs.token }}
          env:
            NIGHTLY=${{ inputs.nightly }}

  mergeability-check:
    name: Downstream Mergeability Check
    runs-on: ubuntu-latest
    steps:
      - id: sts
        uses: shopware/octo-sts-action@main
        with:
          scope: shopware
          identity: ShopwareDownstream

      - name: Check downstream mergeability
        uses: actions/github-script@v6
        with:
          github-token: ${{ steps.sts.outputs.token }}
          script: |
            const branch = process.env.GITHUB_HEAD_REF && process.env.GITHUB_HEAD_REF.length ? process.env.GITHUB_HEAD_REF : (process.env.GITHUB_REF || '').replace('refs/heads/','');
            if (!branch) {
              core.setFailed('Could not determine branch name from environment');
              return;
            }

            const repos = [
              { owner: 'shopware', repo: 'rufus' },
              { owner: 'shopware', repo: 'SwagCommercial' }
            ];

            const failures = [];
            const wait = ms => new Promise(r => setTimeout(r, ms));

            // Polling configuration for check-runs
            const pollIntervalMs = 30000; // 30s
            const maxAttempts = 30; // ~15 minutes
            const allowedConclusions = new Set(['success', 'skipped', 'neutral']);

            for (const r of repos) {
              core.info(`Checking ${r.owner}/${r.repo} for branch ${branch}`);

              // Look for an open PR from owner:branch
              const pulls = await github.rest.pulls.list({ owner: r.owner, repo: r.repo, head: `${r.owner}:${branch}`, state: 'open' });

              if (!pulls || !pulls.data || pulls.data.length === 0) {
                core.info(`No open PR found for ${r.owner}/${r.repo} with branch ${branch} — considered OK`);
                continue;
              }

              const pr = pulls.data[0];

              // Ensure mergeable flag is computed (may be null initially)
              let prDetail = await github.rest.pulls.get({ owner: r.owner, repo: r.repo, pull_number: pr.number });
              let tries = 0;
              while (prDetail.data.mergeable === null && tries < 6) {
                core.info(`mergeable=null for ${r.repo}#${pr.number}, waiting...`);
                await wait(2000);
                prDetail = await github.rest.pulls.get({ owner: r.owner, repo: r.repo, pull_number: pr.number });
                tries++;
              }

              if (prDetail.data.mergeable === false) {
                failures.push(`${r.repo} PR #${pr.number} is not mergeable - https://github.com/${r.owner}/${r.repo}/pull/${pr.number}`);
                continue;
              }

              // Check only the branch protection's required status-check contexts
              const rulesetsRes = await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}', { owner: r.owner, repo: r.repo, branch: branch });
              const rulesets = rulesetsRes.data || [];
              core.info(`found ${rulesets.length} rulesets for ${r.owner}/${r.repo}`);

              let requiredContexts = [];

              for (const ruleset of rulesets) {
                core.info(`${JSON.stringify(ruleset)}`);

                requiredContexts = requiredContexts.concat(
                  ruleset?.required_status_checks?.contexts ?? []
                );
              }
              core.info(`${r.repo} required status check contexts: ${JSON.stringify(requiredContexts)}`);

              // Use combined status to inspect the specific required contexts for the commit
              // If any required context is pending, poll until it reaches a final state (or timeout)
              let attemptsCtx = 0;
              let pendingContexts = [];
              let success = false;

              while (attemptsCtx < maxAttempts) {
                const status = await github.rest.repos.getCombinedStatusForRef({ owner: r.owner, repo: r.repo, ref: pr.head.sha });
                const statuses = (status && status.data && status.data.statuses) || [];

                pendingContexts = [];

                for (const ctx of requiredContexts) {
                  const s = statuses.find(ss => ss.context === ctx);
                  if (!s) {
                    // Missing context likely means the check was never reported — fail immediately
                    failures.push(`${r.repo} PR #${pr.number} required check missing: ${ctx} - https://github.com/${r.owner}/${r.repo}/pull/${pr.number}`);
                    break;
                  } else {
                    const st = (s.state || '').toLowerCase();
                    if (st === 'pending') pendingContexts.push(ctx);
                    else if (st !== 'success') {
                      failures.push(`${r.repo} PR #${pr.number} required check failing: ${ctx}: ${s.state} - https://github.com/${r.owner}/${r.repo}/pull/${pr.number}`);
                      break;
                    }
                  }
                }

                if (pendingContexts.length === 0) {
                  success = true;
                  core.info(`${r.repo} PR #${pr.number} required contexts all green`);
                  break;
                }

                // There are pending contexts — wait and retry
                core.info(`${r.repo} PR #${pr.number} pending required contexts: ${pendingContexts.join(', ')} (attempt ${attemptsCtx + 1}/${maxAttempts}), waiting ${pollIntervalMs}ms`);
                await wait(pollIntervalMs);
                attemptsCtx++;
              }

              // After polling, if we still have pending contexts, treat as timeout/failure
              if (pendingContexts.length > 0 && attemptsCtx >= maxAttempts) {
                failures.push(`${r.repo} PR #${pr.number} timeout waiting for required contexts: ${pendingContexts.join(', ')} - https://github.com/${r.owner}/${r.repo}/pull/${pr.number}`);
                continue;
              }

              if (!success) {
                // failure already pushed in the loop, continue with next repo
                continue;
              }


              // Check for at least one approval
              const reviews = await github.rest.pulls.listReviews({ owner: r.owner, repo: r.repo, pull_number: pr.number });
              const hasChangeRequests = reviews.data && reviews.data.some(rv => (rv.state || '').toUpperCase() === 'CHANGES_REQUESTED' || (rv.state || '').toUpperCase() === 'REQUEST_CHANGES');
              if (hasChangeRequests) {
                failures.push(`${r.repo} PR #${pr.number} has one or more change requests - https://github.com/${r.owner}/${r.repo}/pull/${pr.number}`);
                continue;
              }

              const approved = reviews.data && reviews.data.some(rv => (rv.state || '').toUpperCase() === 'APPROVED');
              if (!approved) {
                failures.push(`${r.repo} PR #${pr.number} has no approval - https://github.com/${r.owner}/${r.repo}/pull/${pr.number}`);
                continue;
              }

              core.info(`${r.repo} PR #${pr.number} looks mergeable (checks OK)`);
            }

            if (failures.length > 0) {
              throw new Error('Mergeability check failed:\n' + failures.join('\n'));
            } else {
              core.info('All downstream mergeability checks passed');
            }

  downstream-check:
    if: always()
    needs:
    - rufus
    - commercial
    - mergeability-check

    runs-on: Ubuntu-latest
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
      with:
        allowed-skips: rufus, commercial
        jobs: ${{ toJSON(needs) }}
