name: Downstream

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      nightly:
        default: ""
  workflow_call:
    inputs:
      nightly:
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  rufus:
    name: Rufus
    runs-on: ubuntu-24.04
    steps:
      - id: sts
        continue-on-error: true
        uses: octo-sts/action@v1.0.0
        with:
          scope: shopware
          identity: ShopwareDownstream
      - name: Rufus
        uses: shopware/github-actions/downstream@main
        if: steps.sts.outputs.token
        with:
          repo: shopware/rufus
          workflow: Downstream
          ref: .auto
          timeout: 30m
          token: ${{ steps.sts.outputs.token }}
          env:
            NIGHTLY=${{ inputs.nightly }}
  
  commercial:
    name: Commercial
    runs-on: ubuntu-24.04
    steps:
      - id: sts
        continue-on-error: true
        uses: octo-sts/action@v1.0.0
        with:
          scope: shopware
          identity: ShopwareDownstream
      - name: Commercial
        uses: shopware/github-actions/downstream@main
        if: steps.sts.outputs.token
        with:
          repo: shopware/SwagCommercial
          workflow: Downstream
          ref: .auto
          timeout: 60m
          poll_interval: 1m
          token: ${{ steps.sts.outputs.token }}
          env:
            NIGHTLY=${{ inputs.nightly }}

  downstream-check:
    if: always()
    needs:
    # fix with shopware/shopware#6556
    - rufus
    - commercial

    runs-on: Ubuntu-latest
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        allowed-skips: rufus, commercial
        jobs: ${{ toJSON(needs) }}


  apply-team-label:
    runs-on: ubuntu-24.04
    # if: github.event_name == 'issues' && ( github.event.action == 'opened' || github.event.action == 'reopened' )
    env:
      TEAM_NAME: "customer-support"
      TEAM_LABEL: "domain/customer-support"
    permissions:
      id-token: write
      issues: write
    steps:
      - id: sts
        continue-on-error: true
        uses: octo-sts/action@v1.0.0
        with:
          scope: shopware
          identity: ReadCollaborators
      -  uses: tspascoal/get-user-teams-membership@v3
         id: actorTeams
         with:
            username: ${{ github.actor }}
            GITHUB_TOKEN: ${{ steps.sts.outputs.token }}
      - name: debug
        if: runner.debug
        run: |
          echo "${{ github.actor }} is member of teams: ${{ steps.actorTeams.outputs.teams }}"
      - if: ${{ contains(steps.actorTeams.outputs.teams, github.env.TEAM_NAME) }}
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = '7356';
            const teamLabel = process.env.TEAM_LABEL;

            const response = await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [teamLabel],
            });
          
            if (response.status !== 200) {
              throw new Error(`Failed to add label ${teamLabel} to issue #${issueNumber}`);
            }
