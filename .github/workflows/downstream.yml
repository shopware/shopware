name: Downstream

on:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly:
        default: ""
  workflow_call:
    inputs:
      nightly:
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  member-state:
    runs-on: ubuntu-24.04
    outputs:
      org-member: ${{ steps.member-state.outputs.MEMBER }}
    steps:
      - id: member-state
        run: |
          LOGIN=$(gh api /user -q '.login')
          echo $LOGIN
          gh api /orgs/shopware/memberships/$LOGIN
          # test external
          gh api /orgs/shopware/memberships/akf-bw 

  rufus:
    name: "Rufus"
    runs-on: ubuntu-24.04
    needs:
      -  member-state
    steps:
      - name: Rufus
        uses: shopware/github-actions/downstream@main
        with:
          repo: shopware/rufus
          workflow: Downstream
          ref: trunk
          timeout: 15m
          env:
            NIGHTLY=${{ inputs.nightly }}
  
  commercial:
    name: Commercial
    runs-on: ubuntu-24.04
    needs:
      -  member-state
    steps:
      - name: Commercial
        uses: shopware/github-actions/downstream@main
        with:
          repo: shopware/SwagCommercial
          workflow: Downstream
          ref: trunk
          timeout: 20m
          env:
            NIGHTLY=${{ inputs.nightly }}