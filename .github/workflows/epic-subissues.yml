name: Epic subissues for accessibility

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  subissues-tests:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    if: github.event.issue.type.name =='Epic' && !contains(github.event.issue.body, 'Backend-only work required')
    steps:
      - name: Create list of all markdown files from Design
        run: |
          FILES=$(gh api --jq '.[].name' "/repos/$REPO/contents/.github/ISSUE_TEMPLATE/Epic/Design" | grep '\.md$' | sed 's|^|Design/|' )
          {
            echo "FILELIST<<EOF"
            echo "${FILES}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create list of all markdown files from Testing
        if: ${{ !contains(github.event.issue.body, 'Requires frontend work only in the Admin') }}
        run: |
          FILES=$(gh api --jq '.[].name' "/repos/$REPO/contents/.github/ISSUE_TEMPLATE/Epic/Testing" | grep '\.md$' | sed 's|^|Testing/|')
          {
            echo "FILELIST<<EOF"
            echo "${FILELIST}"
            echo "${FILES}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create issue for each markdown file and attach as subissue to newly created epic
        env:
          EPIC_NUM: ${{ github.event.issue.number }}
        run: "for file in $FILELIST; do\n  # set title to file name and remove file extension \n  TITLE=${file%%.md}\n  # replace hyphens with spaces\n  TITLE=${TITLE//-/ }\n  #remove directory name\n  if [[ \"$TITLE\" == \"Design/\"* ]]; then\n    TITLE=\"${TITLE#Design/}\"\n  elif [[ \"$TITLE\" == \"Testing/\"* ]]; then\n    TITLE=\"${TITLE#Testing/}\"\n  fi\n    #magic___^_^___line\n  # create subissue and get subissue number\n  SUBISSUE=$(gh issue create --title \"$TITLE\" --body-file \".github/ISSUE_TEMPLATE/Epic/${file}\")\n  SUBISSUE_NUM=$(gh issue view \"$SUBISSUE\" --json number --jq '.number')\n    #magic___^_^___line\n  # get subissue database id\n  # source: https://jessehouwing.net/create-github-issue-hierarchy-using-the-api/\n  SUBISSUE_ID=$(gh api \"/repos/$REPO/issues/$SUBISSUE_NUM\" --jq .id)\n    #magic___^_^___line\n  # add subissue to epic\n  gh api -X POST \"/repos/$REPO/issues/$EPIC_NUM/sub_issues\" -F \"sub_issue_id=$SUBISSUE_ID\"\n    #magic___^_^___line\n  # set subissue type\n  gh api -X PATCH \"/repos/$REPO/issues/$SUBISSUE_NUM\" --field type=\"Task\"\ndone\n"
