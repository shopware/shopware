name: Integration tests (major)

# Nightly via workflow_call; also opt-in on a PR by adding the `major-php` or
# `major-js` label (or `major-tests`, the umbrella label that enables every
# major arm — acceptance.yml uses `major-acceptance` for its major arm).
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  id-token: write

jobs:
  phpunit-major-matrix:
    # On PRs the whole matrix only runs when the `major-php` (or umbrella `major-tests`) label is present; nightly (workflow_call) and manual runs are unaffected.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'major-php') || contains(github.event.pull_request.labels.*.name, 'major-tests')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: generate-matrix
        run: |
          MATRIX=$(php .github/bin/generate-phpunit-matrix.php "" "true")
          jq . <<<"$MATRIX"
          {
            echo "matrix<<EOF"
            echo "$MATRIX"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  phpunit-major:
    name: "${{ matrix.test.testsuite }}${{ matrix.test.path }}"
    needs:
      - phpunit-major-matrix
    runs-on: ubuntu-24.04
    strategy:
      # Only `matrix:` carries the expression: zizmor cannot audit a file whose whole
      # `strategy:` is one, and an unaudited file loses its action-pinning check.
      fail-fast: false
      matrix: ${{ fromJson(needs.phpunit-major-matrix.outputs.matrix) }}
    env:
      APP_ENV: test
      FEATURE_ALL: major
      DATABASE_URL: mysql://root@127.0.0.1:3306/root
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:8000
      APP_SECRET: def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48
      OPENSEARCH_URL: 127.0.0.1:9200
      ADMIN_OPENSEARCH_URL: 127.0.0.1:9200
      BLUE_GREEN_DEPLOYMENT: 1
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev

    services:
      elasticsearch:
        # Only the Elasticsearch path shard needs OpenSearch, every other shard uses the cheap alpine placeholder instead.
        image: ${{ contains(matrix.test.path, 'Elasticsearch') && matrix.opensearch || 'alpine' }}
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "yourStrongPassword123!"
        ports:
          - "9200:9200"
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: shopware
        ports:
          - "3306:3306"
        options: --health-cmd="mysqladmin ping || mariadb-admin ping"
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup and install Shopware
        uses: ./.github/actions/phpunit-prepare
        with:
          php-version: ${{ matrix.php }}
          needs-opensearch: ${{ contains(matrix.test.path, 'Elasticsearch') }}
      - name: Run PHPUnit
        uses: ./.github/actions/phpunit-run
        with:
          test-path: ${{ matrix.test.path }}
          test-testsuite: ${{ matrix.test.testsuite }}
          # no codecov-upload step: the major run's signal is the gate, not Test Analytics
      - name: Upload junit report for the failure tracking issue
        if: failure() && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-phpunit-major-${{ strategy.job-index }}
          path: junit.xml
          # a shard that fails before PHPUnit reports (setup, crash) has no junit.xml
          if-no-files-found: ignore
          overwrite: true

  jest-admin-major:
    name: "Jest Admin"
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'major-js') || contains(github.event.pull_request.labels.*.name, 'major-tests')
    runs-on: ubuntu-24.04
    env:
      NODE_VERSION: 'lts/*'
      JEST_MAX_WORKERS: 100%

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Administration/Resources/app/administration/package-lock.json

      - name: Install admin dependencies
        run: npm --prefix src/Administration/Resources/app/administration ci

      - name: Run Jest Admin with major features
        run: composer admin:unit:major

      - name: Upload Jest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jest-admin-major-results
          path: build/artifacts/jest/administration.junit.xml
          if-no-files-found: error

  # single required/monitorable status for the whole major matrix
  integration-major-check:
    # Skip cleanly on unlabeled PRs so they don't get a confusing status; otherwise aggregate the matrix result.
    if: always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'major-php') || contains(github.event.pull_request.labels.*.name, 'major-js') || contains(github.event.pull_request.labels.*.name, 'major-tests'))
    needs:
      - phpunit-major
      - jest-admin-major
    runs-on: Ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            ${{
              github.event_name == 'pull_request'
              && !contains(github.event.pull_request.labels.*.name, 'major-php')
              && !contains(github.event.pull_request.labels.*.name, 'major-tests')
              && 'phpunit-major'
              || github.event_name == 'pull_request'
              && !contains(github.event.pull_request.labels.*.name, 'major-js')
              && !contains(github.event.pull_request.labels.*.name, 'major-tests')
              && 'jest-admin-major'
              || ''
            }}
