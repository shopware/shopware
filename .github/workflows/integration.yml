name: Integration tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      profile:
        description: "Run profile: '' (PR), 'nightly' or 'release' (patch release gate)"
        default: ""
  workflow_call:
    inputs:
      profile:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  markdown-only-changes:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        uses: ./.github/actions/markdown-only-changes

  phpunit-matrix:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: generate-matrix
        run: |
          MATRIX=$(php .github/bin/generate-phpunit-matrix.php "${{ inputs.profile }}")
          echo "$MATRIX"
          {
            echo "matrix<<EOF"
            echo "$MATRIX"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  phpunit:
    name: "${{ matrix.php}} ${{ matrix.test.testsuite }}${{ matrix.test.path }} ${{ matrix.db }} ${{ matrix.opensearch != 'opensearchproject/opensearch:3' && matrix.opensearch || '' }}"
    needs:
      - phpunit-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.phpunit-matrix.outputs.matrix) }}
    env:
      APP_ENV: test
      DATABASE_URL: mysql://root@127.0.0.1:3306/root
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:8000
      APP_SECRET: def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48
      OPENSEARCH_URL: 127.0.0.1:9200
      ADMIN_OPENSEARCH_URL: 127.0.0.1:9200
      BLUE_GREEN_DEPLOYMENT: 1
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev

    services:
      elasticsearch:
        # Only the Elasticsearch path shard needs OpenSearch every other shard uses the cheap alpine placeholder instead
        image: ${{ contains(matrix.test.path, 'Elasticsearch') && matrix.opensearch || 'alpine' }}
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "yourStrongPassword123!"
        ports:
          - "9200:9200"
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: shopware
        ports:
          - "3306:3306"
        options: --health-cmd="mysqladmin ping || mariadb-admin ping"
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup and install Shopware
        uses: ./.github/actions/phpunit-prepare
        with:
          php-version: ${{ matrix.php }}
          needs-opensearch: ${{ contains(matrix.test.path, 'Elasticsearch') }}
      - name: Run PHPUnit
        id: phpunit
        uses: ./.github/actions/phpunit-run
        with:
          test-path: ${{ matrix.test.path }}
          test-testsuite: ${{ matrix.test.testsuite }}
      - name: Upload test results to Codecov
        uses: ./.github/actions/phpunit-upload
        continue-on-error: true
        # !cancelled(): junit test results must upload even when the run failed.
        # conclusion != 'skipped': but not when PHPUnit never ran (e.g. service container setup
        # failed), because then checkout never ran either and this local action cannot resolve.
        if: ${{ !cancelled() && steps.phpunit.conclusion != 'skipped' }}
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload junit report for the failure tracking issue
        if: failure() && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-phpunit-${{ strategy.job-index }}
          path: junit.xml
          # a shard that fails before PHPUnit reports (setup, crash) has no junit.xml
          if-no-files-found: ignore
          overwrite: true

  win-checkout:
    runs-on: windows-latest
    needs:
      - markdown-only-changes
    if: ${{ github.event_name != 'pull_request' && needs.markdown-only-changes.outputs.docs_only != 'true' }}
    name: "Windows check"

    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true

      - name: Clone platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  php-security:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    name: "Composer dependencies"
    env:
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev
    steps:
      - name: Clone platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"

      - name: Install Composer
        run: |
          composer install --no-interaction --no-scripts
          curl --location --output local-php-security-checker https://github.com/fabpot/local-php-security-checker/releases/download/v1.0.0/local-php-security-checker_1.0.0_linux_amd64
          echo 'e5b12488ca78bc07c149e9352278bf10667b88a8461caac10154f9a6f5476369  local-php-security-checker' > local-php-security-checker.sha256
          sha256sum --check local-php-security-checker.sha256
          chmod +x local-php-security-checker

      - name: Run on platform
        run: ./local-php-security-checker
  code-ql:
    name: Analyze
    needs:
      - markdown-only-changes
    if: ${{ github.repository == 'shopware/shopware' && needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  blue-green-67-68:
    name: "PHP blue green 6.7 -> 6.8 -> 6.7"
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      APP_URL: http://localhost:8000
      APP_SECRET: def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48
      OPENSEARCH_URL: 127.0.0.1:9200
      ADMIN_OPENSEARCH_URL: 127.0.0.1:9200
      BLUE_GREEN_DEPLOYMENT: 1
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      DO_NOT_TRACK: 1

    services:
      elasticsearch:
        image: "opensearchproject/opensearch:3"
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "yourStrongPassword123!"
        ports:
          - "9200:9200"

    steps:
      - name: Setup previous major version
        uses: shopware/setup-shopware@main
        with:
          install: "false"
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Start Webserver
        run: symfony server:start -d

      - name: Install Shopware in previous major version on test DB
        if: inputs.profile == 'nightly'
        run: composer init:testdb

      - name: Run next major migrations on test DB
        if: inputs.profile == 'nightly'
        run: DATABASE_URL="mysql://root@127.0.0.1:3306/shopware_test" bin/console database:migrate --all core.V6_8

      - name: Run integration tests
        if: inputs.profile == 'nightly'
        run: php -d memory_limit=-1 vendor/bin/phpunit --log-junit junit.xml --testsuite "integration" --stop-on-error --stop-on-failure

      - name: Upload junit report for the failure tracking issue
        if: failure() && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-phpunit-blue-green-67-68
          path: junit.xml
          # a job that fails before PHPUnit reports (setup, crash) has no junit.xml
          if-no-files-found: ignore
          overwrite: true

      - name: Install Shopware in previous major version
        if: inputs.profile != 'nightly'
        run: bin/console system:install --basic-setup --create-database --skip-assets-install

      - name: Run next major migrations
        if: inputs.profile != 'nightly'
        run: bin/console database:migrate --all core.V6_8

      - name: Run blue-green check
        if: inputs.profile != 'nightly'
        run: php .github/bin/blue-green-check.php

  blue-green-66-67:
    name: "PHP blue green 6.6 -> 6.7 -> 6.6"
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    env:
      APP_ENV: test
      APP_URL: http://localhost:8000
      APP_SECRET: def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48
      OPENSEARCH_URL: 127.0.0.1:9200
      ADMIN_OPENSEARCH_URL: 127.0.0.1:9200
      BLUE_GREEN_DEPLOYMENT: 1
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PREVIOUS_MAJOR_VERSION_BRANCH: "6.6.x"
      DO_NOT_TRACK: 1

    services:
      elasticsearch:
        image: "opensearchproject/opensearch:3"
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "yourStrongPassword123!"
        ports:
          - "9200:9200"

    steps:
      - name: Setup previous major version
        uses: shopware/setup-shopware@main
        with:
          install: "false"
          shopware-version: ${{ env.PREVIOUS_MAJOR_VERSION_BRANCH }}
          shopware-repository: ${{ github.repository }}

      - name: Start Webserver
        run: symfony server:start -d

      - name: Install Shopware in previous major version on test DB
        run: composer init:testdb

      - name: Checkout current major version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Update to current major version
        env:
          COMPOSER_ROOT_VERSION: "6.7.9999999-dev"
          DATABASE_URL: "mysql://root@127.0.0.1:3306/shopware_test"
        run: |
          rm -rf vendor-bin
          rm -rf vendor
          composer update -o
          bin/console system:update:finish

      - name: Checkout previous major version again
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PREVIOUS_MAJOR_VERSION_BRANCH }}

      - name: Setup Composer in previous major version again
        run: |
          rm -rf vendor-bin
          composer update -o
          bin/console system:generate-jwt-secret

      - name: Refresh theme in previous major version
        if: inputs.profile == 'nightly'
        env:
          DATABASE_URL: "mysql://root@127.0.0.1:3306/shopware_test"
        run: bin/console theme:refresh

      - name: Run integration tests in previous major version
        if: inputs.profile == 'nightly'
        run: php -d memory_limit=-1 vendor/bin/phpunit --log-junit junit.xml --testsuite "integration" --stop-on-error --stop-on-failure

      - name: Upload junit report for the failure tracking issue
        if: failure() && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-phpunit-blue-green-66-67
          path: junit.xml
          # a job that fails before PHPUnit reports (setup, crash) has no junit.xml
          if-no-files-found: ignore
          overwrite: true

      - name: Run blue-green check
        if: inputs.profile != 'nightly'
        env:
          DATABASE_URL: "mysql://root@127.0.0.1:3306/shopware_test"
        run: php .github/bin/blue-green-check.php

  update-66-67:
    name: "PHP update 6.6 -> 6.7"
    runs-on: ubuntu-24.04
    if: inputs.profile == 'nightly' || inputs.profile == 'release'
    env:
      APP_ENV: test
      APP_URL: http://localhost:8000
      APP_SECRET: def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48
      OPENSEARCH_URL: 127.0.0.1:9200
      ADMIN_OPENSEARCH_URL: 127.0.0.1:9200
      BLUE_GREEN_DEPLOYMENT: 1
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PREVIOUS_MAJOR_VERSION_BRANCH: "6.6.x"
      DO_NOT_TRACK: 1

    services:
      elasticsearch:
        image: "opensearchproject/opensearch:3"
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "yourStrongPassword123!"
        ports:
          - "9200:9200"

    steps:
      - name: Setup previous major version
        uses: shopware/setup-shopware@main
        with:
          install: "false"
          shopware-version: ${{ env.PREVIOUS_MAJOR_VERSION_BRANCH }}
          shopware-repository: ${{ github.repository }}

      - name: Start Webserver
        run: symfony server:start -d

      - name: Install Shopware in previous major version on test DB
        run: composer init:testdb

      - name: Checkout current major version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Update to current major version
        env:
          COMPOSER_ROOT_VERSION: "6.7.9999999-dev"
          DATABASE_URL: "mysql://root@127.0.0.1:3306/shopware_test"
        run: |
          rm -rf vendor-bin
          rm -rf vendor
          composer update -o
          bin/console system:update:finish

      - name: Refresh theme
        env:
          DATABASE_URL: "mysql://root@127.0.0.1:3306/shopware_test"
        run: bin/console theme:refresh

      # Drain indexers queued by 6.6→6.7 migrations before integration tests run,
      # otherwise stale indexes cause flakes.
      - name: Refresh DAL index
        env:
          DATABASE_URL: "mysql://root@127.0.0.1:3306/shopware_test"
        run: bin/console dal:refresh:index

      - name: Run integration tests
        run: php -d memory_limit=-1 vendor/bin/phpunit --log-junit junit.xml --testsuite "integration" --stop-on-error --stop-on-failure

      - name: Upload junit report for the failure tracking issue
        if: failure() && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-phpunit-update-66-67
          path: junit.xml
          # a job that fails before PHPUnit reports (setup, crash) has no junit.xml
          if-no-files-found: ignore
          overwrite: true

  # this allows us to specify just one required job/check
  # this is not practical with matrix jobs directly, because you've to specify all permutations
  check:
    if: always()
    needs:
      - markdown-only-changes
      - phpunit
      - win-checkout
      - code-ql
      - php-security
      - blue-green-66-67
      - blue-green-67-68

    runs-on: Ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          # allowed-failures: docs, linters
          # allow markdown-only PRs to skip the expensive jobs, and allow jobs which do not run on a PR or outside the public repository to skip
          allowed-skips: ${{ needs.markdown-only-changes.outputs.docs_only == 'true' && 'phpunit, win-checkout, code-ql, php-security, blue-green-66-67, blue-green-67-68' || github.repository != 'shopware/shopware' && github.event_name == 'pull_request' && 'win-checkout, code-ql' || github.repository != 'shopware/shopware' && 'code-ql' || github.event_name == 'pull_request' && 'win-checkout' || '' }}
          jobs: ${{ toJSON(needs) }}
