name: Nightly Major

# Runs the "major" test suites (for the upcoming major version) on their own schedule while they are
# still being stabilised, so the regular Nightly can stay green: the major acceptance tests and the
# integration-major PHPUnit suite (tracked under https://github.com/shopware/shopware/issues/17978).
# Once these are green, fold them back into nightly.yml (drop `major: exclude` from its acceptance
# call and restore the integration-major job) and delete this workflow.
# Note: only the acceptance arm posts to Slack; integration-major status is its own check.

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00, offset from the regular nightly (01:00)
  workflow_dispatch:

jobs:
  acceptance:
    uses: ./.github/workflows/acceptance.yml
    secrets: inherit
    if: github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch'
    with:
      profile: nightly
      currents: false
      major: only
  integration-major:
    uses: ./.github/workflows/integration-major.yml
    secrets: inherit
    if: github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch'

  # Commercial arm: dispatch the plugin's integration-major workflow so the upcoming major's
  # feature flags are also exercised with SwagCommercial installed (the regular downstream's
  # major arm only runs whatever ref dispatched it; this one is pinned to the major schedule).
  commercial-major:
    name: Commercial (major)
    if: github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - id: sts
        continue-on-error: true
        uses: shopware/octo-sts-action@main
        with:
          scope: shopware
          identity: ShopwareDownstream
      - name: Commercial
        uses: shopware/github-actions/downstream@main
        if: steps.sts.outputs.token
        env:
          NEW_LOGIC: 1
        with:
          repo: shopware/SwagCommercial
          workflow: integration-major.yaml
          ref: .auto
          timeout: 60m
          poll_interval: 1m
          token: ${{ steps.sts.outputs.token }}
          upstream-token: ${{ github.token }}

  # turn a red major matrix into a domain-grouped tracking issue, aggregated from
  # the junit-phpunit-* artifacts integration-major.yml uploads on scheduled failures
  report-phpunit-failures:
    # the aggregation script skips branches that are neither trunk nor maintenance-shaped
    if: always() && needs.integration-major.result == 'failure'
    needs:
      - integration-major
    uses: ./.github/workflows/report-phpunit-failures.yml
    permissions:
      contents: read
      id-token: write # the called workflow mints an octo-sts token
      issues: write
    with:
      report-title: "[nightly] Nightly Major test failures"
