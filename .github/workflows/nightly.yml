name: Nightly

on:
  schedule:
    - cron: "0 1 * * *" # every day at 01:00
  workflow_dispatch:

jobs:
  redis:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    name: Redis
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        redis:
          - redis:7.2-alpine
          - redis:7-alpine
          - redis:8.2-alpine
          - valkey/valkey:8.0
          - valkey/valkey:9.0
    services:
      redis:
        image: ${{ matrix.redis }}
        ports:
          - "6379:6379"
    env:
      REDIS_URL: redis://localhost:6379
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}
      - name: Run PHPUnit
        run: |
          ./vendor/bin/phpunit --testsuite redis

  admin:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/admin.yml
    secrets: inherit
  integration:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/integration.yml
    secrets: inherit
    with:
      profile: nightly
  acceptance:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/acceptance.yml
    secrets: inherit
    with:
      profile: nightly
      # Major acceptance tests are run by the dedicated nightly-major workflow while the next
      # major is prepared. Once they are green, drop this line to fold them back into nightly.
      major: exclude
  visual-tests:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/visual-tests.yml
    secrets: inherit
    with:
      currents: ${{ github.event_name == 'schedule' }}
  php:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/php.yml
    secrets: inherit
  storefront:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/storefront.yml
    secrets: inherit
  downstream:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/downstream.yml
    secrets: inherit
    with:
      nightly: true
  prepare-release: # This will only execute dry-runs and push current trunk to the many-repos
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/05-prepare-release.yml
    secrets: inherit

  # we need this for our LTS, because gh only runs scheduled for the default branch
  nightly-other-branches:
    runs-on: ubuntu-24.04
    if: github.repository == 'shopware/shopware' && github.ref == 'refs/heads/trunk'
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        branch:
          - "6.6.x"
    name: Nightly ${{ matrix.branch }}
    steps:
      - name: Delay
        run: sleep 20m
      - uses: shopware/octo-sts-action@main
        id: sts
        with:
          scope: shopware
          identity: ShopwareNightly
      - env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ matrix.branch }}"
