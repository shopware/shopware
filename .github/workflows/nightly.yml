name: Nightly

on:
  schedule:
    - cron: "0 1 * * *" # every day at 01:00
  workflow_dispatch:

jobs:
  redis:
    name: Redis
    runs-on: ubuntu-24.04
    if: github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        redis:
          - redis:7.2-alpine
          - redis:7-alpine
          - redis:8.2-alpine
          - valkey/valkey:8.0
          - valkey/valkey:9.0
    services:
      redis:
        image: ${{ matrix.redis }}
        ports:
          - "6379:6379"
    env:
      REDIS_URL: redis://localhost:6379
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}
      - name: Run PHPUnit
        run: |
          ./vendor/bin/phpunit --group=redis --testsuite migration,unit,integration,devops

  admin:
    uses: ./.github/workflows/admin.yml
    secrets: inherit
    if: github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch'
  integration:
    uses: ./.github/workflows/integration.yml
    secrets: inherit
    if: github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch'
    with:
      nightly: true
  visual-tests:
    uses: ./.github/workflows/visual-tests.yml
    secrets: inherit
    if: github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch'
    with:
      currents: ${{ github.event_name == 'schedule' }}
  php:
    uses: ./.github/workflows/php.yml
    secrets: inherit
    if: github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch'
  storefront:
    uses: ./.github/workflows/storefront.yml
    secrets: inherit
    if: github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch'
  downstream:
    uses: ./.github/workflows/downstream.yml
    secrets: inherit
    if: github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch'
    with:
      nightly: true
  prepare-release: # This will only execute dry-runs and push current trunk to the many-repos
    uses: ./.github/workflows/05-prepare-release.yml
    secrets: inherit
    if: github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch'

  nightly-health-report:
    name: Nightly health report
    runs-on: ubuntu-24.04
    if: always() && github.repository == 'shopware/shopware'
    needs:
      - redis
      - admin
      - integration
      - visual-tests
      - php
      - storefront
      - downstream
      - prepare-release
      - nightly-other-branches
    permissions:
      actions: read
      contents: read
    env:
      CURRENT_JOB_NAME: Nightly health report
      GITHUB_TOKEN: ${{ github.token }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_WORKFLOW_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 4

      - name: Report nightly health to Slack
        run: node .github/bin/js/nightly-slack-report.mjs

  # we need this for our LTS, because gh only runs scheduled for the default branch
  nightly-other-branches:
    runs-on: ubuntu-24.04
    if: github.repository == 'shopware/shopware' && github.ref == 'refs/heads/trunk'
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        branch:
          - "6.6.x"
    name: Nightly ${{ matrix.branch }}
    steps:
      - name: Delay
        run: sleep 20m
      - uses: shopware/octo-sts-action@main
        id: sts
        with:
          scope: shopware
          identity: ShopwareNightly
      - env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ matrix.branch }}"
