name: Nightly

on:
  schedule:
    - cron: "0 1 * * *" # every day at 01:00
  workflow_dispatch:

jobs:
  redis:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    name: Redis
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        redis:
          - redis:7.2-alpine
          - redis:7-alpine
          - redis:8.2-alpine
          - valkey/valkey:8.0
          - valkey/valkey:9.0
    services:
      redis:
        image: ${{ matrix.redis }}
        ports:
          - "6379:6379"
    env:
      REDIS_URL: redis://localhost:6379
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}
      - name: Run PHPUnit
        run: |
          ./vendor/bin/phpunit --log-junit junit.xml --testsuite redis
      - name: Upload junit report for the failure tracking issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-phpunit-redis-${{ strategy.job-index }}
          path: junit.xml
          # a job that fails before PHPUnit reports (setup, crash) has no junit.xml
          if-no-files-found: ignore
          overwrite: true

  admin:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/admin.yml
    secrets: inherit
  integration:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/integration.yml
    secrets: inherit
    with:
      profile: nightly
  acceptance:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/acceptance.yml
    secrets: inherit
    with:
      profile: nightly
      currents: ${{ github.event_name == 'schedule' }}
      # Major acceptance tests are run by the dedicated nightly-major workflow while the next
      # major is prepared. Once they are green, drop this line to fold them back into nightly.
      major: exclude
  visual-tests:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/visual-tests-docker.yml
    secrets: inherit
    with:
      currents: ${{ github.event_name == 'schedule' }}
  php:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/php.yml
    secrets: inherit
  storefront:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/storefront.yml
    secrets: inherit
  zugferd-compliance:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/zugferd-compliance.yml
    secrets: inherit
  downstream:
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/downstream.yml
    secrets: inherit
    with:
      nightly: "true"
  prepare-release: # This will only execute dry-runs and push current trunk to the many-repos
    if: (github.repository == 'shopware/shopware' || github.event_name == 'workflow_dispatch') && github.ref_type != 'tag'
    uses: ./.github/workflows/05-prepare-release.yml
    secrets: inherit

  # turn red PHPUnit arms (redis, integration.yml, php.yml) into one domain-grouped tracking issue,
  # aggregated from the junit-phpunit-* artifacts those jobs upload on scheduled failures
  report-phpunit-failures:
    if: always() && github.event_name == 'schedule' && (needs.redis.result == 'failure' || needs.integration.result == 'failure' || needs.php.result == 'failure')
    needs:
      - redis
      - integration
      - php
    uses: ./.github/workflows/report-phpunit-failures.yml
    permissions:
      contents: read
      issues: write
    with:
      report-title: "[nightly] Nightly test failures"

  # we need this for our LTS, because gh only runs scheduled for the default branch
  nightly-other-branches:
    runs-on: ubuntu-24.04
    if: github.repository == 'shopware/shopware' && github.ref == 'refs/heads/trunk'
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        branch:
          - "6.6.x"
    name: Nightly ${{ matrix.branch }}
    steps:
      - name: Delay
        run: sleep 20m
      - uses: shopware/octo-sts-action@main
        id: sts
        with:
          scope: shopware
          identity: ShopwareNightly
      - env:
          GH_TOKEN: ${{ steps.sts.outputs.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ matrix.branch }}"
