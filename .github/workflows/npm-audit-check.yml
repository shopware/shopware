name: Audit check for NPM packages

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
  schedule:
    # Every day at 8:30 AM UTC
    - cron: "30 8 * * *"
  push:
    branches: ["trunk"]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/scripts/runNpmAudit.ts"
      - ".github/bin/js/run-npm-audit.ts"
      - ".github/bin/js/package-discovery.ts"
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/scripts/runNpmAudit.ts"
      - ".github/bin/js/run-npm-audit.ts"
      - ".github/bin/js/package-discovery.ts"

jobs:
  check-package-completeness:
    name: Verify all package.json files are audited
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Validate package.json completeness
        run: node ./.github/bin/js/package-discovery.ts validate

  check-pinned-dependencies:
    name: Check pinned dependencies
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Check for unpinned dependencies
        run: node ./.github/bin/js/check-pinned-dependencies.ts

  generate-audit-matrix:
    name: Generate audit matrix
    needs: [check-package-completeness, check-pinned-dependencies]
    runs-on: ubuntu-latest
    env:
      USE_CHANGED_PACKAGE_MATRIX: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
      IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Collect changed files
        if: ${{ env.USE_CHANGED_PACKAGE_MATRIX == 'true' }}
        run: |
          if [ "${IS_PULL_REQUEST}" = "true" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/npm-audit-changed-files.txt"
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$RUNNER_TEMP/npm-audit-changed-files.txt"
          fi

      - name: Generate matrix
        id: generate-matrix
        run: |
          matrix=$(
            if [ "${USE_CHANGED_PACKAGE_MATRIX}" = "true" ]; then
              node ./.github/bin/js/package-discovery.ts matrix --changed-files-file "$RUNNER_TEMP/npm-audit-changed-files.txt"
            else
              node ./.github/bin/js/package-discovery.ts matrix
            fi
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  audit-packages:
    name: Audit - ${{ matrix.name }}
    needs: generate-audit-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-audit-matrix.outputs.matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.workingDirectory }}
        env:
          # Keep install output focused on dependency installation. The audit runs explicitly in the next step.
          NPM_CONFIG_AUDIT: false

      - name: Run audit
        env:
          NPM_AUDIT_PACKAGE_NAME: ${{ matrix.name }}
          NPM_AUDIT_RESULT_FILE: ${{ runner.temp }}/${{ matrix.artifactName }}/result.json
          NPM_AUDIT_WORKING_DIRECTORY: ${{ matrix.workingDirectory }}
        run: |
          if [ "${{ matrix.hasCustomAuditScript }}" = "true" ]; then
            node ./scripts/runNpmAudit.ts
          else
            node "$GITHUB_WORKSPACE/.github/bin/js/run-npm-audit.ts"
          fi
        working-directory: ${{ matrix.workingDirectory }}

      - name: Upload audit result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ runner.temp }}/${{ matrix.artifactName }}/result.json
          if-no-files-found: error

  report-scheduled-audit-failures:
    name: Report scheduled audit failures
    if: ${{ always() && github.event_name == 'schedule' && needs.audit-packages.result == 'failure' }}
    needs: audit-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # octo-sts, for the project board write
      issues: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Download audit results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/npm-audit-results

      - name: Build issue payload
        run: |
          node ./.github/bin/js/aggregate-npm-audit-results.ts \
            "$RUNNER_TEMP/npm-audit-results" \
            "$RUNNER_TEMP/npm-audit-issue-payload.json"

      - id: sts
        continue-on-error: true
        uses: shopware/octo-sts-action@main
        with:
          scope: shopware
          identity: ManageProjects

      - name: Create or update audit issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_PAYLOAD_FILE: ${{ runner.temp }}/npm-audit-issue-payload.json
          STS_TOKEN: ${{ steps.sts.outputs.token }}
        with:
          script: |
            const fs = require('node:fs');
            const payload = JSON.parse(fs.readFileSync(process.env.ISSUE_PAYLOAD_FILE, 'utf8'));
            const marker = '<!-- nightly-npm-audit-failures -->';

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existingIssue = issues.find((issue) =>
              issue.title === payload.issueTitle && typeof issue.body === 'string' && issue.body.includes(marker)
            );

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: payload.commentBody,
              });
              core.info(`Added comment to issue #${existingIssue.number}`);
              return;
            }

            const createdIssue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: payload.issueTitle,
              body: payload.issueBody,
              labels: ['domain/framework'],
              type: 'Task',
            });

            core.info(`Created issue #${createdIssue.data.number}`);

            // Put the new issue onto the Framework board in the triage lane. Needs the ManageProjects
            // token; without it the issue is still created, just not added to the board.
            if (!process.env.STS_TOKEN) {
              core.warning('No project token available: issue not added to the Framework board.');
              return;
            }

            const projects = getOctokit(process.env.STS_TOKEN);

            const { organization } = await projects.graphql(`query {
              organization(login: "${context.repo.owner}") {
                projectV2(number: 27) {
                  id
                  field(name: "Status") { ... on ProjectV2SingleSelectField { id options { id name } } }
                }
              }
            }`);

            const project = organization?.projectV2;
            const option = project?.field?.options?.find((candidate) => candidate.name === 'To Triage');
            if (!project || !option) {
              core.warning('Framework board or its "To Triage" status was not found; issue left off the board.');
              return;
            }

            const { addProjectV2ItemById } = await projects.graphql(`mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } }
            }`, { project: project.id, content: createdIssue.data.node_id });

            await projects.graphql(`mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field, value: {singleSelectOptionId: $option}}) { projectV2Item { id } }
            }`, { project: project.id, item: addProjectV2ItemById.item.id, field: project.field.id, option: option.id });

            core.info(`Added issue #${createdIssue.data.number} to the Framework board (To Triage).`);
