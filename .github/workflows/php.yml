name: PHP checks

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      nightly:
        type: string
        default: ""
  workflow_call:
    inputs:
      nightly:
        type: string
        default: ""

env:
  COMPOSER_ROOT_VERSION: 6.7.9999999-dev

jobs:
  markdown-only-changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        uses: ./.github/actions/markdown-only-changes

  lint:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    name: "PHP lint"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 8.2
          extensions: ""
          tools: symfony-cli

      - name: Debug
        run: |
          cat composer.json
          composer validate --no-check-publish --no-check-lock

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          custom-cache-key: ${{ runner.os }}-setup-shopware-composer-8.2-${{ hashFiles('composer.json', 'custom/plugins/**/composer.json') }}
          working-directory: ""

      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      # per-run key + prefix restore, like the PHPStan and Rector result caches: a static
      # key is never re-saved once it exists, so the stored cache goes stale against
      # php-cs-fixer's internal signature (PHP/fixer version, rules) and the run silently
      # pays a full scan despite a cache hit
      - name: "Restore result cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./var/cache/cs_fixer
          key: "cs-fixer-result-cache-${{ github.run_id }}"
          restore-keys: |
            cs-fixer-result-cache-

      - name: Lint composer.json files
        run: bin/console sync:composer:version --dry-run

      - name: Analyze composer dependencies
        run: composer dependency-analyzer

      - name: Code Style
        run: composer run cs

      - name: "Save result cache"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: ./var/cache/cs_fixer
          key: "cs-fixer-result-cache-${{ github.run_id }}"

      - name: Lint Snippets
        run: bin/console translation:validate

  phpstan:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    name: "PHPStan"
    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}
          keep-composer-tools: true

      - name: Install Danger # analysed via phpstan-paths.php + registered in phpstan-bootstrap.php
        run: composer install -d vendor-bin/danger-php --no-interaction

      - name: Generate Schema
        run: composer run framework:schema:dump

      - name: "Restore result cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/cache/phpstan
          key: "phpstan-result-cache-${{ github.run_id }}"
          restore-keys: |
            phpstan-result-cache-

      - name: PHPStan
        run: composer run phpstan -- --error-format=table --no-progress

      - name: "Save result cache"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: var/cache/phpstan
          key: "phpstan-result-cache-${{ github.run_id }}"

  rector:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    name: "Rector"
    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}
          keep-composer-tools: "true"

      - name: "Restore result cache"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/cache/rector
          key: "rector-result-cache-${{ github.run_id }}"
          restore-keys: |
            rector-result-cache-

      - name: Rector
        run: composer rector

      - name: "Save result cache"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: var/cache/rector
          key: "rector-result-cache-${{ github.run_id }}"

  bc-checker:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    name: "BC check"
    steps:
      - name: Clone shopware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "1"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"

      - name: Install Dependencies
        run: |
          composer install
      - name: Prepare repo
        run: |
          set -e
          git remote add bc-checker-upstream https://github.com/shopware/platform.git
          git fetch bc-checker-upstream
      - name: Unblock the BC baseline install
        run: composer config --global --json policy.advisories.ignore-id '["PKSA-p9gd-j6gr-6f9t"]'
      - name: BC Checker lastest tag
        if: github.event_name != 'pull_request'
        run: composer run bc-check
      - name: BC Checker PR
        if: github.event_name == 'pull_request' && !contains(github.base_ref, '/feature/')
        run: composer run bc-check -- --from="origin/${{ github.base_ref }}"

  openapi-lint:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      APP_ENV: prod
      APP_URL: http://localhost:8000
      APP_SECRET: def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48
      DATABASE_HOST: "127.0.0.1"
    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          env: prod
          install: true
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Cache npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/var/cache/npm
          key: change-me-on-shopware-api-gen-update

      - name: Prepare schema lint
        env:
          NPM_CONFIG_PREFIX: ${{ github.workspace }}/var/cache/npm
        run: |
          echo "PATH=${{ env.NPM_CONFIG_PREFIX }}/bin:$PATH" >> "$GITHUB_ENV"
          curl localhost:8000/
          npm i -g @redocly/cli@2.46.1 @shopware/api-gen
          STOREFRONT_ID=$(bin/console sales-channel:list --output json | jq -r '.[] | select(.name == "Storefront") | .id')
          export STOREFRONT_ID
          OPENAPI_ACCESS_KEY=$(mysql -u root -h 127.0.0.1 shopware -se "SELECT access_key FROM sales_channel WHERE id = UNHEX(\"${STOREFRONT_ID}\")";)
          export OPENAPI_ACCESS_KEY
          echo -e "OPENAPI_JSON_URL=http://localhost:8000\nSHOPWARE_ADMIN_USERNAME=admin\nSHOPWARE_ADMIN_PASSWORD=shopware\nOPENAPI_ACCESS_KEY=${OPENAPI_ACCESS_KEY}" > .env
          cat .env

      - name: Load OpenApi StoreAPI schema from the instance
        run: |
          api-gen loadSchema --apiType=store

      - name: Upload OpenApi StoreAPI schema
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storeApiSchema.json
          path: ./api-types/storeApiSchema.json
          retention-days: 1

      - name: Run OpenAPI Snapshot Action
        if: github.repository == 'shopware/shopware'
        uses: patzick/explore-openapi-snapshot@4cfd85875214ee1653e0680756b2dddaafde42f2 # v2.1.0
        with:
          schema-file: "./api-types/storeApiSchema.json"
          project: "shopware/store-api"

      - name: Check Store API schema migration report
        run: bin/console framework:store-api:schema-migration-report --scope=core --fail-on-mismatch --pretty -

      - name: Generate StoreAPI schema
        run: |
          api-gen generate --apiType=store

      - name: Lint OpenApi StoreAPI schema
        run: |
          set -euo pipefail
          redocly lint ./api-types/storeApiSchema.json
          redocly lint --format json ./api-types/storeApiSchema.json > redocly-store-api-lint.json 2> /dev/null
          warnings=$(jq '.totals.warnings' redocly-store-api-lint.json)
          if [ "$warnings" -ne 0 ]; then
            echo "Store API Redocly warnings are treated as errors in CI." >&2
            echo "Redocly reported $warnings Store API warning(s)." >&2
            exit 1
          fi

      - name: Generate OpenApi API schema
        run: |
          api-gen loadSchema --apiType=admin && api-gen generate --apiType=admin

      - name: Upload OpenApi AdminAPI schema
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adminApiSchema.json
          path: ./api-types/adminApiSchema.json
          retention-days: 1

      - name: Run OpenAPI Snapshot Action for AdminAPI
        if: github.repository == 'shopware/shopware'
        uses: patzick/explore-openapi-snapshot@4cfd85875214ee1653e0680756b2dddaafde42f2 # v2.1.0
        with:
          schema-file: "./api-types/adminApiSchema.json"
          project: "shopware/admin-api"

      - name: Lint OpenApi AdminAPI schema
        run: |
          redocly lint --skip-rule operation-4xx-response --skip-rule no-server-example.com --skip-rule no-unused-components ./api-types/adminApiSchema.json

  phpunit:
    name: "PHPUnit for ${{ matrix.suite }}"
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - migration
    env:
      APP_ENV: test
      DATABASE_URL: mysql://root@127.0.0.1:3306/root
      APP_URL: http://localhost:8000
      APP_SECRET: def00000bb5acb32b54ff8ee130270586eec0e878f7337dc7a837acc31d3ff00f93a56b595448b4b29664847dd51991b3314ff65aeeeb761a133b0ec0e070433bff08e48
      OPENSEARCH_URL: 127.0.0.1:9200
      ADMIN_OPENSEARCH_URL: 127.0.0.1:9200
      BLUE_GREEN_DEPLOYMENT: 1
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      FEATURE_ALL: ${{ matrix.suite == 'migration' && 'major' || '' }}

    services:
      elasticsearch:
        image: ${{ matrix.suite == 'integration' && 'opensearchproject/opensearch:2' || 'alpine' }}
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: "yourStrongPassword123!"
        ports:
          - "9200:9200"
      database:
        # Run the migration suite against MySQL 8.4, where restrict_fk_on_non_standard_key
        # defaults to ON. This makes the install/migrate step reject any foreign key that
        # references a non-unique key (the MySQL 8.4 disaster-recovery import failure),
        # before tests even run. Other suites stay on MySQL 8.0.
        image: ${{ matrix.suite == 'migration' && 'mysql:8.4' || 'mysql:8.0' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: shopware
        ports:
          - "3306:3306"
        options: --health-cmd="mysqladmin ping || mariadb-admin ping"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup and install Shopware
        uses: ./.github/actions/phpunit-prepare
        with:
          keep-composer-tools: "true"
          migration-coverage: ${{ matrix.suite == 'migration' }}
      - name: Install Danger # the unit tests for the Danger rules type against the danger-php package
        if: ${{ matrix.suite == 'unit' }}
        run: composer install -d vendor-bin/danger-php --no-interaction
      - name: Run PHPUnit with coverage
        id: phpunit
        uses: ./.github/actions/phpunit-run
        with:
          test-testsuite: ${{ matrix.suite }}
          coverage: "true"
      - name: Upload coverage and test results to Codecov
        uses: ./.github/actions/phpunit-upload
        # !cancelled(): junit test results must upload even when the run failed.
        # conclusion != 'skipped': but not when PHPUnit never ran (e.g. service container setup
        # failed), because then checkout never ran either and this local action cannot resolve.
        if: ${{ !cancelled() && steps.phpunit.conclusion != 'skipped' }}
        with:
          coverage: "true"
          coverage-flags: phpunit-${{ matrix.suite }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload junit report for the failure tracking issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-phpunit-${{ matrix.suite }}
          path: junit.xml
          # a job that fails before PHPUnit reports (setup, crash) has no junit.xml
          if-no-files-found: ignore
          overwrite: true

  license-check:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    name: "PHP license check"
    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}
      - name: Check license
        run: |
          # Word splitting is intentional: expand .allowed-licenses into repeated "-a <license>" args.
          # shellcheck disable=SC2046
          vendor/bin/composer-license-checker check $(xargs -n1 echo -a < .allowed-licenses)

  composer-audit:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    name: "composer audit"
    steps:
      - name: Clone shopware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"

      - name: Install Dependencies
        run: composer install

      - name: Composer audit
        run: composer audit

  composer-prefer-lowest:
    runs-on: ubuntu-24.04
    name: "Smoke test with lowest dependencies"
    if: inputs.nightly == 'true'
    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: ${{ github.ref }}
          shopware-repository: ${{ github.repository }}

      - name: Install lowest dependencies
        run: composer update --prefer-lowest

      - name: Generate Schema
        run: composer run framework:schema:dump

      - name: Run PHPStan as smoke test
        run: composer phpstan

  php-check:
    if: always()
    needs:
      - markdown-only-changes
      - lint
      - phpstan
      - openapi-lint
      - phpunit
      - license-check
      - composer-audit
      - bc-checker

    runs-on: Ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          # allowed-failures: docs, linters
          allowed-skips: ${{ needs.markdown-only-changes.outputs.docs_only == 'true' && 'lint, phpstan, rector, openapi-lint, phpunit, license-check, composer-audit, bc-checker' || '' }}
          jobs: ${{ toJSON(needs) }}
