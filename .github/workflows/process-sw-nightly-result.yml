name: Nightly Triage Result Processor

# Post-run processor for the `sw-nightly` workflow. Downloads the run's artifacts,
# validates the `nightly-triage-output.json` payload against the NightlyTriageOutput
# shape, scans for accidental or prompt-injection-induced secret leakage, and posts
# a formatted cluster analysis back to the nightly tracking issue after validation
# passes. Mirrors process-sw-triage-result.yml.
#
# Triggers on every completion of the sw-nightly workflow. Validation or processing
# failures surface in the GitHub UI as a red check on the processor run. The
# staging artifact itself is left in place (deleting would need actions:write);
# the failure is the signal.
#
# Validator is `.github/bin/js/validate-sw-nightly-output.ts` (run via Node native type-stripping), no deps.

on:
  workflow_run:
    workflows: ["Shopware Nightly Failure Triage"]
    types: [completed]

permissions:
  actions: read # list + download artifacts of the triggering run
  contents: read # checkout the validator script
  issues: write # post the validated cluster analysis as an issue comment

concurrency:
  group: process-sw-nightly-result-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  process:
    # Only process a run that actually produced triage output. The agent workflow triggers on every
    # repo issue_comment/label and skips the irrelevant ones; a skipped run still fires workflow_run,
    # so without this guard the processor spins up a runner for every comment across the repo.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout validator only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/bin/js
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Download nightly-triage staging artifact
        id: download
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              },
            );
            const match = artifacts.find(a => a.name === 'safe-outputs-upload-artifacts');
            if (!match) {
              core.notice('No safe-outputs-upload-artifacts found on the sw-nightly run — nothing to validate.');
              core.setOutput('found', 'false');
              return;
            }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: 'zip',
            });
            fs.writeFileSync('artifact.zip', Buffer.from(dl.data));
            core.setOutput('found', 'true');

      - name: Unpack staging artifact
        if: steps.download.outputs.found == 'true'
        run: |
          mkdir -p artifact
          unzip -o artifact.zip -d artifact/
          echo "::group::Artifact contents"
          find artifact -type f
          echo "::endgroup::"

      - name: Locate nightly-triage-output.json
        if: steps.download.outputs.found == 'true'
        id: locate
        run: |
          set -o pipefail
          file=$(find artifact -type f -name 'nightly-triage-output.json' -print -quit)
          if [ -z "$file" ]; then
            echo "No nightly-triage-output.json inside staging — agent may have emitted no upload."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found at: $file"
            {
              echo "file=$file"
              echo "found=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Validate
        if: steps.locate.outputs.found == 'true'
        env:
          NIGHTLY_OUTPUT_FILE: ${{ steps.locate.outputs.file }}
        run: node .github/bin/js/validate-sw-nightly-output.ts "${NIGHTLY_OUTPUT_FILE}"

      - name: Download nightly context artifact
        if: steps.locate.outputs.found == 'true'
        id: download_context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              },
            );
            const match = artifacts.find(a => a.name === 'nightly-context');
            if (!match) {
              core.setFailed('No nightly-context artifact found on the sw-nightly run.');
              return;
            }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: 'zip',
            });
            fs.writeFileSync('nightly-context.zip', Buffer.from(dl.data));

      - name: Unpack nightly context artifact
        if: steps.locate.outputs.found == 'true'
        run: |
          mkdir -p nightly-context
          unzip -o nightly-context.zip -d nightly-context/
          echo "::group::Nightly context artifact contents"
          find nightly-context -type f
          echo "::endgroup::"

      - name: Locate nightly-context.json
        if: steps.locate.outputs.found == 'true'
        id: locate_context
        run: |
          set -o pipefail
          file=$(find nightly-context -type f -name 'nightly-context.json' -print -quit)
          if [ -z "$file" ]; then
            echo "No nightly-context.json inside nightly-context artifact."
            exit 1
          fi

          echo "Found at: $file"
          {
            echo "file=$file"
            echo "found=true"
          } >> "$GITHUB_OUTPUT"

      - name: Comment cluster analysis
        if: steps.locate.outputs.found == 'true' && steps.locate_context.outputs.found == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NIGHTLY_OUTPUT_FILE: ${{ steps.locate.outputs.file }}
          NIGHTLY_CONTEXT_FILE: ${{ steps.locate_context.outputs.file }}
        with:
          script: |
            const fs = require('node:fs');

            const rawOutput = fs.readFileSync(process.env.NIGHTLY_OUTPUT_FILE, 'utf8').trim();
            const triage = JSON.parse(rawOutput);
            const nightlyContext = JSON.parse(fs.readFileSync(process.env.NIGHTLY_CONTEXT_FILE, 'utf8'));
            const issueNumber = Number(nightlyContext.issue_number);
            const runId = Number(nightlyContext.run_id);

            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              throw new Error(`Invalid issue_number in nightly-context.json: ${JSON.stringify(nightlyContext.issue_number)}`);
            }
            if (!Number.isInteger(runId) || runId <= 0) {
              throw new Error(`Invalid run_id in nightly-context.json: ${JSON.stringify(runId)}`);
            }

            const html = (value) => String(value)
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');
            const inlineCode = (value) => `<code>${html(value)}</code>`;

            // Confirmed clusters whose owner is not among the issue's current labels are re-route suggestions.
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const currentLabels = new Set(issue.data.labels.map((label) => typeof label === 'string' ? label : label.name));

            const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
            const runUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const clusterSections = triage.clusters.map((cluster, index) => {
              const flags = [
                cluster.known_cluster ? 'known cluster' : null,
                cluster.flaky_or_environmental ? 'flaky/environmental' : null,
              ].filter(Boolean).join(', ');
              const owner = cluster.owner_label === null ? '_unroutable_' : inlineCode(cluster.owner_label);
              const reroute = cluster.confidence === 'confirmed'
                && cluster.owner_label !== null
                && !currentLabels.has(cluster.owner_label)
                ? `\n\n**Suggested re-route:** this cluster belongs to ${inlineCode(cluster.owner_label)} (confirmed root-cause owner).`
                : '';
              const related = [
                ...cluster.related_issues.map((n) => `#${n}`),
                ...cluster.related_prs.map((n) => `#${n}`),
              ].join(', ');

              return [
                `### Cluster ${index + 1}: ${inlineCode(cluster.signature)}`,
                '',
                `| Confidence | Owner | Flags | Related |`,
                '|---|---|---|---|',
                `| ${inlineCode(cluster.confidence)} | ${owner} | ${flags || '_none_'} | ${related || '_none_'} |`,
                '',
                html(cluster.root_cause) + reroute,
                '',
                '<details>',
                `<summary>${cluster.tests.length} tests, evidence</summary>`,
                '',
                ...cluster.tests.map((test) => `- ${inlineCode(test)}`),
                '',
                ...cluster.evidence_quotes.map((quote) => `> ${inlineCode(quote)}`),
                '',
                '</details>',
              ].join('\n');
            });

            const backtickRuns = rawOutput.match(/`+/g) ?? [];
            const fence = '`'.repeat(Math.max(3, ...backtickRuns.map((run) => run.length + 1)));
            const marker = `<!-- shopware-ai-nightly:${runId} -->`;
            const body = [
              marker,
              '## AI Nightly Triage Result',
              '',
              `Validated result from [sw-nightly run ${runId}](${runUrl}).`,
              '',
              html(triage.summary),
              '',
              ...clusterSections,
              '',
              '<details>',
              '<summary>nightly-triage-output.json</summary>',
              '',
              `${fence}json`,
              rawOutput,
              fence,
              '',
              '</details>',
            ].join('\n');

            if (body.length > 65000) {
              throw new Error(`Rendered nightly-triage comment is too large (${body.length} characters).`);
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
