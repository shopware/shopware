name: Publish Playwright reports

on:
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: Integration workflow run ID to publish reports from
        required: true
  workflow_run:
    workflows: ["Integration tests"]
    types: [completed]

permissions:
  actions: read
  id-token: write

concurrency:
  group: publish-playwright-reports-${{ github.event.workflow_run.id || github.event.inputs.workflow_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_TRACES_DOMAIN: ${{ vars.PLAYWRIGHT_TRACES_DOMAIN }}
      REPORT_PREFIX: playwright-reports
      S3_BUCKET: shopware-ci-playwright-traces
    steps:
      - name: Resolve source workflow run
        id: source-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKFLOW_RUN_ID_INPUT: ${{ github.event.inputs.workflow_run_id }}
        with:
          script: |
            let workflowRun = context.payload.workflow_run ?? null;

            if (context.eventName === 'workflow_dispatch') {
              const runIdInput = process.env.WORKFLOW_RUN_ID_INPUT ?? '';
              const runId = Number(runIdInput);

              if (!Number.isInteger(runId) || runId <= 0) {
                core.setFailed(`Invalid workflow_run_id: '${runIdInput}' (must be a positive integer)`);
                return;
              }

              const { data } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });

              workflowRun = data;
            }

            if (!workflowRun) {
              core.setFailed('Unable to resolve the source workflow run.');
              return;
            }

            if (!workflowRun.run_attempt) {
              core.setFailed(`Workflow run ${workflowRun.id} is missing run_attempt.`);
              return;
            }

            if (!workflowRun.html_url) {
              core.setFailed(`Workflow run ${workflowRun.id} is missing html_url.`);
              return;
            }

            core.setOutput('run-attempt', String(workflowRun.run_attempt));
            core.setOutput('run-id', String(workflowRun.id));
            core.setOutput('run-url', workflowRun.html_url);

      - name: Check if trusted upload is configured
        id: check-aws-allowed
        env:
          PLAYWRIGHT_ROLE_ARN: ${{ secrets.PLAYWRIGHT_TRACES_UPLOAD_ROLE_ARN }}
          PLAYWRIGHT_TRACES_DOMAIN: ${{ vars.PLAYWRIGHT_TRACES_DOMAIN }}
        shell: bash
        run: |
          if [ -z "${PLAYWRIGHT_ROLE_ARN}" ]; then
            echo "has_role_arn=false" >> "$GITHUB_OUTPUT"
            echo "Secret PLAYWRIGHT_TRACES_UPLOAD_ROLE_ARN is empty; skipping trusted report publishing." >&2
          elif [ -z "${PLAYWRIGHT_TRACES_DOMAIN}" ]; then
            echo "has_role_arn=false" >> "$GITHUB_OUTPUT"
            echo "Variable PLAYWRIGHT_TRACES_DOMAIN is empty; skipping trusted report publishing." >&2
          else
            echo "has_role_arn=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download staged Playwright report artifacts
        if: ${{ steps.check-aws-allowed.outputs.has_role_arn == 'true' }}
        id: download-artifacts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number('${{ steps.source-run.outputs.run-id }}'),
                per_page: 100,
              },
            );

            // ATS acceptance artifacts and the update artifact bundle playwright-report/ alongside test-results/.
            const candidatePatterns = [/^ats(?:-changed)?-/, /^playwright-report-update-/];
            const artifactsWithReports = artifacts.filter((artifact) =>
              candidatePatterns.some((pattern) => pattern.test(artifact.name))
            );

            if (artifactsWithReports.length === 0) {
              core.notice('No workflow artifacts found for the source run.');
              core.setOutput('found', 'false');
              return;
            }

            fs.mkdirSync('artifacts', { recursive: true });

            const metadata = [];

            for (const artifact of artifactsWithReports) {
              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
                archive_format: 'zip',
              });

              const file = path.join('artifacts', `${artifact.id}.zip`);
              fs.writeFileSync(file, Buffer.from(download.data));

              metadata.push({
                file,
                id: artifact.id,
                name: artifact.name,
              });
            }

            fs.writeFileSync('artifacts/metadata.json', JSON.stringify(metadata, null, 2));
            core.setOutput('found', 'true');

      - name: Configure AWS credentials
        if: ${{ steps.check-aws-allowed.outputs.has_role_arn == 'true' && steps.download-artifacts.outputs.found == 'true' }}
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          aws-region: eu-central-1
          role-session-name: gha-playwright-${{ steps.source-run.outputs.run-id }}-${{ steps.source-run.outputs.run-attempt }}
          role-to-assume: ${{ secrets.PLAYWRIGHT_TRACES_UPLOAD_ROLE_ARN }}

      - name: Upload Playwright HTML reports to S3
        if: ${{ steps.check-aws-allowed.outputs.has_role_arn == 'true' && steps.download-artifacts.outputs.found == 'true' }}
        shell: bash
        env:
          WORKFLOW_RUN_ATTEMPT: ${{ steps.source-run.outputs.run-attempt }}
          WORKFLOW_RUN_ID: ${{ steps.source-run.outputs.run-id }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path
          from stat import S_ISLNK

          artifacts = json.loads(Path('artifacts/metadata.json').read_text())
          staging_root = Path('playwright-report-artifacts')
          staging_root.mkdir(exist_ok=True)

          uploads = []

          def sanitize(name: str) -> str:
              sanitized = re.sub(r'[^A-Za-z0-9._-]+', '-', name).strip('-').lower()
              return sanitized or 'playwright-report'

          for artifact in artifacts:
              extract_dir = staging_root / sanitize(artifact['name'])
              extract_dir.mkdir(parents=True, exist_ok=True)

              with zipfile.ZipFile(artifact['file']) as archive:
                  base_dir = extract_dir.resolve()
                  for member in archive.infolist():
                      member_path = Path(member.filename)
                      target_path = (base_dir / member_path).resolve()
                      mode = member.external_attr >> 16

                      if member_path.is_absolute() or '..' in member_path.parts:
                          raise RuntimeError(f'Unsafe artifact entry detected in {artifact["name"]}: {member.filename}')

                      if S_ISLNK(mode):
                          raise RuntimeError(f'Symlink entries are not allowed in {artifact["name"]}: {member.filename}')

                      try:
                          target_path.relative_to(base_dir)
                      except ValueError as error:
                          raise RuntimeError(
                              f'Artifact entry escapes extraction directory in {artifact["name"]}: {member.filename}'
                          ) from error

                      if member.is_dir():
                          target_path.mkdir(parents=True, exist_ok=True)
                          continue

                      target_path.parent.mkdir(parents=True, exist_ok=True)

                      with archive.open(member) as source, open(target_path, 'wb') as destination_file:
                          shutil.copyfileobj(source, destination_file)

              report_root = None

              if (extract_dir / 'index.html').is_file():
                  report_root = extract_dir
              else:
                  for candidate in extract_dir.rglob('index.html'):
                      if candidate.parent.name == 'playwright-report':
                          report_root = candidate.parent
                          break

              if report_root is None:
                  print(f'No Playwright HTML report found in artifact {artifact["name"]}, skipping.')
                  continue

              s3_report_path = f'{os.environ["REPORT_PREFIX"]}/{os.environ["WORKFLOW_RUN_ID"]}-{os.environ["WORKFLOW_RUN_ATTEMPT"]}/{sanitize(artifact["name"])}-{artifact["id"]}'

              subprocess.run(
                  ['aws', 's3', 'cp', str(report_root), f's3://{os.environ["S3_BUCKET"]}/{s3_report_path}/', '--recursive'],
                  check=True,
              )

              uploads.append(
                  {
                      'artifact': artifact['name'],
                      'url': f'https://{os.environ["PLAYWRIGHT_TRACES_DOMAIN"]}/{s3_report_path}/index.html',
                  }
              )

          Path('uploaded-reports.json').write_text(json.dumps(uploads, indent=2))
          print(f'Uploaded {len(uploads)} Playwright report(s).')
          PY

      - name: Publish report summary
        if: ${{ steps.download-artifacts.outputs.found == 'true' }}
        shell: bash
        env:
          WORKFLOW_RUN_URL: ${{ steps.source-run.outputs.run-url }}
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          uploaded_reports = json.loads(Path('uploaded-reports.json').read_text()) if Path('uploaded-reports.json').exists() else []

          summary_lines = [
              '### Playwright HTML reports',
              '',
              f'Source run: {os.environ["WORKFLOW_RUN_URL"]}',
              '',
          ]

          if not uploaded_reports:
              summary_lines.append('No Playwright HTML reports were uploaded.')
          else:
              summary_lines.extend([f'- `{report["artifact"]}`: {report["url"]}' for report in uploaded_reports])

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(summary_lines) + '\n')
          PY
