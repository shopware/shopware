name: Report PHPUnit failures

# Files (or updates) a tracking issue from the junit.xml artifacts of a failed scheduled
# PHPUnit run, grouped by owning domain. Called by nightly.yml and nightly-major.yml;
# the PHPUnit jobs of the run (redis, integration.yml, integration-major.yml, php.yml)
# upload the `junit-phpunit-*` artifacts this consumes.

on:
  workflow_call:
    inputs:
      report-title:
        type: string
        required: true
        description: "Tracking-issue title; together with the body marker it is the dedupe key"

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Download junit reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: junit-phpunit-*
          path: ${{ runner.temp }}/junit-reports

      - name: Build issue payload
        env:
          REPORT_TITLE: ${{ inputs.report-title }}
        run: |
          node ./.github/bin/js/report-phpunit-nightly-failures.ts \
            "$RUNNER_TEMP/junit-reports" \
            "$RUNNER_TEMP/phpunit-failure-issue-payload.json"

      - name: Create or update tracking issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_PAYLOAD_FILE: ${{ runner.temp }}/phpunit-failure-issue-payload.json
        with:
          script: |
            const fs = require('node:fs');
            const payload = JSON.parse(fs.readFileSync(process.env.ISSUE_PAYLOAD_FILE, 'utf8'));
            const { owner, repo } = context.repo;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            // comment on the tracked issue when one is open, create it otherwise
            const upsert = async (content, labels) => {
              const existing = openIssues.find((issue) =>
                issue.title === content.issueTitle
                  && typeof issue.body === 'string'
                  && issue.body.includes(content.issueMarker)
              );

              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: content.commentBody,
                });
                core.info(`Added comment to issue #${existing.number}`);
                return existing;
              }

              const created = await github.rest.issues.create({
                owner,
                repo,
                title: content.issueTitle,
                body: content.issueBody,
                labels,
              });
              core.info(`Created issue #${created.data.number}`);
              return created.data;
            };

            const parent = await upsert(payload.parent, []);

            const subIssues = await github.paginate('GET /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
              owner,
              repo,
              issue_number: parent.number,
              per_page: 100,
            });
            const linkedIds = new Set(subIssues.map((issue) => issue.id));

            for (const domain of payload.domains) {
              const issue = await upsert(domain, domain.label ? [domain.label] : []);

              if (linkedIds.has(issue.id)) {
                continue;
              }
              try {
                await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues', {
                  owner,
                  repo,
                  issue_number: parent.number,
                  sub_issue_id: issue.id,
                  replace_parent: true,
                });
              } catch (error) {
                core.warning(`Could not link #${issue.number} as sub-issue of #${parent.number}: ${error.message}`);
              }
            }
