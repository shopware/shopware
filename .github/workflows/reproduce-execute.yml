name: "Reproduce: execute"

# Deterministic half of the reproduce pipeline (the part gh-aw cannot express): the parallel
# reported‖trunk provision/execute/verdict/report matrix.  *** DRAFT ***
#
# Paired with the gh-aw agent edge `.github/workflows/reproduce-analyze.md` ("Reproduce: analyze"):
# that workflow derives the plan and uploads it; this one runs it. Triggered `on: workflow_run`
# when the analyze workflow completes, it downloads the analysis artifact and runs the legs.
# Together the pair REPLACES the hand-written reproduce.yml (retired at cutover — it collides
# with the analyze workflow on the ci:reproduce / /reproduce triggers).
#
# Every bin/*.sh here (matrix, leg-plan, provision, run-leg, verdict, report, seed,
# embed-evidence) is reused UNCHANGED from reproduce.yml; the only new code is this file's
# workflow_run trigger + the `bootstrap` job that re-hydrates the plan from the analyze run.

on:
  workflow_run:
    workflows: ["Reproduce: analyze"] # MUST match the analyze workflow's compiled `name:`
    types: [completed]
  # Re-run the deterministic half against an EXISTING analyze run's plan, with no new analyze
  # (the analyze edge is gh-aw/LLM-gated; this lets a plan be re-verified after a script/seed
  # fix without spending the agent budget). The plan + context are pulled from the given run id
  # exactly as the workflow_run path does.
  workflow_dispatch:
    inputs:
      analyze_run_id:
        description: "Run id to re-execute the plan from — a 'Reproduce: analyze' run, or a prior 'Reproduce: execute' run (its re-published `analysis` artifact, which outlives the analyze run's short-lived plan)."
        required: true
        type: string
      issue_number:
        description: "Issue to comment on. Only needed when the source run's reproduce-context artifact has expired (e.g. pulling the plan from an old execute run)."
        required: false
        type: string

concurrency:
  group: reproduce-execute-${{ github.event.workflow_run.id || inputs.analyze_run_id }}
  cancel-in-progress: false

env:
  # setup-shopware pulls node20 sub-actions; force node24 to silence the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  issues: write # matrix.sh needs-info/low-confidence draft + the final verdict comment
  actions: read # download the analyze run's artifacts (cross-run)

jobs:
  # --------------------------------------------------------------------------
  # Bootstrap: re-hydrate the plan from the analyze run. Replaces gate+analyze.
  # Runs only if the analyze run SUCCEEDED and produced a plan (if it emitted
  # needs_info / noop there's no analysis.json → nothing to execute, exit clean).
  # --------------------------------------------------------------------------
  bootstrap:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      issue: ${{ steps.ctx.outputs.issue }}
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # gh-aw uploads the agent's `upload-artifact` safe-output under this fixed name.
      - name: Download plan from the analyze run
        continue-on-error: true # absent when analyze emitted needs_info/noop (no plan)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: safe-outputs-upload-artifacts
          path: plan
          run-id: ${{ github.event.workflow_run.id || inputs.analyze_run_id }}
          github-token: ${{ github.token }}
      # Fallback for a manual rerun: an analyze run's plan artifact has a short retention, but
      # every execute run re-publishes the plan as `analysis` (7-day retention). So a dispatch
      # may also point at a prior execute run and recover the plan from there.
      - name: Fallback — plan re-published by a prior execute run
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: analysis
          path: plan
          run-id: ${{ inputs.analyze_run_id }}
          github-token: ${{ github.token }}
      - name: Download reproduce context (issue number)
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reproduce-context
          path: ctx
          run-id: ${{ github.event.workflow_run.id || inputs.analyze_run_id }}
          github-token: ${{ github.token }}
      - id: gate
        run: |
          set -euo pipefail
          if [ -f plan/analysis.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Analyze produced no plan (needs_info / noop) — nothing to execute."
          fi
      - id: ctx
        if: steps.gate.outputs.run == 'true'
        env:
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ -f ctx/reproduce-context.json ]; then
            echo "issue=$(jq -r '.issue_number' ctx/reproduce-context.json)" >> "$GITHUB_OUTPUT"
          else
            echo "issue=${INPUT_ISSUE}" >> "$GITHUB_OUTPUT"
          fi
      # Stage the plan + scripts at the workspace root so matrix.sh and the legs find them.
      - if: steps.gate.outputs.run == 'true'
        run: cp plan/* . 2>/dev/null || true
      # HARD GATE: refuse a structurally-broken bundle BEFORE provisioning two shops. Ports the
      # core static rules of #17724's validate-bundle.mjs (.github/actions/repro/bin).
      - name: Validate bundle (hard gate)
        id: validate
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          node .github/actions/repro/bin/validate-bundle.mjs > validate-out.txt 2>&1 && code=0 || code=$?
          cat validate-out.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Reject bundle that failed validation
        if: steps.gate.outputs.run == 'true' && steps.validate.outputs.code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE: ${{ steps.ctx.outputs.issue }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          retry-exempt-status-codes: 400,403,404,422
          script: |
            const fs = require('fs');
            const out = (fs.existsSync('validate-out.txt') ? fs.readFileSync('validate-out.txt', 'utf8') : '').trim();
            const issue = Number(process.env.ISSUE || '0');
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue,
                body: `🚫 **Reproduce: bundle rejected by static validation** — the generated reproduction was not run.\n\n\`\`\`\n${out}\n\`\`\`\n\nFix the listed contract violation(s) and re-run.`,
              });
            }
            core.setFailed('Bundle failed static validation — see the rejection comment.');
      # Same target matrix as today (reported‖trunk dedup; needs-info / <0.4 confidence bails).
      - id: matrix
        if: steps.gate.outputs.run == 'true' && steps.validate.outputs.code == '0'
        env:
          ISSUE: ${{ steps.ctx.outputs.issue }}
          BRANCH: trunk
          SKIP_REPORTED: "false"
          POST: "true"
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/repro/bin/matrix.sh
      # Re-publish as "analysis" so the leg/verdict/report jobs download it normally (unchanged).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.gate.outputs.run == 'true' && steps.validate.outputs.code == '0'
        with:
          name: analysis
          path: |
            analysis.json
            fixtures.json
            repro.spec.ts
            ReproTest.php
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Reproduce: one parallel leg per target. Identical to reproduce.yml's job,
  # only `needs`/`if`/matrix source change (bootstrap instead of gate+analyze).
  # --------------------------------------------------------------------------
  reproduce:
    needs: bootstrap
    if: needs.bootstrap.outputs.run == 'true' && needs.bootstrap.outputs.targets != '[]' && needs.bootstrap.outputs.targets != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.bootstrap.outputs.targets) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: analysis
      - id: plan
        env:
          LEG_VERSION: ${{ matrix.version }}
          BRANCH: trunk
        run: bash .github/actions/repro/bin/leg-plan.sh
      - id: provision
        if: steps.plan.outputs.executor == 'http' || steps.plan.outputs.executor == 'playwright' || steps.plan.outputs.executor == 'direct'
        continue-on-error: true
        uses: ./.github/actions/repro/provision
        with:
          version: ${{ steps.plan.outputs.version }}
          admin-build: ${{ steps.plan.outputs.admin_build }}
          storefront-build: ${{ steps.plan.outputs.storefront_build }}
      - name: Seed fixtures
        id: seed
        if: steps.provision.outcome == 'success'
        continue-on-error: true
        env:
          APP_URL: ${{ steps.provision.outputs.app_url }}
          SC_ID: ${{ steps.provision.outputs.sc_id }}
        run: PAYLOAD=fixtures.json bash .github/actions/repro/bin/seed.sh
      # Staged precheck: for a playwright leg, try analyze's cheap http precheck FIRST. A
      # TRUSTED + conclusive precheck stands as the leg verdict and skips the (expensive,
      # render-dependent) Playwright steps below; otherwise it is corroboration only. See
      # bin/run-precheck.sh. continue-on-error: a precheck failure must never block the leg.
      - name: Run precheck (cheap http; may skip Playwright)
        id: precheck
        if: steps.plan.outputs.executor == 'playwright' && steps.provision.outcome == 'success' && steps.seed.outcome == 'success'
        continue-on-error: true
        env:
          TARGET: ${{ steps.plan.outputs.role }}
          APP_URL: ${{ steps.provision.outputs.app_url }}
          SW_ACCESS_KEY: ${{ steps.provision.outputs.access_key }}
          SC_ID: ${{ steps.provision.outputs.sc_id }}
        run: bash .github/actions/repro/bin/run-precheck.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.plan.outputs.executor == 'playwright' && steps.provision.outcome == 'success' && steps.seed.outcome == 'success' && steps.precheck.outputs.decisive != 'true'
        with:
          node-version: 22
      - name: Install Playwright
        if: steps.plan.outputs.executor == 'playwright' && steps.provision.outcome == 'success' && steps.seed.outcome == 'success' && steps.precheck.outputs.decisive != 'true'
        run: |
          npm init -y >/dev/null
          npm i -D @playwright/test
          npx playwright install --with-deps chromium
      - name: Mark leg blocked
        if: steps.provision.outcome == 'failure' || steps.seed.outcome == 'failure'
        env:
          TARGET: ${{ steps.plan.outputs.role }}
          FAILED: ${{ steps.seed.outcome == 'failure' && 'seed' || 'provision' }}
        run: bash .github/actions/repro/bin/leg-blocked.sh
      - name: Run executor
        if: steps.provision.outcome != 'failure' && steps.seed.outcome != 'failure' && steps.precheck.outputs.decisive != 'true'
        env:
          TARGET: ${{ steps.plan.outputs.role }}
          EXECUTOR: ${{ steps.plan.outputs.executor }}
          APP_URL: ${{ steps.provision.outputs.app_url }}
          SW_ACCESS_KEY: ${{ steps.provision.outputs.access_key }}
          SC_ID: ${{ steps.provision.outputs.sc_id }}
        run: bash .github/actions/repro/bin/run-leg.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repro-${{ steps.plan.outputs.role }}
          path: |
            result.json
            precheck-result.json
            precheck.json
            repro.sh
            repro.spec.ts
            ReproTest.php
            phpunit-output.txt
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Verdict: deterministic decision from leg statuses + Analyze confidence.
  # --------------------------------------------------------------------------
  verdict:
    needs: [bootstrap, reproduce]
    if: always() && needs.bootstrap.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      has_results: ${{ steps.v.outputs.has_results }}
      verdict: ${{ steps.v.outputs.verdict }}
      fix_candidate: ${{ steps.v.outputs.fix_candidate }}
      unsure_reason: ${{ steps.v.outputs.unsure_reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - id: v
        run: MODE=reproduce ART=artifacts bash .github/actions/repro/bin/verdict.sh

  # --------------------------------------------------------------------------
  # Report: render the comment from verdict + per-leg evidence, post on the issue.
  # (Commit attribution — the gated agent step — is deferred; it is another agentic
  # slice that belongs on the gh-aw side or a small follow-up, not this deterministic job.)
  # --------------------------------------------------------------------------
  report:
    needs: [bootstrap, reproduce, verdict]
    if: always() && needs.bootstrap.outputs.run == 'true' && needs.verdict.outputs.has_results == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # post the comment
      contents: write # push inline evidence (gated by vars.REPRO_EVIDENCE_BRANCH)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - id: render
        env:
          MODE: reproduce
          ISSUE: ${{ needs.bootstrap.outputs.issue }}
          VERDICT: ${{ needs.verdict.outputs.verdict }}
          FIX: ${{ needs.verdict.outputs.fix_candidate }}
          UNSURE: ${{ needs.verdict.outputs.unsure_reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/actions/repro/bin/report.sh
      - name: Embed inline evidence
        if: needs.verdict.outputs.verdict != 'blocked' && vars.REPRO_EVIDENCE_BRANCH != ''
        continue-on-error: true
        env:
          BRANCH: ${{ vars.REPRO_EVIDENCE_BRANCH }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TOKEN: ${{ github.token }}
        run: bash .github/actions/repro/bin/embed-evidence.sh
      - name: Post comment
        # 'blocked' = infra/seed failure, not a bug verdict → keep it in the job summary only.
        if: needs.verdict.outputs.verdict != 'blocked' && needs.bootstrap.outputs.issue != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          retry-exempt-status-codes: 400,403,404,422
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.bootstrap.outputs.issue }}'),
              body: fs.readFileSync('comment.md', 'utf8'),
            });

  # --------------------------------------------------------------------------
  # Analyze-failed notice: when the analyze workflow itself fails (agent crash,
  # API cap, timeout) there is no plan and no verdict will ever be posted. Leave
  # ONE concise comment so the issue isn't silent. (gh-aw status-comment was
  # turned off to drop the start/"analyze complete" chatter — gh-aw can't post a
  # comment on failure only — so the failure signal lives here, on the
  # deterministic side that always runs after analyze.)
  # --------------------------------------------------------------------------
  analyze-failed-notice:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment that analyze did not complete
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          retries: 3
          retry-exempt-status-codes: 400,403,404,422
          script: |
            // The analyze run-name is "Reproduce: analyze #<issue>", surfaced verbatim as the
            // workflow_run display_title — parse the issue number from it (always present, even
            // when the agent died before uploading any artifact).
            const title = context.payload.workflow_run.display_title || '';
            const m = title.match(/#(\d+)/);
            if (!m) { core.info(`no issue number in run title: "${title}" — skipping notice`); return; }
            const runUrl = context.payload.workflow_run.html_url;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(m[1]),
              body: `⚠️ Reproduce: the analyze step did not complete, so no reproduction was produced. See the [run](${runUrl}) for details.`,
            });
