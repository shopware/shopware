      - name: Parse MCP Gateway logs for step summary
        if: always()
        id: parse-mcp-gateway
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/parse_mcp_gateway_log.cjs');
            await main();
      - name: Write agent output placeholder if missing
        if: always()
        run: |
          if [ ! -f /tmp/gh-aw/agent_output.json ]; then
            echo '{"items":[]}' > /tmp/gh-aw/agent_output.json
          fi
      - if: always()
        name: Audit workspace edits
        run: "set -euo pipefail\ngit status --porcelain > /tmp/repro-post-status.txt\nnew=$(comm -13 <(sort /tmp/repro-pre-status.txt) <(sort /tmp/repro-post-status.txt) || true)\n: > workspace-edits.txt\nwhile IFS= read -r line; do\n  [ -n \"$line\" ] || continue\n  path=${line:3}; path=${path#\\\"}; path=${path%\\\"}\n  case \"$path\" in\n    reproduction-plan.json|fixtures.json|repro.spec.ts|ReproTest.php|repro.sh|\\\n    result.json|builder-result.json|seed-error.txt|phpunit-output.txt|giveup.txt|\\\n    seeded-readiness.json|admin-state.json|context.md|issue-class.txt|agent-summary.md|workspace-edits.txt|\\\n    pw-*.txt|pw-*.json|.repro-*|.playwright-cli/*|.playwright-cli|\\\n    test-results/*|playwright-report/*|shop/*|node_modules/*|package.json|package-lock.json) ;;\n    *) printf '%s\\n' \"$path\" >> workspace-edits.txt ;;\n  esac\ndone <<< \"$new\"\nif [ -s workspace-edits.txt ]; then echo \"::warning::agent changed files outside the bundle:\"; cat workspace-edits.txt; else echo \"no stray edits\"; fi\n"
      - if: always()
        name: Extract agent summary
