  activation:
    needs: pre_activation
    if: "needs.pre_activation.outputs.activated == 'true' && ((github.event_name == 'issues' || github.event_name == 'issue_comment') && (github.event_name == 'issues' && (startsWith(github.event.issue.body, '/sw-reproduce ') || startsWith(github.event.issue.body, '/sw-reproduce\n') || github.event.issue.body == '/sw-reproduce') || github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/sw-reproduce ') || startsWith(github.event.comment.body, '/sw-reproduce\n') || github.event.comment.body == '/sw-reproduce') && github.event.issue.pull_request == null) || (!(github.event_name == 'issues')) && (!(github.event_name == 'issue_comment')) || github.event_name == 'issues' && github.event.label.name == 'ci:reproduce')"
