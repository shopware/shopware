name: sw-impact

on:
  pull_request:
    types:
      - opened
      - labeled
      - ready_for_review
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: sw-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: sw-impact
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'sw-impact') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'sw-impact'))
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 15
    env:
      SW_IMPACT_ARCHIVE_URL: https://github.com/shopware/sw-impact/releases/download/v0.1.0/sw-impact-x86_64-unknown-linux-gnu.tar.gz
      SW_IMPACT_ARCHIVE: ${{ runner.temp }}/sw-impact-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
      SW_IMPACT_BIN_DIR: ${{ runner.temp }}/sw-impact-bin-${{ github.run_id }}-${{ github.run_attempt }}
      SW_IMPACT_INDEX: ${{ runner.temp }}/sw-impact-index-${{ github.run_id }}-${{ github.run_attempt }}.json

    steps:
      - name: Install sw-impact
        run: |
          mkdir -p "$SW_IMPACT_BIN_DIR"
          curl --fail --location --show-error --silent "$SW_IMPACT_ARCHIVE_URL" --output "$SW_IMPACT_ARCHIVE"
          tar -xzf "$SW_IMPACT_ARCHIVE" -C "$SW_IMPACT_BIN_DIR"

          sw_impact_bin="$(find "$SW_IMPACT_BIN_DIR" -type f -name sw-impact -perm /111 -print -quit)"
          if [ -z "$sw_impact_bin" ]; then
            sw_impact_bin="$(find "$SW_IMPACT_BIN_DIR" -type f -name sw-impact -print -quit)"
          fi
          if [ -z "$sw_impact_bin" ]; then
            echo "sw-impact binary not found in archive" >&2
            find "$SW_IMPACT_BIN_DIR" -maxdepth 3 -type f >&2
            exit 1
          fi

          chmod +x "$sw_impact_bin"
          if [ "$sw_impact_bin" != "$SW_IMPACT_BIN_DIR/sw-impact" ]; then
            ln -sf "$sw_impact_bin" "$SW_IMPACT_BIN_DIR/sw-impact"
          fi
          echo "$SW_IMPACT_BIN_DIR" >> "$GITHUB_PATH"

      - name: Checkout base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Build base index
        run: sw-impact index . --index "$SW_IMPACT_INDEX"

      - name: Checkout pull request changes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check impact
        run: sw-impact check . --index "$SW_IMPACT_INDEX"
