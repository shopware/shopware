name: Screenshot Action Tests

# Unit tests, type check and shell-step tests for .github/actions/sw-screenshot.
#
# The toolchain runs unattended inside an agent run, where a defect surfaces as a confusing comment
# rather than a red check — so the parts that can be tested without a shop are tested here.

on:
  pull_request:
    paths:
      - .github/actions/sw-screenshot/**
      - .github/workflows/sw-screenshot-action-tests.yml
  push:
    branches: [trunk]
    paths:
      - .github/actions/sw-screenshot/**
      - .github/workflows/sw-screenshot-action-tests.yml

permissions:
  contents: read

concurrency:
  group: sw-screenshot-action-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/actions/sw-screenshot
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: node --experimental-strip-types --test tests/*.test.ts

      - name: Shell step tests
        run: bash tests/bash/run.sh

      - name: Shell syntax check
        run: |
          set -euo pipefail
          for script in steps/*.sh tests/bash/*.sh; do
            bash -n "$script"
          done
