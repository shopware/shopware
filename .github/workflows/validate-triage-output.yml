name: Triage Output Validation

# Post-run defense-in-depth gate for the `triage` workflow. Downloads the
# safe-output staging artifact, validates the `triage-output.json` payload
# against the TriageOutput shape, and scans for accidental or prompt-injection-
# induced secret leakage (GitHub tokens, Anthropic keys, long base64 blocks).
#
# Triggers on every completion of the triage workflow — pass means no violation,
# fail surfaces in the GitHub UI as a red check on the triage run. The staging
# artifact itself is left in place (deleting would need actions:write); the
# failure is the signal.
#
# Validator is `.github/bin/js/validate-triage-output.mjs`, pure node, no deps.

on:
  workflow_run:
    workflows: ["Shopware Issue Triage"]
    types: [completed]

permissions:
  actions: read       # list + download artifacts of the triggering run
  contents: read      # checkout the validator script

concurrency:
  group: validate-triage-output-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout validator only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/bin/js
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Download triage staging artifact
        id: download
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              },
            );
            const match = artifacts.find(a => a.name === 'safe-outputs-upload-artifacts');
            if (!match) {
              core.notice('No safe-outputs-upload-artifacts found on the triage run — nothing to validate.');
              core.setOutput('found', 'false');
              return;
            }
            const dl = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: 'zip',
            });
            fs.writeFileSync('artifact.zip', Buffer.from(dl.data));
            core.setOutput('found', 'true');

      - name: Unpack staging artifact
        if: steps.download.outputs.found == 'true'
        run: |
          mkdir -p artifact
          unzip -o artifact.zip -d artifact/
          echo "::group::Artifact contents"
          find artifact -type f
          echo "::endgroup::"

      - name: Locate triage-output.json
        if: steps.download.outputs.found == 'true'
        id: locate
        run: |
          set -o pipefail
          file=$(find artifact -type f -name 'triage-output.json' -print -quit)
          if [ -z "$file" ]; then
            echo "No triage-output.json inside staging — agent may have emitted no upload."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found at: $file"
            {
              echo "file=$file"
              echo "found=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Validate
        if: steps.locate.outputs.found == 'true'
        run: node .github/bin/js/validate-triage-output.mjs "${{ steps.locate.outputs.file }}"
