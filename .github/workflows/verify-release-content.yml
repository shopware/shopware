name: Verify release content
# The verdict is delivered through the `release-content/verify` commit status on
# the release branch head, not through the job result — block on that status,
# the job stays green by design (same pattern as release-info-check.yml).
# A red job here means the verification itself could not run (operational
# error), so pipeline monitoring only surfaces real CI problems.

on:
  push:
    branches:
      - '[0-9]+.[0-9]+.[0-9]+.x'
  workflow_dispatch:
    inputs:
      version_prefix:
        description: 'Version prefix to verify (e.g. 6.7.11). Derived from branch name when omitted.'
        required: false

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Verify release content
    runs-on: ubuntu-24.04
    if: github.repository == 'shopware/shopware'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"

      - name: Derive version prefix
        id: version
        run: |
          if [[ -n "${{ inputs.version_prefix }}" ]]; then
            echo "prefix=${{ inputs.version_prefix }}" >> "$GITHUB_OUTPUT"
          else
            # 6.7.11.x → 6.7.11
            echo "prefix=${GITHUB_REF_NAME%.x}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch trunk and release branch
        # The script compares origin/trunk against origin/<prefix>.x, so both refs must be present.
        run: git fetch origin trunk "${{ steps.version.outputs.prefix }}.x"

      - name: Verify release content
        id: verify
        # Exit code 2 (entries missing) is a verification verdict, delivered via
        # the commit status below — it must not fail the job. Every other
        # non-zero exit is an operational error and has to stay a job failure.
        run: |
          set -euo pipefail
          code=0
          php .github/bin/verify-release-content.php "${{ steps.version.outputs.prefix }}" || code=$?
          if [[ "$code" -ne 0 && "$code" -ne 2 ]]; then
            exit "$code"
          fi

      - name: Report verdict as commit status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # Written by verify-release-content.php via GITHUB_OUTPUT. An empty
          # state means the script skipped its verdict — createCommitStatus then
          # rejects the call and fails this job, which is the guard we want.
          STATE: ${{ steps.verify.outputs.state }}
          DESCRIPTION: ${{ steps.verify.outputs.description }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: process.env.STATE,
              context: 'release-content/verify',
              description: process.env.DESCRIPTION,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
