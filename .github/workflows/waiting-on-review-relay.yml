name: Waiting-on review relay

# A review on a fork's pull request runs with a read-only token and no OIDC, and there is no
# pull_request_review_target. This only records the pull request number for
# waiting-on-update.yml, which runs privileged via workflow_run; same pattern as
# codeowner-fork-review-relay.yml. A fork can change this file in its pull request, so the
# number is validated again on the other side.

on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  relay:
    name: Relay the pull request number
    if: github.repository == 'shopware/shopware'
    runs-on: ubuntu-24.04
    steps:
      - env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$NUMBER" > pr-number.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waiting-on-review-pr
          path: pr-number.txt
          retention-days: 1
