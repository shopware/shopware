<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopware administration</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon/favicon-32x32.png" id="dynamic-favicon">

    <script type="text/javascript">
        window._features_ = <%- featureFlags %>;

        window._pageLoadTime_ = Date.now()
    </script>

    <style>
        #page-loading-screen {
            width: 100%;
            height: 100%;
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            z-index: 400;
            background: var(--color-background-tertiary-default, #f2f3f8);
            background: color-mix(in oklab, var(--color-background-tertiary-default, #f2f3f8) 80%, white);
            opacity: 0;
            animation: 100ms loading-screen-appear 2s 1 forwards
        }

        #page-loading-screen.hidden {
            display: none;
        }

        #page-loading-screen .loading-indicator__elements div {
            position: absolute;
            width: 100%;
            height: 100%;
            border-width: 4px;
            border-style: solid;
            box-sizing: border-box;
            border-radius: 50%;
            border-color: var(--color-border-brand-default, #0870ff) transparent transparent transparent;
            animation: mt-loader-rotator 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        #page-loading-screen .loading-indicator__elements div:nth-child(1) {
            animation-delay: -0.45s;
        }

        #page-loading-screen .loading-indicator__elements div:nth-child(2) {
            animation-delay: -0.3s;
        }

        #page-loading-screen .loading-indicator__elements div:nth-child(3) {
            animation-delay: -0.15s;
        }

        #page-loading-screen .loading-indicator {
            width: 50px;
            height: 50px;
            display: grid;
            grid-auto-columns: auto;
            position: relative;
        }

        @keyframes mt-loader-rotator {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes loading-screen-appear {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- loading indicator when network is very slow and vue hasn't already loaded. The component has been copied from mt-loader -->
    <div id="page-loading-screen"> <!-- .mt-loader -->
        <div class="loading-indicator"> <!-- .mt-loader-container -->
            <div class="loading-indicator__elements"> <!-- .mt-loader-element -->
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        window.startApplication = () => Shopware.Application.start({
            appContext: {
                features: window._features_,
                firstRunWizard: false,
                systemCurrencyId: 'b7d2554b0ce847cd82f3ac9bd1c0dfca',
                systemCurrencyISOCode: 'EUR',
                adminEsEnable: false,
                storefrontEsEnable: false,
                productStreamIndexingEnabled: true,
            },
            apiContext: {
                host: 'localhost',
                basePath: '',
                pathInfo: '/',
                serviceRegistryUrl: '<%- serviceRegistryUrl %>',
            }
        });
    </script>
</body>
</html>
