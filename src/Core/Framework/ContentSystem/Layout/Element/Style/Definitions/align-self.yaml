type: string
default: "auto"
enum:
  - "auto"
  - "start"
  - "center"
  - "end"
  - "stretch"
  - "baseline"
adminUI:
  component: "radio-panel"
  label: "Align Self"
  description: "Cross-axis alignment of the element within its parent."
  props:
    options:
      - value: "auto"
        label: "Auto"
        icon: "regular-circle"
      - value: "start"
        label: "Start"
        icon: "regular-align-left"
      - value: "center"
        label: "Center"
        icon: "regular-align-center"
      - value: "end"
        label: "End"
        icon: "regular-align-right"
      - value: "stretch"
        label: "Stretch"
        icon: "regular-align-justify"
      - value: "baseline"
        label: "Baseline"
        icon: "regular-underline"
