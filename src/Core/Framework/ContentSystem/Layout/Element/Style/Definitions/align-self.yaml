type: string
default: "auto"
enum:
  - "auto"
  - "start"
  - "center"
  - "end"
  - "stretch"
  - "baseline"
adminUI:
  component: "radio-panel"
  label: "Align Self"
  labelSnippet: "sw-experience-studio.styles.align-self.label"
  description: "Cross-axis alignment of the element within its parent."
  descriptionSnippet: "sw-experience-studio.styles.align-self.description"
  props:
    options:
      - value: "auto"
        label: "Auto"
        labelSnippet: "sw-experience-studio.styles.align-self.options.auto.label"
        icon: "regular-circle"
      - value: "start"
        label: "Start"
        labelSnippet: "sw-experience-studio.styles.align-self.options.start.label"
        icon: "regular-align-left"
      - value: "center"
        label: "Center"
        labelSnippet: "sw-experience-studio.styles.align-self.options.center.label"
        icon: "regular-align-center"
      - value: "end"
        label: "End"
        labelSnippet: "sw-experience-studio.styles.align-self.options.end.label"
        icon: "regular-align-right"
      - value: "stretch"
        label: "Stretch"
        labelSnippet: "sw-experience-studio.styles.align-self.options.stretch.label"
        icon: "regular-align-justify"
      - value: "baseline"
        label: "Baseline"
        labelSnippet: "sw-experience-studio.styles.align-self.options.baseline.label"
        icon: "regular-underline"
