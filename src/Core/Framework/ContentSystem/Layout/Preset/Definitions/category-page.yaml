name: "Category page - with sidebar"
nameSnippet: "sw-experience-studio.presets.category-page.name"
description: "Category page with product listing and filters in a sidebar with additional navigation."
descriptionSnippet: "sw-experience-studio.presets.category-page.description"
icon: "regular-boxes"
illustration: "preset-category-page"
category: "commerce"
priority: 200
layout:
  - component: Sw:Grid:Container
    properties:
      mode: explicit
      columns: 1
    slots:
      content:
        - component: Sw:Navigation:Breadcrumb
        - component: Sw:Content:Text
          properties:
            text: "<h1>{{map:category.name}}</h1>"
  - component: Sw:Grid:Container
    properties:
      mode: explicit
      columns: 4
      justify: stretch
    slots:
      content:
        - component: Sw:Grid:Container
          properties:
            mode: explicit
            columns: 1
            alignContent: start
            margin:
              xs: "0"
              sm: "0"
              md: "0"
              lg: "0"
              xl: "0"
              xxl: "0"
          style:
            col-span:
              xs: 4
              sm: 4
              md: 4
              lg: 1
              xl: 1
              xxl: 1
          slots:
            content:
              - component: Sw:Navigation:Tree
                properties:
                  displayType: collapse
                style:
                  display:
                    xs: false
                    sm: false
                    md: false
                    lg: true
                    xl: true
                    xxl: true
              - component: Sw:Filter:Panel
                properties:
                  displayType: vertical
        - component: Sw:Product:Listing
          style:
            col-span:
              xs: 4
              sm: 4
              md: 4
              lg: 3
              xl: 3
              xxl: 3
