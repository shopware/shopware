name: "Category page"
nameSnippet: "sw-experience-studio.presets.category-page.name"
description: "Collection of components that make up the category page."
descriptionSnippet: "sw-experience-studio.presets.category-page.description"
icon: "regular-boxes"
illustration: "preset-category-page"
category: "commerce"
priority: 200
layout:
  - component: Sw:Grid:Container
    properties:
      gridLayout:
        lg:
          columns: [{ type: px, value: 300 }, { type: auto }]
          areas: [[a1, a2]]
        sm:
          columns: [{ type: auto }]
          areas: [[a1]]
        md:
          columns: [{ type: auto }]
          areas: [[a1]]
      justify: stretch
    slots:
      content:
        - component: Sw:Navigation:Tree
          style:
            display:
              xs: false
              sm: false
              md: false
              lg: true
              xl: true
              xxl: true
        - component: Sw:Product:Listing
          slots:
            filters-panel:
              - component: Sw:Filter:Panel
