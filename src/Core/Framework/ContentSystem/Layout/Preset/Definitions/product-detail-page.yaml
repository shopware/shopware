name: "Product detail page"
description: "Collection of components that make up the product detail page."
icon: "regular-box-alt"
layout:
  - component: Sw:Grid:Container
    slots:
      content:
        - component: Sw:Navigation:Breadcrumb
  - component: Sw:Grid:Container
    properties:
      mode: explicit
      columns: 12
      rows: 1
    slots:
      content:
        - component: Sw:Content:Text
          properties:
            text: "<h1>{{map:product.name}}</h1>"
          style:
            col-span:
              xs: 10
              sm: 10
              md: 10
              lg: 10
              xl: 10
              xxl: 10
        - component: Sw:Product:Manufacturer
          style:
            col-span:
              xs: 2
              sm: 2
              md: 2
              lg: 2
              xl: 2
              xxl: 2
            justify-self:
              xs: end
              sm: end
              md: end
              lg: end
              xl: end
              xxl: end
            align-self:
              xs: center
              sm: center
              md: center
              lg: center
              xl: center
              xxl: center
  - component: Sw:Grid:Container
    properties:
      align: start
    slots:
      content:
        - component: Sw:Media:Gallery
        - component: Sw:Grid:Container
          properties:
            gap: 10
            align: start
            justify: start
            justifyContent: start
          slots:
            content:
              - component: Sw:Product:PriceDisplay
                properties:
                  large: true
              - component: Sw:Product:ReviewIndicator
              - component: Sw:Product:Delivery
              - component: Sw:Product:VariantSelection
              - component: Sw:Grid:Container
                properties:
                  mode: explicit
                  columns: 3
                  rows: 1
                  gap: 16
                  align: start
                  margin:
                    xs: "0 0 16px 0"
                    sm: "0 0 16px 0"
                    md: "0 0 16px 0"
                    lg: "0 0 16px 0"
                    xl: "0 0 16px 0"
                    xxl: "0 0 16px 0"
                slots:
                  content:
                    - component: Sw:Product:QuantitySelector
                    - component: Sw:Product:BuyButton
                      style:
                        col-span:
                          xs: 2
                          sm: 2
                          md: 2
                          lg: 2
                          xl: 2
                          xxl: 2
              - component: Sw:Content:Text
                properties:
                  text: "<p><b>Product number:</b> {{map:product.productNumber}}</p>"
  - component: Sw:Grid:Container
    slots:
      content:
        - component: Sw:Tabs:Panel
          properties:
            variant: underline
          slots:
            tabs:
              - component: Sw:Tabs:Tab
                properties:
                  title: "Description"
                slots:
                  content:
                    - component: Sw:Content:Text
                      properties:
                        text: "<h2>Product information \"{{map:product.name}}\"</h2><p>{{map:product.description}}</p><p></p>"
                    - component: Sw:Product:Properties
              - component: Sw:Tabs:Tab
                properties:
                  title: "Reviews"
                slots:
                  content:
                    - component: Sw:Grid:Container
                      properties:
                        mode: explicit
                        columns: 3
                        rows: 1
                        justify: stretch
                      slots:
                        content:
                          - component: Sw:Product:ReviewFilters
                            style:
                              col-span:
                                xs: 3
                                sm: 3
                                md: 3
                                lg: 3
                                xl: 3
                                xxl: 3
                          - component: Sw:Product:ReviewSummary
                            style:
                              row-span:
                                xs: 1
                                sm: 1
                                md: 1
                                lg: 2
                                xl: 2
                                xxl: 2
                          - component: Sw:Product:Reviews
                            style:
                              col-span:
                                xs: 3
                                sm: 3
                                md: 3
                                lg: 2
                                xl: 2
                                xxl: 2
                          - component: Sw:Product:ReviewForm
                            style:
                              col-span:
                                xs: 3
                                sm: 3
                                md: 3
                                lg: 2
                                xl: 2
                                xxl: 2
