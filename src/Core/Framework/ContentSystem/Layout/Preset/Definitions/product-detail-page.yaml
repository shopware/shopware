name: "Product detail page"
nameSnippet: "sw-experience-studio.presets.product-detail-page.name"
description: "Collection of components that make up the product detail page."
descriptionSnippet: "sw-experience-studio.presets.product-detail-page.description"
icon: "regular-box-alt"
illustration: "preset-product-detail-page"
category: "commerce"
priority: 300
layout:
  - component: Sw:Grid:Container
    slots:
      content:
        - component: Sw:Navigation:Breadcrumb
  - component: Sw:Grid:Container
    properties:
      gridLayout:
        lg:
          columns: [{ type: fraction, value: 10 }, { type: fraction, value: 2 }]
          areas: [[a1, a2]]
        sm:
          columns: [{ type: auto }]
          areas: [[a1]]
    slots:
      content:
        - component: Sw:Content:Text
          properties:
            text: "<h1>{{map:product.name}}</h1>"
        - component: Sw:Product:Manufacturer
          style:
            justify-self:
              xs: end
              sm: end
              md: end
              lg: end
              xl: end
              xxl: end
            align-self:
              xs: center
              sm: center
              md: center
              lg: center
              xl: center
              xxl: center
  - component: Sw:Grid:Container
    properties:
      align: start
      gridLayout:
        lg:
          columns: [{ type: auto }, { type: auto }]
          areas: [[a1, a2]]
        sm:
          columns: [{ type: auto }]
          areas: [[a1]]
        md:
          columns: [{ type: auto }]
          areas: [[a1]]
    slots:
      content:
        - component: Sw:Media:Gallery
          acceptsContext:
            mediaItems:
              type: collection
              required: false
              scope: root
              source:
                type: root
                id: product
                path: media
        - preset: Sw:BuyBox
  - component: Sw:Grid:Container
    slots:
      content:
        - component: Sw:Tabs:Panel
          properties:
            variant: underline
          slots:
            tabs:
              - component: Sw:Tabs:Tab
                properties:
                  title: "Description"
                slots:
                  content:
                    - component: Sw:Content:Text
                      properties:
                        text: "<h2>Product information \"{{map:product.name}}\"</h2><p>{{map:product.description}}</p><p></p>"
                    - component: Sw:Product:Properties
              - component: Sw:Tabs:Tab
                properties:
                  title: "Reviews"
                slots:
                  content:
                    - preset: Sw:ProductReviews
  - component: Sw:Grid:Container
    slots:
      content:
        - component: Sw:Product:CrossSelling
