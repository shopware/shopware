name: "Product detail page"
description: "Collection of components that make up the product detail page."
icon: "regular-box-alt"
illustration: "preset-product-detail-page"
category: "commerce"
priority: 300
layout:
  - component: Sw:Grid:Container
    slots:
      content:
        - component: Sw:Media:Gallery
          acceptsContext:
            mediaItems:
              type: collection
              required: false
              scope: root
              source:
                type: root
                id: product
                path: media
        - component: Sw:Content:Text
          properties:
            text: "<p>{{map:product.description}}</p>"
        - component: Sw:Product:PriceDisplay
  - preset: Sw:ProductReviews
