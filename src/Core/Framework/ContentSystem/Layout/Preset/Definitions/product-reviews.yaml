name: "Product reviews"
nameSnippet: "sw-experience-studio.presets.product-reviews.name"
description: "Rating summary, review list, sort and language filters and the submission form for a product, arranged in a grid."
descriptionSnippet: "sw-experience-studio.presets.product-reviews.description"
icon: "regular-star"
illustration: "preset-product-reviews"
category: "commerce"
priority: 100
layout:
  - component: Sw:Grid:Container
    properties:
      gridLayout:
        lg:
          columns: [{ type: px, value: 300 }, { type: auto }]
          areas: [[a1, a1], [a2, a3], [a2, a4]]
        sm:
          columns: [{ type: auto }]
          areas: [[a1]]
        md:
          columns: [{ type: auto }]
          areas: [[a1]]
      justify: stretch
    slots:
      content:
        - component: Sw:Product:ReviewFilters
        - component: Sw:Product:ReviewSummary
        - component: Sw:Product:Reviews
        - component: Sw:Product:ReviewForm
