meta:
  label: "Filter Panel"
  description: "Product listing filter panel."
  icon: "regular-filter-s"
  category: "commerce"
  copilot:
    summary: "Listing filter panel."
    hints:
      - "The listing is loaded per request from the page's category, no configuration needed."
      - "Place it anywhere on a category layout. It does not have to sit inside the product listing."
      - "Sorting and the layout switch belong to the Product Listing element, not here."
      - "Turning a filter off hides its control. A link already carrying that filter still narrows the listing, so shared URLs keep working."
      - "Use additional filter slots to extend built-in filters."

properties:
  productListing:
    type: Shopware\Core\Content\Product\SalesChannel\Listing\ProductListingResult
    required: true
    title: "Product Listing"
    description: "Hydrated listing result. The panel reads its aggregations to build the filters."
    resolvedBy:
      product_listing: {}

  navigationId:
    type: string
    title: "Navigation ID"
    description: "Category id the product_listing loader loads from. Resolved per request from the layout's category root, so it needs no editorial input."
    default: "{{categoryId}}"
    adminUI:
      helpText: "Filled automatically from the page you are on, so leave this as it is."

  displayType:
    type: string
    title: "Display Type"
    description: "How the filters are arranged. `inline` lays them out as a row of buttons opening floating menus; `stacked` gives each its own full-width row that expands in place."
    default: "inline"
    enum:
      - "inline"
      - "stacked"
    adminUI:
      component: "select"
      panel: "filter"
      helpText: "Use stacked when the panel sits in a narrow column, so the filters sit one below another and expand in place instead of opening floating menus."

  visibleFilterCount:
    type: integer
    title: "Visible Filter Count"
    description: "Number of visible filters before collapsing into 'more'."
    default: 3
    adminUI:
      component: "number"
      panel: "filter"

  showPriceFilter:
    type: boolean
    title: "Filter by Price"
    description: "Whether the price range filter is offered."
    default: true
    adminUI:
      panel: "filter"

  showRatingFilter:
    type: boolean
    title: "Filter by Rating"
    description: "Whether the minimum rating filter is offered."
    default: true
    adminUI:
      panel: "filter"

  showManufacturerFilter:
    type: boolean
    title: "Filter by Manufacturer"
    description: "Whether the manufacturer filter is offered."
    default: true
    adminUI:
      panel: "filter"

  showShippingFreeFilter:
    type: boolean
    title: "Filter for Free Shipping"
    description: "Whether the free shipping filter is offered."
    default: true
    adminUI:
      panel: "filter"

  showPropertyFilter:
    type: boolean
    title: "Filter by Properties"
    description: "Whether the property group filters are offered."
    default: true
    adminUI:
      panel: "filter"

  propertyWhitelist:
    type: string
    title: "Filterable Properties"
    description: "Comma-separated property_group ids the property filters are restricted to. Empty offers every filterable group of the matching products."
    required: false
    adminUI:
      component: "entity-multi-id-select"
      entity: "property_group"
      panel: "filter"
      helpText: "Restrict the property filters to the groups that matter on this page, for example only colour and size."
      visibleWhen:
        field: "showPropertyFilter"
        equals: true

slots:
  - name: additional-filters-start
    description: "Container slot for custom filters rendered before the built-in filters."
  - name: additional-filters-end
    description: "Container slot for custom filters rendered after the built-in filters."
