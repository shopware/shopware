meta:
  label: "Image Grid"
  description: "Two-column media grid showing all images at once, with the first image spanning the full width."
  icon: "regular-view-grid"
  category: "content"
  copilot:
    summary: "Media grid element."
    hints:
      - "Requires one or more media entities."
      - "Alternative to the gallery without slider navigation."

properties:
  mediaItems:
    type: Shopware\Core\Content\Media\MediaCollection
    required: true
    title: "Media"
    description: "The images to be shown in the grid."
    resolvedBy: mediaIds
    adminUI:
      component: "media-collection"
      panel: "general"

  columns:
    type: integer
    title: "Columns"
    description: "Amount of grid columns. The first image always spans all columns."
    default: 2
    enum: [2, 3, 4]
    adminUI:
      component: "select"
      panel: "general"

  featuredColumns:
    type: integer
    title: "Featured Image Columns"
    description: "Amount of columns and rows the first image spans. A value equal to or above the column count spans the full width."
    default: 4
    enum: [1, 2, 3, 4]
    adminUI:
      component: "select"
      panel: "general"

  showFullScreenGallery:
    type: boolean
    title: "Show Fullscreen Gallery"
    description: "Show the fullscreen gallery when clicking on the images."
    default: true
    adminUI:
      panel: "behaviour"

  thumbnailSize:
    type: integer
    title: "Thumbnail Size"
    description: "Size of the thumbnail navigation images in the fullscreen gallery in px."
    default: 70
    adminUI:
      component: "number"
      panel: "behaviour"
      visibleWhen:
        field: "showFullScreenGallery"
        equals: true

  thumbnailNavigationPosition:
    type: string
    title: "Thumbnail Position"
    description: "Position of the thumbnail navigation in the fullscreen gallery."
    default: "left"
    enum:
      - "left"
      - "bottom"
    adminUI:
      component: "select"
      panel: "behaviour"
      visibleWhen:
        field: "showFullScreenGallery"
        equals: true
