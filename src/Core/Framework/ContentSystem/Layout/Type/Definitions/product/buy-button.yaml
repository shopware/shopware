meta:
  label: "Product Buy Button"
  labelSnippet: "sw-experience-studio.elements.product-buy-button.label"
  description: "Adds the current product to the shopping cart and opens the off-canvas cart."
  icon: "regular-shopping-cart"
  illustration: "product-buy-button"
  category: "commerce"
  copilot:
    summary: "Add-to-cart button for the current product."
    hints:
      - "Use on a product detail page; the product is resolved from the current product-page context."
      - "Takes the quantity from a Quantity Selector on the page. Without one, the product's minimum purchase quantity is added."
      - "Renders nothing when the product cannot be bought, for example when it is unavailable or a parent product with variants."

properties:
  product:
    type: Shopware\Core\Content\Product\SalesChannel\SalesChannelProductEntity
    required: false
    title: "Product"
    titleSnippet: "sw-experience-studio.elements.product-buy-button.product.title"
    description: "Hydrated product that is added to the cart; resolved from the current product context. Optional because a product context may be unavailable, for example outside a product detail page. Without a buyable product, the component renders no buy button and shows a sold-out hint when the product is unavailable."
    resolvedBy: productId
    mappable: true
    defaultMapping:
      type: root
      id: product
    adminUI:
      component: "entity-single-select"
      entity: "product"
