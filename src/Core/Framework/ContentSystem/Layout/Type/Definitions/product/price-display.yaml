meta:
  label: "Product Price"
  labelSnippet: "sw-experience-studio.elements.product-price-display.label"
  description: "Displays a product's price — including list, regulation, reference and graduated (tiered) prices — on the product detail page."
  icon: "regular-tag"
  illustration: "product-price"
  category: "commerce"
  priority: 80
  copilot:
    summary: "Product detail page price element."
    hints:
      - "Place inside a product detail page layout; the product is resolved from the page automatically."

properties:
  product:
    type: Shopware\Core\Content\Product\SalesChannel\SalesChannelProductEntity
    required: false
    title: "Product"
    titleSnippet: "sw-experience-studio.elements.product-price-display.product.title"
    description: "Hydrated product whose price is shown."
    resolvedBy: productId
    mappable: true
    defaultMapping:
      type: root
      id: product
    adminUI:
      component: "entity-single-select"
      entity: "product"

  showTaxInfo:
    type: boolean
    title: "Show tax info"
    titleSnippet: "sw-experience-studio.elements.product-price-display.showTaxInfo.title"
    description: "Render the tax/shipping information link below the price."
    default: true
    adminUI:
      component: "switch"

  large:
    type: boolean
    title: "Large price"
    titleSnippet: "sw-experience-studio.elements.product-price-display.large.title"
    description: "Render the headline price at a larger size."
    default: false
    adminUI:
      component: "switch"

  showListPriceBadge:
    type: boolean
    title: "Show list price badge"
    titleSnippet: "sw-experience-studio.elements.product-price-display.showListPriceBadge.title"
    description: "Render the list price badge."
    default: true
    adminUI:
      component: "switch"