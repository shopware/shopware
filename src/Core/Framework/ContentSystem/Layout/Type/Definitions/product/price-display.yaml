meta:
  label: "Product Price"
  description: "Displays a product's price — including list, regulation, reference and graduated (tiered) prices — on the product detail page."
  icon: "regular-tag"
  category: "commerce"
  copilot:
    summary: "Product detail page price element."
    hints:
      - "Place inside a product detail page layout; the product is resolved from the page automatically."

properties:
  product:
    type: Shopware\Core\Content\Product\SalesChannel\SalesChannelProductEntity
    required: false
    title: "Product"
    description: "Hydrated product whose price is shown. Resolved by the product_detail loader from the id in productId."
    # The hydrated entity lands under this `product` key (the component's prop). The product_detail loader
    # reads the id from the separate `productId` property below — the generic entity loader can't, because
    # its id source doubles as a storage key that may not share a name with a declared property.
    resolvedBy:
      product_detail: {}

  productId:
    type: string
    title: "Product ID"
    description: "Product id of the current page. Resolved per request from the layout's product root, so it needs no editorial input."
    default: "{{productId}}"
    adminUI:
      helpText: "Filled automatically from the page you are on — leave this as it is."

  showTaxInfo:
    type: boolean
    title: "Show tax info"
    description: "Render the tax/shipping information link below the price."
    default: true
    adminUI:
      component: "switch"

  advancedPricing:
    type: boolean
    title: "Advanced pricing"
    description: "Render the graduated (tiered) price table for products with staggered prices. Enabled on the product detail page."
    default: true
    adminUI:
      component: "switch"

  jsonLd:
    type: boolean
    title: "JSON-LD structured data"
    description: "Emit schema.org (JSON-LD) structured pricing data for search engines. Enabled on the product detail page."
    default: true
    adminUI:
      component: "switch"
