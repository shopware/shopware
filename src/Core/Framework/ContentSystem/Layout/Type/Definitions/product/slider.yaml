meta:
  label: "Product Slider"
  description: "Displays a manually curated selection of products in a slider."
  icon: "regular-bulk-edit"
  category: "commerce"
  copilot:
    summary: "Product slider element with a manual product selection."
    hints:
      - "Select the products to be shown."
      - "Disable the navigation arrows to leave scrolling to the scrollbar and touch gestures."
      - "Use the fit item sizing to fill the available width with whole columns instead of a fixed card width."
      - "Use the natural scroll behaviour to let the slider stop between cards instead of snapping to them."
      - "Hide the scrollbar for a cleaner look; the slider stays scrollable via the arrows and touch gestures."

properties:
  products:
    type: Shopware\Core\Content\Product\SalesChannel\SalesChannelProductCollection
    required: true
    title: "Products"
    description: "The products shown in the slider. Required because without products the slider will show an empty state."
    resolvedBy: productIds
    adminUI:
      component: "entity-multi"
      entity: "product"

  title:
    type: string
    translatable: true
    title: "Title"
    description: "Optional headline shown above the slider."
    adminUI:
      component: "text"

  itemSizing:
    type: string
    title: "Item Sizing"
    description: "How the product cards are sized. Fixed keeps a fixed card width and lets the next card peek in at the edge, fit sizes the cards so a whole number of columns fills the available width."
    default: "fixed"
    enum:
      - "fixed"
      - "fit"
    adminUI:
      component: "select"
      helpText: "Fixed keeps a fixed product card width and allows overlapping cards. Fit sizes the cards so a whole number of columns fills the available width."

  scrollBehaviour:
    type: string
    title: "Scroll Behaviour"
    description: "How the slider behaves when scrolling. Snap always aligns the scroll position to the start of a product card, natural stops wherever the scrolling ends."
    default: "snap"
    enum:
      - "snap"
      - "natural"
    adminUI:
      component: "select"
      helpText: "Snap locks the slider to the start of a product card. Natural stops the slider wherever scrolling ends."

  showNavigationArrows:
    type: boolean
    title: "Show Navigation Arrows"
    description: "Show the arrow buttons to scroll the slider."
    default: true
    adminUI:
      component: "switch"

  showScrollbar:
    type: boolean
    title: "Show Scrollbar"
    description: "Show the horizontal scrollbar below the slider. The slider stays scrollable when the scrollbar is hidden."
    default: true
    adminUI:
      component: "switch"
