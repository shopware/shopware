meta:
  label: "Product Slider"
  description: "Displays a manually curated selection of products in a slider."
  icon: "regular-bulk-edit"
  category: "commerce"
  copilot:
    summary: "Product slider element with a manual product selection."
    hints:
      - "Select the products to be shown."

properties:
  products:
    type: Shopware\Core\Content\Product\SalesChannel\SalesChannelProductCollection
    required: true
    title: "Products"
    description: "The products shown in the slider."
    resolvedBy: productIds
    adminUI:
      component: "sw-entity-multi-id-select"
      entity: "product"
      
  title:
    type: string
    translatable: true
    title: "Title"
    description: "Optional headline shown above the slider."
    adminUI:
      component: "text"    
