framework:
    session:
        name: 'session-'
        handler_id: ~
        cookie_secure: 'auto'
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
    default_locale:  en_GB
    http_method_override: true
    # HTML forms submit GET or POST; retain overrides for PUT, PATCH and DELETE form actions.
    allowed_http_method_override: ['PUT', 'PATCH', 'DELETE']
    router:
        utf8: true
    php_errors:
        log: true

twig:
    debug: '%kernel.debug%'
    strict_variables: false
