shopware:
    telemetry:
        metrics:
            # Transports prepend this namespace to every metric name on the wire, e.g.
            # `shopware.platform.http.server.request.duration` (OpenTelemetry) or
            # `shopware_platform_http_server_request_duration` (Prometheus). Do not change the default so metric
            # naming is uniform through installations and dashboards/alerts can be copied with minimal adjustment.
            namespace: 'shopware.platform'

            # Named mapping tables (key → label value) used by the label resolvers to bucket open
            # identifier sets (entity names, route names, event names, ...) into bounded set of label values.
            # A key is exact, or a prefix when it ends with `*`; exact beats prefix, the longest prefix wins.
            # Resolution priority: configuration mapping → the resolver's internal rule → `other`. Plugins and
            # projects add or override entries via config merge (a later source overrides the same key);
            # extension-defined mapping names carry a vendor prefix, bare names are reserved for core.
            # All keys of one mapping come from a single identifier space — see the serving resolver.
            mappings:
                # DAL entity name (snake_case) → entity group (EntityGroupResolver; also serves the admin-CRUD
                # branch of the http `domain` label). One exact + one `_`-prefix entry per entity-name root
                # token, exact entries where the root is misleading. Third-party entities (vendor prefix,
                # custom_entity_*/ce_*) fall to `other` unless the extension opts in.
                entity_group:
                    # roots that would mislead, mapped exactly
                    main_category: category
                    'property_group*': product     # product catalog attributes; `property*` alone is too generic
                    custom_entity: system          # the registry entity itself; custom_entity_*/ce_* data stays `other`
                    'custom_field*': system

                    # basic domains
                    product: product
                    'product_*': product
                    category: category
                    'category_*': category
                    customer: customer
                    'customer_*': customer
                    newsletter: customer
                    'newsletter_*': customer
                    order: order
                    'order_*': order
                    media: media
                    'media_*': media
                    cms: cms
                    'cms_*': cms
                    rule: rule
                    'rule_*': rule
                    b2b: b2b
                    'b2b_*': b2b

                    # content
                    landing: content
                    'landing_*': content
                    mail: content
                    'mail_*': content

                    # platform configuration & infrastructure
                    acl: system
                    'acl_*': system
                    app: system
                    'app_*': system
                    country: system
                    'country_*': system
                    currency: system
                    'currency_*': system
                    language: system
                    'language_*': system
                    locale: system
                    'locale_*': system
                    salutation: system
                    'salutation_*': system
                    tax: system
                    'tax_*': system
                    unit: system
                    'unit_*': system
                    delivery: system
                    'delivery_*': system          # delivery_time*
                    payment: system
                    'payment_*': system           # payment_method*
                    shipping: system
                    'shipping_*': system          # shipping_method*
                    sales: system
                    'sales_*': system             # sales_channel*
                    plugin: system
                    'plugin_*': system
                    integration: system
                    'integration_*': system
                    system: system
                    'system_*': system            # system_config
                    user: system
                    'user_*': system
                    scheduled: system
                    'scheduled_*': system         # scheduled_task
                    number: system
                    'number_*': system            # number_range*
                    state: system
                    'state_*': system             # state_machine*
                    seo: system
                    'seo_*': system               # seo_url*
                    import: system
                    'import_*': system            # import_export*
                    flow: system
                    'flow_*': system
                    webhook: system
                    'webhook_*': system
                    snippet: system
                    'snippet_*': system
                    theme: system
                    'theme_*': system
                    log: system
                    'log_*': system               # log_entry
                    notification: system
                    'notification_*': system
                    tag: system
                    'tag_*': system

                # storefront / store-api route name → functional domain (DomainResolver). More specific
                # prefixes defined with longer keys, so the longest-prefix rule keeps e.g. auth before the
                # `frontend.account*` customer catch-all.
                route_domain:
                    # product
                    'frontend.detail*': product
                    'frontend.product*': product
                    'store-api.product*': product

                    # category / navigation
                    'frontend.navigation*': category
                    'store-api.navigation*': category
                    'store-api.category*': category

                    # content (home + cms + landing pages)
                    'frontend.home*': content
                    'frontend.cms*': content
                    'frontend.landing*': content
                    'store-api.cms*': content
                    'store-api.landing-page*': content

                    # search
                    'frontend.search*': search
                    'store-api.search*': search

                    # cart (longer than the checkout catch-all)
                    'frontend.cart*': cart
                    'frontend.checkout.cart*': cart
                    'frontend.checkout.line-item*': cart
                    'store-api.checkout.cart*': cart

                    # checkout
                    'frontend.checkout*': checkout
                    'store-api.checkout*': checkout

                    # auth (longer than the account/customer catch-all)
                    'frontend.account.login*': auth
                    'frontend.account.logout*': auth
                    'frontend.account.register*': auth
                    'frontend.account.recover*': auth
                    'store-api.account.login*': auth
                    'store-api.account.logout*': auth
                    'store-api.account.register*': auth
                    'store-api.account.recover*': auth

                    # order (longer than the account/customer catch-all)
                    'frontend.account.order*': order
                    'frontend.account.edit-order*': order
                    'store-api.order*': order

                    # customer (account catch-all + wishlist)
                    'frontend.account*': customer
                    'frontend.wishlist*': customer
                    'store-api.account*': customer

                    # media
                    'frontend.media*': media
                    'store-api.media*': media

                # first segment after `api.action.` → action domain (DomainResolver; `api.action.sync` is
                # excluded, it has its own area).
                action_domain:
                    cache: cache
                    index: indexing
                    indexing: indexing
                    import-export: import-export
                    document: document
                    media: media
                    order: order
                    promotion: promotion
                    system-config: core
                    user: user
                    scheduled-task: scheduled-task
                    number-range: number-range
                    store: store

                # messenger message class FQCN → message group (MessageGroupResolver). Core grouping is
                # done in the resolver (is_a checks and namespace-fragment containment, which prefix
                # keys cannot express); extensions opt in with FQCN prefix entries. Keys with backslashes
                # must be single-quoted, e.g. 'Swag\Blog\Message\*': blog
                message_group: {  }

                # flow trigger event name → trigger group (TriggerGroupResolver).
                flow_trigger_group:
                    'state_enter.*': state-change
                    'state_leave.*': state-change
                    'checkout.order.*': order
                    'checkout.customer.*': customer
                    'customer.*': customer
                    'checkout.*': checkout
                    'app.*': app
                    'newsletter.*': content
                    'contact_form.*': content
                    'review_form.*': content
                    'revocation_request.*': content

                # triggering business event name → mail group (MailGroupResolver). The
                # `state_{enter|leave}.{state_machine}.{state}` family is grouped by code in the
                # resolver (the key there is the state machine, a different identifier space).
                mail_group:
                    checkout.order.placed: order_confirmation
                    checkout.order.payment_method.changed: payment_state_change

                    checkout.customer.register: customer_registration
                    checkout.customer.guest_register: customer_registration
                    checkout.customer.double_opt_in_registration: customer_registration
                    checkout.customer.double_opt_in_guest_order: customer_registration
                    customer.group.registration.accepted: customer_registration
                    customer.group.registration.declined: customer_registration

                    customer.recovery.request: customer_recovery
                    user.recovery.request: customer_recovery

                    contact_form.send: contact_form
                    review_form.send: contact_form

                    'newsletter.*': newsletter

                # number range technical name → group (NumberRangeTypeResolver). Core types are defined in
                # the basic-data migration; the document types share one group, each is its own low-volume
                # number_range_state row.
                number_range_type:
                    order: order
                    customer: customer
                    product: product
                    document_invoice: document
                    document_delivery_note: document
                    document_credit_note: document
                    document_storno: document

                # sales channel type id → type label (SalesChannelTypeResolver). Keys are the
                # Shopware\Core\Defaults::SALES_CHANNEL_TYPE_* ids.
                sales_channel_type:
                    8a243080f92e4c719546314b577cf82b: storefront        # SALES_CHANNEL_TYPE_STOREFRONT
                    f183ee5650cf4bdb8a774337575067a6: api               # SALES_CHANNEL_TYPE_API
                    ed535e5722134ac1aa6524f73e26881b: product_comparison # SALES_CHANNEL_TYPE_PRODUCT_COMPARISON
                    5e29f9890c4d4d519a1c7f9d5c24b7c1: agentic_commerce  # SALES_CHANNEL_TYPE_AGENTIC_COMMERCE

                # scheduled-task technical name, passed through (TaskNameResolver keeps the core task names
                # as its code-level pass-through rule). Plugins opt in with identity entries
                # (swag_blog.cleanup: swag_blog.cleanup); operators fold any task or vendor into a group or
                # `other` per key or prefix ('swag_paypal_*': other).
                task_name: {  }

            definitions:
                plugin.install.count:
                    description: 'Number of plugin installations'
                    type: 'counter'

                app.install.count:
                    description: 'Number of app installations'
                    type: 'counter'

                cache.invalidate.count:
                    description: 'Number of cache invalidations'
                    type: 'counter'

                messenger.message.size:
                  description: 'Size of the message in bytes'
                  enabled: true
                  type: 'histogram'
                  unit: 'byte'
                  parameters:
                    buckets: [0, 512, 1024, 2048, 4096, 8192, 16384, 32768]

                scheduled_task.backlog.max_lateness_seconds:
                    # scheduler stalled or backed up; sampled by the telemetry.collect_periodic_metrics task
                    description: 'Max seconds a scheduled task is past its next execution time'
                    type: 'gauge'
                    unit: 's'

                scheduled_task.failed.count:
                    # tasks in the 'failed' state never rerun on their own; sampled by the telemetry.collect_periodic_metrics task
                    description: 'Scheduled tasks in the terminal failed state'
                    type: 'gauge'

                messenger.message.handled.count:
                    description: 'Messages handled by the worker, per outcome'
                    type: 'counter'
                    labels:
                        # known core groups: indexer, webhook, scheduled-task, mail, business, system, other
                        message_group:
                            policy: open # bounded by the message_group mapping
                        result:
                            allowed_values: [handled, retried, failed]

                messenger.message.handling.duration:
                    # recorded for every outcome; the result label separates success latency from failure latency,
                    # so slow failures (e.g. external-call timeouts eating worker slots) stay visible
                    # instead of being averaged into the healthy path
                    description: 'Time from message received to a terminal outcome (handled/failed)'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        # low-ms cache/webhook messages up to multi-second indexing/import jobs
                        buckets: [1, 10, 50, 100, 500, 1000, 5000, 30000]
                    labels:
                        message_group:
                            policy: open # bounded by the message_group mapping
                        result:
                            allowed_values: [handled, retried, failed]

                messenger.queue.depth:
                    # sampled periodically by the telemetry.collect_periodic_metrics task; transport=failed is the
                    # dead-letter queue depth. Only transports that implement MessageCountAwareInterface are reported.
                    description: 'Pending messages per transport'
                    type: 'gauge'
                    labels:
                        # transport config name, passed through unmapped (known core: async, low_priority, failed; custom transports reported as-is)
                        # values are naturally bound by transports configuration
                        transport:
                            policy: open

                scheduled_task.run.duration:
                    # per-task-name performance signal, kept separate from overall messenger noise;
                    # only terminal outcomes are recorded (retried attempts are covered by the messenger metrics)
                    description: 'Scheduled task execution duration (worker received to handled/failed), per task/outcome'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        # sub-second cache invalidation up to long sitemap/product-export generation
                        buckets: [10, 100, 1000, 10000, 60000, 300000, 600000]
                    labels:
                        # core task names pass through, plugin tasks fold to `other` unless they opt in
                        task_name:
                            policy: open # bounded by the task_name mapping
                        result:
                            allowed_values: [success, failed]

                dal.associations.count:
                    description: 'Number of associations loaded'
                    type: 'histogram'

                indexer.run.duration:
                    # the result label keeps failed-run latency out of the healthy distribution.
                    description: 'Duration of a single entity indexer run (EntityIndexer::handle), per indexer/mode/outcome. Full re-index and partial (post-write) updates have different profiles; compare each mode on its own.'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        # tens of ms per batch up to minute-plus on heavy indexers; >1min falls in the overflow bucket
                        buckets: [10, 100, 1000, 10000, 60000]
                    labels:
                        # indexer technical name, passed through unmapped (known core: product.indexer, category.indexer, ...; plugin indexers expected)
                        indexer:
                            policy: open
                        mode:
                            allowed_values: [full, partial]
                        result:
                            allowed_values: [success, failed]

                indexer.batch.size:
                    # records handled per message handle; paired with run.duration this gives per-record indexing cost
                    description: 'Records processed per entity indexer run (EntityIndexingMessage id count)'
                    type: 'histogram'
                    parameters:
                        # anchored on the default iterate page size of 50 (IteratorFactory); partial updates
                        # range from single writes up to a few hundred ids on bulk writes
                        buckets: [1, 10, 50, 100, 250, 500]
                    labels:
                        indexer:
                            policy: open
                        mode:
                            allowed_values: [full, partial]

                dal.search.duration:
                    description: 'Duration of DAL read/search/aggregate operations. The es_aware and backend labels together reveal OpenSearch scaling possibilities: es_aware=yes with backend=sql marks a query eligible for OpenSearch but served by SQL. Each operation is measured once per top-level call (a search does not double-count its internal id-search/aggregate), so operation samples can be compared or summed without overlap.'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        # sub-ms indexed lookups up to multi-hundred-ms complex searches/aggregations
                        buckets: [0.5, 1, 2, 5, 10, 25, 50, 100, 250, 500]
                    labels:
                        # known core groups: product, category, customer, order, media, content, cms, rule, system, b2b, other
                        entity_group:
                            policy: open # bounded by the entity_group mapping
                        operation:
                            allowed_values: [search, searchIds, aggregate]
                        es_aware:
                            allowed_values: ['yes', 'no']
                        # elasticsearch when the ES bundle served the result, else sql (bundle inactive or ES fell back to SQL);
                        # es_aware=no with backend=elasticsearch is impossible
                        backend:
                            allowed_values: [sql, elasticsearch]

                database.locks.count:
                    description: 'Number of database locks'
                    enabled: true
                    type: 'counter'

                cart.calculation.duration:
                    description: 'Cart calculation wall time'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        buckets: [1, 10, 50, 100, 500, 1000, 2500]
                    labels:
                        sales_channel_type:
                            policy: open # bounded by the sales_channel_type mapping
                        # 'no' for failed calculations: the resulting cart is unknown
                        has_promotions:
                            allowed_values: ['yes', 'no']
                        # failed calculations are timed too, kept out of the healthy distribution
                        result:
                            allowed_values: [success, failed]

                cart.line_items.count:
                    description: 'Line items at end of cart calculation'
                    type: 'histogram'
                    parameters:
                        buckets: [1, 5, 20, 50, 100, 250]
                    labels:
                        sales_channel_type:
                            policy: open # bounded by the sales_channel_type mapping

                cart.errors.count:
                    # per-calculation count of warning/error entries (notices excluded); spikes flag checkout friction
                    description: 'Warning/error cart errors present after calculation (informational notices excluded)'
                    type: 'counter'

                order.placed.count:
                    description: 'Orders placed'
                    type: 'counter'
                    labels:
                        sales_channel_type:
                            policy: open # bounded by the sales_channel_type mapping
                        # Payment method technical name. Core contributes its built-in methods; plugins may widen the
                        # list with their own `add_allowed_values`. Every method not in the effective list collapses
                        # to the `other` replacement value silently, `none` marks orders with no attributable payment
                        # method. A project may close the list with `allowed_values`, which also locks it against
                        # further contributions.
                        payment_method:
                            add_allowed_values: [payment_invoicepayment, payment_prepayment, payment_cashpayment, none, other]

                order.line_items.count:
                    description: 'Line items per placed order'
                    type: 'histogram'
                    parameters:
                        buckets: [1, 2, 5, 10, 20, 50, 100, 250]
                    labels:
                        sales_channel_type:
                            policy: open # bounded by the sales_channel_type mapping

                http.server.request.duration:
                    description: 'Main HTTP request wall time until the response is sent (client-facing latency). Post-response work on kernel.terminate (e.g. buffered flow execution) is excluded.'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        # typical web requests (25ms–1s) through long-running admin/sync/import-export (up to 60s)
                        buckets: [25, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 30000, 60000]
                    labels:
                        # AreaResolver (known: storefront, store-api, admin-api, sync-api, payment, other)
                        area:
                            policy: open
                        # DomainResolver: polymorphic per area, consults the route_domain, action_domain
                        # and entity_group mappings by route shape
                        domain:
                            policy: open
                        # OperationResolver (admin-api CRUD only; none otherwise)
                        operation:
                            allowed_values: [read, write, delete, none]
                        status_class:
                            allowed_values: ['2xx', '3xx', '4xx', '5xx']

                http.server.request.queries.count:
                    description: 'SQL statements per main request'
                    type: 'histogram'
                    parameters:
                        # a handful of queries on cached/store-api requests up to thousands on import-export, indexing and sync
                        buckets: [10, 50, 200, 1000, 5000]
                    labels:
                        area:
                            policy: open
                        domain:
                            policy: open
                        operation:
                            allowed_values: [read, write, delete, none]

                http.server.request.memory.peak:
                    description: 'Peak memory per main request'
                    type: 'histogram'
                    unit: 'byte'
                    parameters:
                        # 16MB–512MB covers typical requests; 1GB/2GB catch import-export, indexing and other heavy jobs
                        buckets: [16777216, 33554432, 67108864, 134217728, 268435456, 536870912, 1073741824, 2147483648]
                    labels:
                        area:
                            policy: open
                        domain:
                            policy: open
                        operation:
                            allowed_values: [read, write, delete, none]

                number_range.allocation.duration:
                    # IncrementStorage::reserve duration; rising p95/p99 with storage=mysql under order load =
                    # number_range_state row-lock contention, the leading indicator for switching to the Redis storage
                    description: 'Number range increment reservation duration, per type/storage/outcome'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        # single indexed statement; anything beyond tens of ms indicates lock contention
                        buckets: [1, 5, 10, 50, 100, 1000]
                    labels:
                        number_range_type:
                            policy: open # bounded by the number_range_type mapping
                        # configured storage key (known core: mysql, redis; plugin-registered backends pass through)
                        storage:
                            policy: open
                        # a reserve failing on lock wait timeout is the contention signal itself
                        result:
                            allowed_values: [success, failed]

                api.sync.operations.count:
                    description: 'Operations per Sync API request'
                    type: 'histogram'
                    parameters:
                        buckets: [1, 5, 10, 25, 50, 100, 500]

                api.sync.entities.affected:
                    # pre-aggregated per request: one emit per (entity_group, action) pair
                    description: 'Entities written/deleted via the Sync API, per entity group and action'
                    type: 'counter'
                    labels:
                        entity_group:
                            policy: open # bounded by the entity_group mapping
                        action:
                            allowed_values: [upsert, delete]

                api.sync.duration:
                    description: 'Total Sync API request duration'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        # small payloads up to bulk imports
                        buckets: [10, 100, 1000, 10000, 60000, 300000]
                    labels:
                        # 'default' = no explicit behavior requested (synchronous indexing)
                        indexing_behavior:
                            allowed_values: ['use-queue-indexing', 'disable-indexing', 'default']
                        # failed requests are timed too, kept out of the healthy distribution
                        result:
                            allowed_values: [success, failed]

                flow.execution.duration:
                    # end-to-end flow engine wall time; one inbound event fans out across all matched flows, each timed separately.
                    # heavy actions that offload to queue (mail, webhooks) are not included in the flow engine wall time
                    # and are covered by the queue metrics.
                    # the result label keeps failed-run latency out of the healthy distribution.
                    description: 'Flow execution wall time per matched flow, per trigger group and outcome'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        buckets: [1, 10, 50, 100, 500, 1000, 5000]
                    labels:
                        trigger_group:
                            policy: open # bounded by the flow_trigger_group mapping
                        result:
                            allowed_values: [success, failed]

                mail.send.count:
                    # result=sent means the mail was handed off (default delivery is async), not delivered;
                    # actual delivery is covered by messenger.message.handled.count (message_group=mail)
                    description: 'Mail send handoffs, per mail group and outcome'
                    type: 'counter'
                    labels:
                        # keyed by the triggering event name; mails sent outside a flow resolve to `other`
                        mail_group:
                            policy: open # bounded by the mail_group mapping
                        result:
                            allowed_values: [sent, failed]

                mail.send.duration:
                    # AbstractMailSender::send() enqueues the mail and returns before the transport runs, so this is
                    # the handoff time, not the SMTP round-trip (that runs in a worker: messenger.message.handling.duration,
                    # message_group=mail). Only a synchronous mailer transport (uncommon in prod) makes this the full send.
                    description: 'Mail send handoff duration (AbstractMailSender::send)'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        buckets: [10, 50, 100, 500, 1000, 5000, 30000]
                    labels:
                        # failures are timed too, but kept out of the healthy distribution
                        result:
                            allowed_values: [sent, failed]
