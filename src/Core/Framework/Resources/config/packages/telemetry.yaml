shopware:
    telemetry:
        metrics:
            namespace: 'io.opentelemetry.contrib.php.shopware'

            definitions:
                plugin.install.count:
                    description: 'Number of plugin installations'
                    type: 'counter'

                app.install.count:
                    description: 'Number of app installations'
                    type: 'counter'

                cache.invalidate.count:
                    description: 'Number of cache invalidations'
                    type: 'counter'

                messenger.message.size:
                  description: 'Size of the message in bytes'
                  enabled: true
                  type: 'histogram'
                  unit: 'byte'
                  parameters:
                    buckets: [0, 512, 1024, 2048, 4096, 8192, 16384, 32768]

                dal.associations.count:
                    description: 'Number of associations loaded'
                    type: 'histogram'

                indexer.run.duration:
                    # the result label keeps failed-run latency out of the healthy distribution.
                    description: 'Duration of a single entity indexer run (EntityIndexer::handle), per indexer/mode/outcome. Full re-index and partial (post-write) updates have different profiles; compare each mode on its own.'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        # tens of ms per batch up to minute-plus on heavy indexers; >1min falls in the overflow bucket
                        buckets: [10, 100, 1000, 10000, 60000]
                    labels:
                        # indexer technical name, passed through unmapped (known core: product.indexer, category.indexer, ...; plugin indexers expected)
                        indexer:
                            policy: open
                        mode:
                            allowed_values: [full, partial]
                        result:
                            allowed_values: [success, failed]

                indexer.batch.size:
                    # records handled per message handle; paired with run.duration this gives per-record indexing cost
                    description: 'Records processed per entity indexer run (EntityIndexingMessage id count)'
                    type: 'histogram'
                    parameters:
                        # anchored on the default iterate page size of 50 (IteratorFactory); partial updates
                        # range from single writes up to a few hundred ids on bulk writes
                        buckets: [1, 10, 50, 100, 250, 500]
                    labels:
                        indexer:
                            policy: open
                        mode:
                            allowed_values: [full, partial]

                database.locks.count:
                    description: 'Number of database locks'
                    enabled: true
                    type: 'counter'
