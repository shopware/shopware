shopware:
    telemetry:
        metrics:
            namespace: 'io.opentelemetry.contrib.php.shopware'

            definitions:
                plugin.install.count:
                    description: 'Number of plugin installations'
                    type: 'counter'

                app.install.count:
                    description: 'Number of app installations'
                    type: 'counter'

                cache.invalidate.count:
                    description: 'Number of cache invalidations'
                    type: 'counter'

                messenger.message.size:
                  description: 'Size of the message in bytes'
                  enabled: true
                  type: 'histogram'
                  unit: 'byte'
                  parameters:
                    buckets: [0, 512, 1024, 2048, 4096, 8192, 16384, 32768]

                dal.associations.count:
                    description: 'Number of associations loaded'
                    type: 'histogram'

                database.locks.count:
                    description: 'Number of database locks'
                    enabled: true
                    type: 'counter'

                cart.calculation.duration:
                    description: 'Cart calculation wall time'
                    type: 'histogram'
                    unit: 'ms'
                    parameters:
                        buckets: [1, 10, 50, 100, 500, 1000, 2500]
                    labels:
                        # SalesChannelTypeResolver (known: storefront, api, product_comparison, agentic_commerce)
                        sales_channel_type:
                            policy: open
                        has_promotions:
                            allowed_values: ['yes', 'no']

                cart.line_items.count:
                    description: 'Line items at end of cart calculation'
                    type: 'histogram'
                    parameters:
                        buckets: [1, 5, 20, 50, 100, 250]
                    labels:
                        sales_channel_type:
                            policy: open

                cart.errors.count:
                    # per-calculation count of warning/error entries (notices excluded); spikes flag checkout friction
                    description: 'Warning/error cart errors present after calculation (informational notices excluded)'
                    type: 'counter'

                order.placed.count:
                    description: 'Orders placed'
                    type: 'counter'
                    labels:
                        # SalesChannelTypeResolver (known: storefront, api, product_comparison, agentic_commerce)
                        sales_channel_type:
                            policy: open
                        # Payment method technical name. Default core config allows its built-in methods; every other
                        # (plugin/app) method collapses to the `other` replacement value, while `none` marks orders
                        # with no attributable payment method. Deployments widen this list to surface further providers.
                        payment_method:
                            allowed_values: [payment_invoicepayment, payment_prepayment, payment_cashpayment, none, other]

                order.line_items.count:
                    description: 'Line items per placed order'
                    type: 'histogram'
                    parameters:
                        buckets: [1, 2, 5, 10, 20, 50, 100, 250]
                    labels:
                        sales_channel_type:
                            policy: open
