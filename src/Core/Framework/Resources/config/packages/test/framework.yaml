parameters:
    '.container.dumper.inline_class_loader': false
    '.container.dumper.inline_factories': false

framework:
    test: true
    http_cache:
        enabled: false
    session:
        storage_factory_id: session.storage.factory.mock_file
    profiler:
        collect: false
    cache:
        app: cache.adapter.array
        system: cache.adapter.array
        pools:
            # These pools must survive a kernel service reset (e.g. worker mode
            # runtimes), so they cannot be stored in process memory.
            cache.object:
                adapter: cache.adapter.filesystem
            cache.http:
                adapter: cache.adapter.filesystem
            cache.rate_limiter:
                adapter: cache.adapter.filesystem
            cache.serializer:
                adapter: cache.adapter.array
            cache.annotations:
                adapter: cache.adapter.array
            cache.property_info:
                adapter: cache.adapter.array
            cache.messenger:
                adapter: cache.adapter.array
            cache.property_access:
                adapter: cache.adapter.array
