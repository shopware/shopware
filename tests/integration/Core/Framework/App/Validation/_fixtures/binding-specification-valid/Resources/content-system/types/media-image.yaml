meta:
  label: "Media Image"
  description: "Fixture image type shipping a valid inline binding on its own type."
  icon: "regular-image"
  category: "content"
  copilot:
    summary: "Fixture image element."
    hints:
      - "Requires a media entity."

properties:
  mediaId:
    type: string
    title: "Media ID"
    description: "Stored media id used for entity loading."
    adminUI:
      component: "media-field"

  media:
    type: Shopware\Core\Content\Media\MediaEntity
    required: true
    title: "Media"
    description: "Hydrated media entity resolved from mediaId."

bindings:
  good-media-binding:
    label: "Good wiring"
    resolves:
      media:
        loader: entity
        config:
          entity: media
          property: mediaId
