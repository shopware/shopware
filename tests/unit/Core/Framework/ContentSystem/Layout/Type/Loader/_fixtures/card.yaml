meta:
  name: "Sw:Product:Card"
  label: "Product Card"
  description: "A product card."
  vendor: "shopware AG"
  icon: "card"
  category: "commerce"
  copilot:
    summary: "Card element"
    hints:
      - "Use for products"
properties:
  product:
    type: Shopware\Core\Content\Product\ProductEntity
    required: true
    title: "Product"
    description: "The product."
  layout:
    type: string
    enum: ["box", "list"]
    default: "box"
    title: "Layout"
    description: "Layout variant."
slots:
  - name: media
    maxElements: 1
    description: "Media slot."
  - name: actions
    allowList:
      - "Sw:Action:Button"
